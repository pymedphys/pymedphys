name: Setup PyMedPhys Project
description: Standard setup for PyMedPhys CI

inputs:
  python-version:
    description: Python version to use
    default: '3.14'
  extras:
    description: Space-separated list of extras to install
    default: ''
  groups:
    description: >-
      Space-separated list of dependency groups to install. The default dev
      group, which holds everything, is never installed unless listed.
    default: ''
  install-project:
    description: Install the locked project environment
    default: 'true'
  cache-data:
    description: Restore data only for jobs that consume it
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Keep in step with the uv-lock hook in .pre-commit-config.yaml.
        version: "0.13.4"
        enable-cache: true
        # Each environment must be able to save its complete dependency set.
        # Otherwise a fast tool-only job can claim the shared immutable key.
        # setup-uv's key already includes the OS and the full Python version.
        cache-suffix: ${{ (inputs.extras || inputs.groups) && format('{0}+{1}', inputs.extras, inputs.groups) || github.job }}
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Install dependencies
      if: inputs.install-project == 'true'
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
      run: |
        set -euxo pipefail
        args=(--frozen --no-default-groups)
        for extra in $EXTRAS; do args+=(--extra "$extra"); done
        for group in $DEPENDENCY_GROUPS; do args+=(--group "$group"); done
        uv sync "${args[@]}"
        # Reuse this frozen environment without checking or resolving it again
        # for each command. `uv run --with` still creates its requested overlay.
        echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
        echo "UV_NO_DEFAULT_GROUPS=1" >> "$GITHUB_ENV"

    # Jobs that decide later whether they need data use cache-data directly.
    - name: Cache PyMedPhys data
      if: inputs.cache-data == 'true'
      uses: ./.github/actions/cache-data

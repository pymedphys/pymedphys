name: Setup PyMedPhys Project
description: Standard setup for PyMedPhys CI

inputs:
  python-version:
    description: Python version to use
    default: '3.12'
  extras:
    description: Space-separated list of extras to install
    default: ''
  install-project:
    description: Install the locked project environment
    default: 'true'
  cache-data:
    description: Restore data only for jobs that consume it
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # Keep in step with the uv-lock hook in .pre-commit-config.yaml.
        version: "0.12.15"
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Install dependencies
      if: inputs.install-project == 'true'
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        set -euxo pipefail
        if [ -n "$EXTRAS" ]; then
          uv sync --frozen $(echo $EXTRAS | xargs -n1 echo --extra)
        else
          uv sync --frozen
        fi

    - name: Cache PyMedPhys data
      if: inputs.cache-data == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pymedphys
        # The exact key is per job, so the first job to finish cannot claim a
        # shared key with an empty cache. A cold job first restores any
        # populated cache for the same manifest on the same OS (including
        # this job's cache under the previous key layout), so only the first
        # run after a manifest change contacts Zenodo, and data_path verifies
        # hashes on restored files. Never restore across manifest hashes:
        # zip_data_paths preserves existing extracted files even when it
        # replaces an outdated archive.
        key: pymedphys-data-v3-${{ runner.os }}-${{ hashFiles('**/hashes.json') }}-${{ github.job }}
        restore-keys: |
          pymedphys-data-v3-${{ runner.os }}-${{ hashFiles('**/hashes.json') }}-
          pymedphys-data-v2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/hashes.json') }}

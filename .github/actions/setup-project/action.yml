name: Setup PyMedPhys Project
description: Standard setup for PyMedPhys CI

inputs:
  python-version:
    description: Python version to use
    default: '3.12'
  extras:
    description: Space-separated list of extras to install
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Install dependencies
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        set -euxo pipefail
        if [ -n "$EXTRAS" ]; then
          uv sync --frozen $(echo $EXTRAS | xargs -n1 echo --extra)
        else
          uv sync --frozen
        fi

    - name: Cache PyMedPhys data
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.pymedphys
        # The exact key is per job, so the first job to finish cannot claim a
        # shared key with an empty cache. A cold job first restores any
        # populated cache for the same manifest on the same OS (including
        # this job's cache under the previous key layout), so only the first
        # run after a manifest change contacts Zenodo, and data_path verifies
        # hashes on restored files. Never restore across manifest hashes:
        # zip_data_paths preserves existing extracted files even when it
        # replaces an outdated archive.
        key: pymedphys-data-v3-${{ runner.os }}-${{ hashFiles('**/hashes.json') }}-${{ github.job }}
        restore-keys: |
          pymedphys-data-v3-${{ runner.os }}-${{ hashFiles('**/hashes.json') }}-
          pymedphys-data-v2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/hashes.json') }}

    - name: Set up Node.js
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

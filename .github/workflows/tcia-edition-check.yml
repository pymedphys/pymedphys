name: TCIA Edition Check

# Compare the shipped TCIA Private Tag Dictionary with TCIA's original: the
# file at the pinned URL and the shipped copy against the pin, and the page
# that links to it for editions not yet reviewed and for the CC BY 3.0 licence
# that the shipped notice relies on. Each month, or when run manually, open or
# update one issue when the dictionary needs attention. On a pull request that
# changes the dictionary, its loader, or this check, or that carries the
# check-upstream label, run the same check and fail when it does not pass.
# That failure is advisory: this workflow is not a required check, because
# TCIA's site does not always answer GitHub's runners. Merge groups never
# reach TCIA, so its availability cannot block them.
on:
  schedule:
    - cron: '17 5 5 * *'  # The 5th of each month; staggered to avoid top-of-hour congestion
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

# Read-only. Only the job that opens the issue can write, and it runs no
# repository code.
permissions:
  contents: read

concurrency:
  group: tcia-edition-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # On pull requests, whether the change touches what the check covers or
  # carries the label. Draft pull requests run no jobs, as in CI.
  select:
    name: Select
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The tested merge commit against its base parent, as CI selects checks.
      - name: Select the check
        id: select
        env:
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'check-upstream') }}
        run: |
          covered='^(lib/pymedphys/_dicom/deidentify/_tcia/|lib/pymedphys/_dicom/deidentify/tcia_private_tags\.py$|lib/pymedphys/_dev/(tcia|tg263)_edition_check\.py$|lib/pymedphys/_data/download\.py$|\.github/workflows/tcia-edition-check\.yml$)'
          if [[ "${LABELLED}" == "true" ]]; then
            run=true
          elif ! changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"; then
            # A diff that cannot be read selects the check.
            run=true
          elif grep -Eq "${covered}" <<< "${changed}"; then
            run=true
          else
            run=false
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  check:
    name: Edition Check
    needs: [select]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.select.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      status: ${{ steps.check.outputs.status }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'user'

      # The command exits with 0 when nothing has changed, 1 when something has,
      # and 3 when the page or the pinned file could not be fetched, or the page
      # links to no edition. Its JSON report says which; a run that stops before
      # writing it has failed.
      - name: Compare TCIA's page and file, and the shipped copy, with the pin
        id: check
        run: |
          set +e
          uv run --no-sync pymedphys dev tcia-check \
            --json "${RUNNER_TEMP}/edition-check.json" \
            | tee "${RUNNER_TEMP}/edition-check.txt"
          code="${PIPESTATUS[0]}"
          set -e
          status="$(jq -r '.status' "${RUNNER_TEMP}/edition-check.json" 2> /dev/null || true)"
          case "${status}" in
            unchanged | changed | failed) ;;
            *) status=failed ;;
          esac
          delimiter="report-$(openssl rand -hex 16)"
          {
            echo "status=${status}"
            echo "report<<${delimiter}"
            cat "${RUNNER_TEMP}/edition-check.txt"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
          exit "${code}"

  # Scheduled and manual runs only: a pull request's failure is its check's.
  report:
    name: Report
    needs: [check]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.check.outputs.status != 'unchanged' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the edition-check issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ needs.check.outputs.status }}
          REPORT: ${{ needs.check.outputs.report }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="TCIA edition check: the Private Tag Dictionary needs attention"
          if [[ "${STATUS}" == "changed" ]]; then
            summary="On \`${REF_NAME}\`, the shipped TCIA Private Tag Dictionary or the file at its pinned URL no longer matches the pin, or TCIA's page links to an edition not yet reviewed, or no longer links to the pinned file or to the CC BY 3.0 licence."
          else
            summary="The TCIA edition check on \`${REF_NAME}\` could not fetch TCIA's page or the pinned file, found no edition linked from the page, or did not finish."
          fi
          body="${RUNNER_TEMP}/body.md"
          {
            echo "${summary}"
            echo
            echo '```text'
            echo "${REPORT:-The check wrote no report; see the run log.}"
            echo '```'
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "Review each new edition and TCIA's licence terms. To move to a new edition, replace the file in \`lib/pymedphys/_dicom/deidentify/_tcia/\` with TCIA's, unchanged, update \`PIN\` in \`lib/pymedphys/_dicom/deidentify/tcia_private_tags.py\` and the notice beside the file, and add every reviewed edition that is not pinned, including the one the pin moves away from, to \`REVIEWED\` in \`lib/pymedphys/_dev/tcia_edition_check.py\`."
          } > "${body}"
          number=$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "map(select(.title == \"${title}\")) | first | .number // empty")
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --body-file "${body}"
          else
            gh issue create --title "${title}" --body-file "${body}"
          fi

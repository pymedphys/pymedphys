name: Pre-commit

on:
  workflow_call:
    secrets:
      PYMEDPHYS_CI_BOT_ID:
        description: App ID for pymedphys-ci-bot GitHub App.
        required: false
      PYMEDPHYS_CI_BOT_TOKEN:
        description: Private key for pymedphys-ci-bot GitHub App.
        required: false
    outputs:
      autofix-pushed:
        description: "'true' if an auto-fix commit was pushed (a new CI run is expected)"
        value: ${{ jobs.pre-commit.outputs.autofix-pushed }}
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    outputs:
      autofix-pushed: ${{ steps.autofix.outputs.pushed }}

    steps:
      - name: Check for bot credentials
        id: check-bot
        run: |
          if [[ -n "$BOT_APP_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BOT_APP_ID: ${{ secrets.PYMEDPHYS_CI_BOT_ID }}

      - name: Generate bot token
        id: bot-token
        if: steps.check-bot.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PYMEDPHYS_CI_BOT_ID }}
          private-key: ${{ secrets.PYMEDPHYS_CI_BOT_TOKEN }}
          # The token only ever pushes the auto-fix commit.
          permission-contents: write

      # No credentials stay in the checkout while the hooks run; the auto-fix
      # push authenticates explicitly below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          install-project: 'false'

      # Hook environments are independent of the package. Constrain the tool
      # and every transitive dependency to the same lockfile as development.
      - name: Export locked tool constraints
        run: >-
          uv export --frozen --extra dev --no-emit-project --no-hashes
          --output-file "$RUNNER_TEMP/pre-commit-constraints.txt"

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        id: pre-commit
        continue-on-error: true
        run: |
          uvx --constraints "$RUNNER_TEMP/pre-commit-constraints.txt" pre-commit run --all-files --show-diff-on-failure

      # Fork PRs are skipped: neither the bot token nor GITHUB_TOKEN can push
      # to a fork. The push targets the head repository, the same one checked
      # out above, which the guard makes equal to this repository.
      - name: Push auto-fixes
        if: |
          steps.pre-commit.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        id: autofix
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUSH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Re-run pre-commit to apply auto-fixes (formatters, trailing whitespace, etc.)
          uvx --constraints "$RUNNER_TEMP/pre-commit-constraints.txt" pre-commit run --all-files || true

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.email "bot@pymedphys.com"
            git config user.name "PyMedPhys Bot"
            git add -A
            git commit -m "style: auto-fix pre-commit issues"
            # Git redacts the credential in its own output; the token is a masked secret.
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${PR_BRANCH}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Auto-fix commit pushed. A new CI run will validate the fixes."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pre-commit failed but no auto-fixable changes detected."
          fi

      - name: Fail if pre-commit found issues
        if: steps.pre-commit.outcome == 'failure'
        env:
          AUTOFIX_PUSHED: ${{ steps.autofix.outputs.pushed }}
        run: |
          if [[ "${AUTOFIX_PUSHED}" == "true" ]]; then
            echo "::error::Pre-commit failed. Auto-fix commit has been pushed to this branch."
            echo "A new CI run should start automatically."
          else
            echo "::error::Pre-commit failed. Some issues require manual fixes."
          fi
          exit 1

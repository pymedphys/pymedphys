name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: publish to TestPyPI only. false: publish to PyPI only."
        type: boolean
        default: true

# Read-only by default. The publish jobs request id-token: write for trusted
# publishing and the asset upload requests contents: write.
permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  type-check:
    uses: ./.github/workflows/type-check.yml

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    with:
      quick: false

  integration-tests:
    needs: [unit-tests]
    uses: ./.github/workflows/integration-tests.yml
    with:
      run-slow: true

  # Build the package and verify it installs cleanly.
  build:
    needs: [lint, type-check, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'dev tests'

      # Plain uv build makes the sdist, then the wheel from it, so a file
      # missing from the sdist also fails the wheel checks below.
      - name: Build distributions
        run: |
          uv build
          uvx twine==7.0.0 check dist/*

      # Checks both archives' contents, installs the wheel into a fresh venv,
      # and, for a published release, requires the tag to be v<version>.
      - name: Check distributions
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            python .github/scripts/check_distributions.py dist --expected-version "$TAG"
          else
            python .github/scripts/check_distributions.py dist
          fi

      # The wheel filename carries the normalised version.
      - name: Record the version
        id: version
        run: |
          wheel=$(basename dist/*.whl)
          version=${wheel#pymedphys-}
          echo "version=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Publish to TestPyPI for manual dry-run dispatches.
  publish-testpypi:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pymedphys
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Skipping files already on the index makes a re-run safe after a
      # partial upload. verify-published catches an existing file whose
      # contents differ from this build.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Publish to PyPI for real releases or explicit non-dry-run dispatches.
  publish-pypi:
    needs: [build]
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymedphys
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # See publish-testpypi for skip-existing.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # Upload release assets only on a real GitHub release.
  upload-release-assets:
    needs: [publish-pypi]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  # Install what the index now serves, the wheel and the sdist separately, on
  # each OS, and require the files to match the ones built and tested above.
  # After a TestPyPI rehearsal this also exercises the job before a release;
  # packages resolved from TestPyPI are untrusted, and this job holds no
  # secrets or write permissions.
  verify-published:
    name: Verify published (${{ matrix.os }})
    needs: [build, publish-testpypi, publish-pypi]
    if: >-
      always() &&
      (needs.publish-pypi.result == 'success' ||
       needs.publish-testpypi.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # --wait covers the short delay before new files appear on the index.
      - name: Install and check the published wheel and sdist
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          INDEX: ${{ needs.publish-pypi.result == 'success' && 'pypi' || 'testpypi' }}
        run: >-
          python .github/scripts/check_distributions.py
          --published "$VERSION" --index "$INDEX" --compare-with dist
          --report-dir reports --wait 600

      - name: Upload installation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-reports-${{ matrix.os }}
          path: reports/
          retention-days: 30

  summary:
    name: Release Summary
    needs:
      - lint
      - type-check
      - unit-tests
      - integration-tests
      - build
      - publish-testpypi
      - publish-pypi
      - upload-release-assets
      - verify-published
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create release summary
        env:
          VERSION: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run || 'N/A (release event)' }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPE_CHECK_RESULT: ${{ needs.type-check.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TESTPYPI_RESULT: ${{ needs.publish-testpypi.result || 'skipped' }}
          PYPI_RESULT: ${{ needs.publish-pypi.result || 'skipped' }}
          ASSETS_RESULT: ${{ needs.upload-release-assets.result || 'skipped' }}
          VERIFY_RESULT: ${{ needs.verify-published.result || 'skipped' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Release Summary

          **Version:** ${VERSION}
          **Event:** ${EVENT_NAME}
          **Dry Run:** ${DRY_RUN}

          ### Quality Checks
          | Check | Status |
          |-------|--------|
          | Lint | ${LINT_RESULT} |
          | Type Check | ${TYPE_CHECK_RESULT} |
          | Unit Tests | ${UNIT_TESTS_RESULT} |
          | Integration Tests | ${INTEGRATION_TESTS_RESULT} |
          | Build | ${BUILD_RESULT} |

          ### Publishing
          | Target | Status |
          |--------|--------|
          | TestPyPI | ${TESTPYPI_RESULT} |
          | PyPI | ${PYPI_RESULT} |
          | GitHub release assets | ${ASSETS_RESULT} |
          | Published-file checks | ${VERIFY_RESULT} |
          EOF

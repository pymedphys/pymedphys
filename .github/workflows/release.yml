name: Release

# Publishing a GitHub release or pre-release is the only way to publish. To
# retry a release whose run never started, delete the GitHub release, keeping
# its tag, and publish it again.
on:
  release:
    types: [published]

# Read-only by default. The publish job requests id-token: write for trusted
# publishing and the asset upload requests contents: write.
permissions:
  contents: read

# Serialise attempts for the same tag; never cancel publishing in progress.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  type-check:
    uses: ./.github/workflows/type-check.yml

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    with:
      quick: false

  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    with:
      run-slow: true
      run-wheel-build: false

  # Build once, in parallel with validation. Publishing waits for every gate.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          install-project: 'false'

      # Plain uv build makes the sdist, then the wheel from it, so a file
      # missing from the sdist also fails the wheel checks below.
      - name: Build distributions
        run: |
          uv build
          uvx twine==7.0.0 check dist/*

      # Checks both archives' contents, installs the wheel into a fresh venv,
      # and requires the tag to be v<version>.
      - name: Check distributions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::The release tag $TAG must be v followed by the package version."
               exit 1 ;;
          esac
          python .github/scripts/check_distributions.py dist --expected-version "$TAG"

      # The wheel filename carries the normalised version.
      - name: Record the version
        id: version
        run: |
          wheel=$(basename dist/*.whl)
          version=${wheel#pymedphys-}
          echo "version=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish-pypi:
    needs: [lint, type-check, unit-tests, integration-tests, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymedphys
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Skipping files already on the index makes a re-run safe after a
      # partial upload. verify-published catches an existing file whose
      # contents differ from this build.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # Only replace release assets after proving that they match PyPI. A skipped
  # duplicate upload alone does not prove that the existing bytes agree.
  upload-release-assets:
    needs: [publish-pypi, verify-published]
    if: >-
      !cancelled() && needs.publish-pypi.result == 'success' &&
      needs.verify-published.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

      # Read the assets back: the release must offer exactly the verified
      # files, with no stale pymedphys archive left from an earlier attempt.
      - name: Check the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern 'pymedphys-*' --dir assets
          (cd dist && sha256sum -- *) > built.sha256
          (cd assets && sha256sum -- *) > assets.sha256
          diff built.sha256 assets.sha256

  # Install what PyPI now serves, the wheel and the sdist separately, on each
  # OS, and require the files to match the ones built and tested above. Reuse
  # that fresh wheel environment for the test suite, with dependencies resolved
  # from PyPI and no restored package/data cache. Assets wait for these tests too.
  verify-published:
    name: Verify and test published (${{ matrix.os }})
    needs: [build, publish-pypi]
    if: >-
      !cancelled() && needs.publish-pypi.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # --wait covers the short delay before new files appear on the index.
      - name: Verify both published archives and test the wheel
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python .github/scripts/check_distributions.py
          --published "$VERSION" --compare-with dist
          --report-dir reports --wait 600 --tests --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload installation and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-reports-${{ matrix.os }}
          path: reports/
          retention-days: 30

  # Fails unless every job succeeded, so a green summary means the release is
  # complete. It is not a pull request check.
  summary:
    name: Release Summary
    needs:
      - lint
      - type-check
      - unit-tests
      - integration-tests
      - build
      - publish-pypi
      - upload-release-assets
      - verify-published
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check that every job succeeded
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python .github/scripts/check_workflow_status.py --title 'Release Summary'

      - name: Write the record for the release pull request
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version || github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          if [ "$GATE" = "success" ]; then
            result="passed; every job succeeded"
          else
            result="failed; see the table above"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ## Record for the release pull request

          ~~~markdown
          - Version: ${VERSION} at ${COMMIT}
          - Release workflow run: ${RUN_URL}
          - Release Summary: ${result}
          ~~~
          EOF

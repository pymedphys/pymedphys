name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Publish to TestPyPI only (true) or also to PyPI (false)"
        type: boolean
        default: true

# Read-only by default. The publish jobs request id-token: write for trusted
# publishing and the asset upload requests contents: write.
permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  type-check:
    uses: ./.github/workflows/type-check.yml

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    with:
      quick: false

  integration-tests:
    needs: [unit-tests]
    uses: ./.github/workflows/integration-tests.yml
    with:
      run-slow: true

  # Build the package and verify it installs cleanly.
  build:
    needs: [lint, type-check, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'dev tests'

      - name: Build distributions
        run: |
          uv build --wheel --sdist
          uvx twine==7.0.0 check dist/*

      - name: Test installation
        run: |
          uv venv test-env
          uv pip install --python test-env/bin/python dist/*.whl
          test-env/bin/pymedphys --version
          test-env/bin/python -c "import pymedphys; print(pymedphys.__version__)"

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Publish to TestPyPI for manual dry-run dispatches.
  publish-testpypi:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pymedphys
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # Publish to PyPI for real releases or explicit non-dry-run dispatches.
  publish-pypi:
    needs: [build]
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymedphys
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Upload release assets only on a real GitHub release.
  upload-release-assets:
    needs: [publish-pypi]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  summary:
    needs: [lint, type-check, unit-tests, integration-tests, build, publish-testpypi, publish-pypi]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create release summary
        env:
          VERSION: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run || 'N/A (release event)' }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPE_CHECK_RESULT: ${{ needs.type-check.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TESTPYPI_RESULT: ${{ needs.publish-testpypi.result || 'skipped' }}
          PYPI_RESULT: ${{ needs.publish-pypi.result || 'skipped' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Release Summary

          **Version:** ${VERSION}
          **Event:** ${EVENT_NAME}
          **Dry Run:** ${DRY_RUN}

          ### Quality Checks
          | Check | Status |
          |-------|--------|
          | Lint | ${LINT_RESULT} |
          | Type Check | ${TYPE_CHECK_RESULT} |
          | Unit Tests | ${UNIT_TESTS_RESULT} |
          | Integration Tests | ${INTEGRATION_TESTS_RESULT} |
          | Build | ${BUILD_RESULT} |

          ### Publishing
          | Target | Status |
          |--------|--------|
          | TestPyPI | ${TESTPYPI_RESULT} |
          | PyPI | ${PYPI_RESULT} |
          EOF

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

# Default to read-only. Jobs that need more override at the job level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # New commits supersede obsolete PR/main runs; label changes still queue.
  cancel-in-progress: >-
    ${{ (github.event_name == 'pull_request' &&
        github.event.action != 'labeled' &&
        github.event.action != 'unlabeled') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-python: ${{ steps.select.outputs.run-python }}
      run-integration: ${{ steps.select.outputs.run-integration }}
      run-doctests: ${{ steps.select.outputs.run-doctests }}
      run-slow: ${{ steps.select.outputs.run-slow }}
      run-integration-scripts: ${{ steps.select.outputs.run-integration-scripts }}
      run-packaging: ${{ steps.select.outputs.run-packaging }}
      run-database: ${{ steps.select.outputs.run-database }}
      run-docs: ${{ steps.select.outputs.run-docs }}
      run-scripts: ${{ steps.select.outputs.run-scripts }}
      run-full-matrix: ${{ steps.select.outputs.run-full-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test selection and summary policy
        run: |
          python -m unittest discover -s .github/scripts -p 'test_select_checks.py'
          python -m unittest discover -s .github/scripts -p 'test_check_workflow_status.py'
          python -m unittest discover -s .github/scripts -p 'test_workflow_contracts.py'
      - name: Select affected checks
        id: select
        run: python .github/scripts/select_checks.py

  script-tests:
    needs: [changes]
    if: needs.changes.outputs.run-scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Selection tests scan the package for slow markers and doctests.
          sparse-checkout: |
            .github
            lib/pymedphys
      - uses: ./.github/actions/setup-project
        with:
          install-project: 'false'
      # The test runner only, hash-checked from uv.lock, in its own step.
      - name: Install the script-tests group
        run: uv sync --frozen --only-group script-tests
      # Most of the time goes on tests that build and install distributions
      # into fresh virtual environments, which are independent of each other.
      - name: Test distribution and workflow tooling
        run: uv run --no-sync pytest -n auto .github/scripts

  # Pre-commit always runs. Needs write access for auto-fix pushes on PRs.
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    permissions:
      contents: write
    secrets:
      PYMEDPHYS_CI_BOT_ID: ${{ secrets.PYMEDPHYS_CI_BOT_ID }}
      PYMEDPHYS_CI_BOT_TOKEN: ${{ secrets.PYMEDPHYS_CI_BOT_TOKEN }}

  # Selected checks start as soon as the selection is known, alongside
  # pre-commit, and run whatever its result. An auto-fix pushed with the bot's
  # token starts a new run, which cancels this one.
  lint:
    needs: [changes]
    if: needs.changes.outputs.run-python == 'true'
    uses: ./.github/workflows/lint.yml

  type-check:
    needs: [changes]
    if: needs.changes.outputs.run-python == 'true'
    uses: ./.github/workflows/type-check.yml

  unit-tests:
    needs: [changes]
    if: needs.changes.outputs.run-python == 'true'
    uses: ./.github/workflows/unit-tests.yml
    with:
      # The selector owns the full-test label. Only an explicit false keeps the
      # quick matrix, so a missing or invalid output runs the full matrix.
      quick: ${{ needs.changes.outputs.run-full-matrix == 'false' }}

  # Extended checks share selection outputs with the required summary.
  integration-tests:
    needs: [changes]
    if: needs.changes.outputs.run-integration == 'true'
    uses: ./.github/workflows/integration-tests.yml
    with:
      # Only explicit false skips a component; absent outputs keep coverage.
      run-doctests: ${{ needs.changes.outputs.run-doctests != 'false' }}
      run-slow: ${{ needs.changes.outputs.run-slow != 'false' }}
      run-scripts: ${{ needs.changes.outputs.run-integration-scripts != 'false' }}
      run-packaging: ${{ needs.changes.outputs.run-packaging != 'false' }}

  mosaiq-db-tests:
    needs: [changes]
    if: needs.changes.outputs.run-database == 'true'
    uses: ./.github/workflows/mosaiq-db-tests.yml

  docs-check:
    needs: [changes]
    if: needs.changes.outputs.run-docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read

  # main-integrity requires the exact check name "CI Summary".
  # See the contributor workflow guide before changing this name or its needs.
  # The summary must fail when a required check fails or never runs.
  summary:
    name: CI Summary
    needs: [changes, pre-commit, lint, type-check, unit-tests, integration-tests, mosaiq-db-tests, docs-check, script-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required status and generate summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python .github/scripts/check_workflow_status.py
          --title 'CI Results'
          --conditional lint=run-python
          --conditional type-check=run-python
          --conditional unit-tests=run-python
          --conditional script-tests=run-scripts
          --conditional integration-tests=run-integration
          --conditional mosaiq-db-tests=run-database
          --conditional docs-check=run-docs

  # Merge groups use the quick unit matrix, so a push to main can be the first
  # run to show a platform failure from the full matrix.
  # Record it in an issue rather than only in the Actions tab.
  report-main-failure:
    needs: [summary]
    if: failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failed on main"
          body="CI failed on main at $COMMIT: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

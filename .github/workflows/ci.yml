name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:

# Default to read-only. Jobs that need more override at the job level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-integration: >-
        ${{ github.event_name == 'push' ||
            contains(github.event.pull_request.labels.*.name, 'full-test') }}
      run-database: >-
        ${{ github.event_name == 'push' ||
            contains(github.event.pull_request.labels.*.name, 'full-test') ||
            contains(github.event.pull_request.labels.*.name, 'database') ||
            steps.filter.outputs.mosaiq == 'true' }}
      run-docs: >-
        ${{ github.event_name == 'pull_request' &&
            steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Test workflow status validation
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            mosaiq:
              - 'lib/pymedphys/**/*mosaiq*'
              - 'lib/pymedphys/**/*mosaiq*/**'
              - 'lib/pymedphys/**/*database*'
              - 'lib/pymedphys/**/*database*/**'
            docs:
              - 'docs/**'
              - 'lib/pymedphys/docs/**'
              # Autodoc and notebooks import the package implementation.
              - 'lib/pymedphys/**/*.py'
              - '*.md'
              - 'README.rst'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements-docs.txt'
              - '.readthedocs.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'
              - '.github/actions/setup-project/**'
              - '.github/scripts/**'

  # Pre-commit always runs. Needs write access for auto-fix pushes on PRs.
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    permissions:
      contents: write
    secrets:
      PYMEDPHYS_CI_BOT_ID: ${{ secrets.PYMEDPHYS_CI_BOT_ID }}
      PYMEDPHYS_CI_BOT_TOKEN: ${{ secrets.PYMEDPHYS_CI_BOT_TOKEN }}

  # Linting — skip if pre-commit pushed an auto-fix (a fresh run is coming).
  lint:
    needs: [pre-commit]
    if: |
      (success() || failure()) &&
      needs.pre-commit.outputs.autofix-pushed != 'true'
    uses: ./.github/workflows/lint.yml

  # Type checking — skip if auto-fix pushed.
  type-check:
    needs: [pre-commit]
    if: |
      (success() || failure()) &&
      needs.pre-commit.outputs.autofix-pushed != 'true'
    uses: ./.github/workflows/type-check.yml

  # Unit tests — skip if auto-fix pushed.
  unit-tests:
    needs: [pre-commit]
    if: |
      (success() || failure()) &&
      needs.pre-commit.outputs.autofix-pushed != 'true'
    uses: ./.github/workflows/unit-tests.yml
    with:
      quick: >-
        ${{ github.event_name == 'pull_request' &&
            !contains(github.event.pull_request.labels.*.name, 'full-test') }}

  # Extended checks share selection outputs with the required summary.
  integration-tests:
    needs: [pre-commit, changes, unit-tests]
    if: |
      needs.pre-commit.outputs.autofix-pushed != 'true' &&
      needs.changes.outputs.run-integration == 'true'
    uses: ./.github/workflows/integration-tests.yml
    with:
      run-slow: ${{ needs.changes.outputs.run-integration == 'true' }}

  mosaiq-db-tests:
    needs: [pre-commit, changes]
    if: |
      (success() || failure()) &&
      needs.pre-commit.outputs.autofix-pushed != 'true' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run-database == 'true'
    uses: ./.github/workflows/mosaiq-db-tests.yml

  docs-check:
    needs: [pre-commit, changes]
    if: |
      needs.pre-commit.outputs.autofix-pushed != 'true' &&
      needs.changes.outputs.run-docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read

  # The summary must fail when a required check fails or never runs.
  summary:
    needs: [changes, pre-commit, lint, type-check, unit-tests, integration-tests, mosaiq-db-tests, docs-check]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Check required status and generate summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python .github/scripts/check_workflow_status.py
          --title 'CI Results'
          --conditional integration-tests=run-integration
          --conditional mosaiq-db-tests=run-database
          --conditional docs-check=run-docs

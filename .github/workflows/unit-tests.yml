name: Unit Tests

on:
  workflow_call:
    inputs:
      python-matrix:
        required: false
        type: string
        default: '["3.12", "3.13", "3.14"]'
      extra-pytest-args:
        required: false
        type: string
        default: ""
      quick:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Two pytest workers share the runner. Keep Numba's parallel kernels exercised
# with two threads each, and keep other numerical thread pools to one thread.
env:
  NUMBA_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  # The longest unit-test runs, on Ubuntu with Python 3.14 and at the
  # dependency floors, each run in two parts on two runners, since on a slow
  # runner the whole suite at once can reach the time limit. The corpus-runs
  # part runs these modules, which run the synthetic collection through the
  # engine and take about half the suite's time; the others part ignores
  # them, so it runs every other test, including any module added later.
  CORPUS_RUN_TESTS: >-
    lib/pymedphys/tests/dicom/test_deidentify_ct_defacing_run.py
    lib/pymedphys/tests/dicom/test_deidentify_corpus_end_to_end.py
    lib/pymedphys/tests/dicom/test_deidentify_conformance.py
    lib/pymedphys/tests/dicom/test_deidentify_redaction_review.py

jobs:
  test:
    name: ${{ matrix.os }} - py${{ matrix.python-version }}${{ matrix.part && format(' ({0})', matrix.part) || '' }}
    # Allow for setup and the full suite on slower Windows runners.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.quick && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python-version: ${{ inputs.quick && fromJSON('["3.14"]') || fromJSON(inputs.python-matrix) }}
        # The Ubuntu/Python 3.14 cell runs in two parts, which the
        # baseline-report job combines. An include that matches no remaining
        # combination adds one of its own, so each part is a separate job.
        exclude:
          - os: ubuntu-latest
            python-version: '3.14'
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            part: corpus-runs
          - os: ubuntu-latest
            python-version: '3.14'
            part: others
    runs-on: ${{ matrix.os }}
    env:
      # The parts' reports have names that the release's junit-*-latest-*
      # pattern leaves out; it reads their combination instead.
      REPORT: junit-${{ matrix.part && format('py{0}-{1}', matrix.python-version, matrix.part) || format('{0}-{1}', matrix.os, matrix.python-version) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          # The corpus-runs part downloads no data, so it neither restores nor
          # saves the data cache, which the parts would otherwise share.
          cache-data: ${{ matrix.part != 'corpus-runs' }}
          python-version: ${{ matrix.python-version }}
          # user is a superset of mosaiq and provides the Streamlit GUI tests
          # with the app dependencies.
          extras: 'tests'

      - name: Run unit tests
        id: tests
        shell: bash
        env:
          PYTEST_ADDOPTS: ${{ inputs.extra-pytest-args }}
          PART: ${{ matrix.part }}
        run: |
          set -euxo pipefail
          mkdir -p test-results
          # Each part runs its share of the suite: corpus-runs runs the
          # modules that CORPUS_RUN_TESTS lists and others ignores them. A
          # listed module that no longer exists fails both parts. Expand the
          # selection only when it is set, which bash before 4.4 requires.
          selection=()
          if [[ -n "${PART}" ]]; then
            read -ra listed <<< "${CORPUS_RUN_TESTS}"
            for path in "${listed[@]}"; do
              if [[ ! -f "${path}" ]]; then
                echo "::error::CORPUS_RUN_TESTS lists ${path}, which does not exist."
                exit 1
              fi
            done
            case "${PART}" in
              corpus-runs) selection=("${listed[@]}") ;;
              others) selection=("${listed[@]/#/--ignore=${GITHUB_WORKSPACE}/}") ;;
              *) echo "::error::Unknown part ${PART}."; exit 1 ;;
            esac
          fi

          # Always exclude slow tests in unit test runs.
          # Extra pytest options come from PYTEST_ADDOPTS, which pytest parses.
          # `pymedphys dev tests` changes directory to lib/pymedphys before
          # invoking pytest, so the JUnit path must be absolute for the
          # upload step (which looks in the workspace root) to find it.
          # Use a short pytest temporary root, keeping Windows DICOM release
          # paths inside the 259-character guard on every Python version.
          uv run -- pymedphys dev tests -m "not slow" ${selection[@]+"${selection[@]}"} \
            -n 2 --dist worksteal --durations=15 \
            --basetemp="${RUNNER_TEMP}/p" \
            --junitxml="${GITHUB_WORKSPACE}/test-results/${REPORT}.xml"

      - name: Record the pydicom version this part imported
        if: matrix.part
        env:
          CI_COMMIT: ${{ github.sha }}
          PART: ${{ matrix.part }}
        run: uv run -- python .github/scripts/pydicom_coverage.py part

      - name: Upload test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.REPORT }}
          path: test-results/*
          if-no-files-found: error
          retention-days: 30

  # Combine the two parts of the Ubuntu/Python 3.14 cell into that cell's one
  # report, junit-ubuntu-latest-3.14: the release's requirements matrix reads
  # it as that environment, and the pydicom-versions job reuses it when the
  # locked pydicom is the version it would test. It runs after failed tests
  # too, so the combined report shows them, but records the pydicom evidence
  # only when both parts passed and imported the same version.
  baseline-report:
    name: ubuntu-latest - py3.14 (combined report)
    needs: [test]
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          python-version: '3.14'
          install-project: 'false'

      - name: Download the parts' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-py3.14-*
          path: test-results/
          merge-multiple: true

      - name: Combine the parts' reports
        id: combine
        run: python .github/scripts/pydicom_coverage.py combine

      - name: Record the locked pydicom test evidence
        env:
          CI_COMMIT: ${{ github.sha }}
        run: python .github/scripts/pydicom_coverage.py baseline

      - name: Upload test results
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-ubuntu-latest-3.14
          path: |
            test-results/junit-ubuntu-latest-3.14.xml
            test-results/pydicom-ubuntu-latest-3.14.json
          if-no-files-found: error
          retention-days: 30

  # Each narrow extra, such as dicom, must list every package its feature uses.
  # Install one extra alone, with only the test runner, and run that feature's
  # tests: a missing package fails them. Tests of other features that sit in
  # the same folders skip themselves when their packages are missing.
  narrow-extras:
    name: Extra ${{ matrix.extra }} alone
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tests marked pydicom compare DICOM files, so they need dicom too.
          - extra: gamma
            marks: not slow and not pydicom
            paths: tests/gamma tests/interp
          - extra: dicom
            marks: not slow
            paths: tests/dicom
          - extra: mosaiq
            marks: not slow
            paths: tests/mosaiq
          - extra: icom
            marks: not slow
            paths: tests/icom
          - extra: trf
            marks: not slow
            paths: tests/trf tests/logfiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          cache-data: 'true'
          extras: ${{ matrix.extra }}
          groups: 'test-runner'

      - name: Run the feature's tests
        id: tests
        shell: bash
        env:
          PYTEST_ADDOPTS: ${{ inputs.extra-pytest-args }}
          EXTRA: ${{ matrix.extra }}
          MARKS: ${{ matrix.marks }}
          TEST_PATHS: ${{ matrix.paths }}
          # DICOM has thousands of cases; the smaller feature suites cost
          # less to run directly than to start and collect two workers.
          TEST_WORKERS: ${{ matrix.extra == 'dicom' && '2' || '0' }}
        run: |
          set -euxo pipefail
          mkdir -p test-results
          read -ra paths <<< "${TEST_PATHS}"
          # --no-sync keeps uv from installing anything beyond the extra.
          uv run --no-sync -- pymedphys dev tests -m "${MARKS}" "${paths[@]}" \
            -n "${TEST_WORKERS}" --dist worksteal --durations=15 \
            --junitxml="${GITHUB_WORKSPACE}/test-results/junit-extra-${EXTRA}.xml"

      - name: Upload test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-extra-${{ matrix.extra }}
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 30

  # The declared minimum versions of NumPy (2.0) and pandas (2.2.2) are
  # checked together, whichever matrix runs. Python 3.12 is the only supported
  # version with wheels for both: neither has any for Python 3.13 or later.
  # The suite runs in two parts, as CORPUS_RUN_TESTS describes.
  dependency-floors:
    name: NumPy and pandas minimum versions (${{ matrix.part }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [corpus-runs, others]
    runs-on: ubuntu-latest
    env:
      # PyMedPhys's extras to install, whose requirements the check below counts.
      PYMEDPHYS_EXTRAS: tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          # The corpus-runs part downloads no data, so it neither restores nor
          # saves the data cache, which the parts would otherwise share.
          cache-data: ${{ matrix.part != 'corpus-runs' }}
          python-version: '3.12'
          extras: ${{ env.PYMEDPHYS_EXTRAS }}

      - name: Run unit tests at the minimum NumPy and pandas versions
        id: tests
        shell: bash
        env:
          NUMPY_FLOOR: '2.0.2'
          PANDAS_FLOOR: '2.2.2'
          PART: ${{ matrix.part }}
        run: |
          set -euxo pipefail
          mkdir -p test-results
          # Reuse the locked environment and overlay NumPy and pandas, together
          # with the locked packages that require a newer NumPy, which the
          # overlay resolves to their latest releases that accept the NumPy
          # minimum. Invoke Python so it imports them from uv's overlay
          # environment, and fail if the overlay did not take effect.
          overlay=(uv run --no-sync --with "numpy==${NUMPY_FLOOR}" --with "pandas==${PANDAS_FLOOR}" --with tifffile --)
          "${overlay[@]}" python -c 'import os, numpy, pandas; assert (numpy.__version__, pandas.__version__) == (os.environ["NUMPY_FLOOR"], os.environ["PANDAS_FLOOR"]), (numpy.__version__, pandas.__version__)'
          # Fail if an installed package's requirements are not met, such as
          # a newly locked package that requires a newer NumPy; add it to the
          # overlay.
          "${overlay[@]}" python - <<'EOF'
          import importlib.metadata
          import os
          import sys

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          # The first distribution of each name on sys.path is the one imported.
          found = {}
          for dist in importlib.metadata.distributions():
              found.setdefault(canonicalize_name(dist.metadata["Name"]), dist)
          # Count each distribution's requirements under no extra and under each
          # extra requested of it: PyMedPhys's installed extras, and those that
          # counted requirements request in turn.
          extras = {name: {""} for name in found}
          extras["pymedphys"].update(map(canonicalize_name, os.environ["PYMEDPHYS_EXTRAS"].split()))
          counted = {}
          pending = list(found)
          while pending:
              name = pending.pop()
              for line in found[name].requires or ():
                  requirement = Requirement(line)
                  marker = requirement.marker
                  if marker and not any(marker.evaluate({"extra": extra}) for extra in extras[name]):
                      continue
                  counted[name, line] = requirement
                  required_name = canonicalize_name(requirement.name)
                  requested = set(map(canonicalize_name, requirement.extras))
                  if required_name in found and not requested <= extras[required_name]:
                      extras[required_name] |= requested
                      pending.append(required_name)
          unmet = []
          for (name, _), requirement in sorted(counted.items()):
              dist = found[name]
              required = found.get(canonicalize_name(requirement.name))
              if required is None:
                  unmet.append(f"{name} {dist.version} requires {requirement}; not installed")
              elif not requirement.specifier.contains(required.version, prereleases=True):
                  unmet.append(
                      f"{name} {dist.version} requires {requirement}; found {required.version}"
                  )
          print("\n".join(unmet) or "Every installed package's requirements are met")
          sys.exit(bool(unmet))
          EOF
          # Each part runs its share of the suite: corpus-runs runs the
          # modules that CORPUS_RUN_TESTS lists and others ignores them. A
          # listed module that no longer exists fails both parts. Expand the
          # selection only when it is set, which bash before 4.4 requires.
          selection=()
          if [[ -n "${PART}" ]]; then
            read -ra listed <<< "${CORPUS_RUN_TESTS}"
            for path in "${listed[@]}"; do
              if [[ ! -f "${path}" ]]; then
                echo "::error::CORPUS_RUN_TESTS lists ${path}, which does not exist."
                exit 1
              fi
            done
            case "${PART}" in
              corpus-runs) selection=("${listed[@]}") ;;
              others) selection=("${listed[@]/#/--ignore=${GITHUB_WORKSPACE}/}") ;;
              *) echo "::error::Unknown part ${PART}."; exit 1 ;;
            esac
          fi
          "${overlay[@]}" python -m pymedphys dev tests -m "not slow" ${selection[@]+"${selection[@]}"} \
            -n 2 --dist worksteal --durations=15 \
            --junitxml="${GITHUB_WORKSPACE}/test-results/junit-dependency-floors-${PART}.xml"

      - name: Upload test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-dependency-floors-${{ matrix.part }}
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 30

  # Cover the declared minimum and the latest release of pydicom. When a role
  # exactly matches the locked version, the normal Ubuntu/Python 3.14 suite
  # covers it. Every role records its source, and success of this reusable
  # workflow requires both the source job and its evidence upload to succeed.
  # pydicom reads and writes every file the engine handles, and its data
  # dictionary decides how an attribute of an Implicit VR file is read.
  pydicom-versions:
    name: De-identification with ${{ matrix.pydicom }} pydicom
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pydicom: [minimum, latest]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The de-identification tests read no downloaded data.
      - uses: ./.github/actions/setup-project
        with:
          python-version: '3.14'
          install-project: 'false'

      - name: Select evidence for ${{ matrix.pydicom }} pydicom
        id: coverage
        shell: bash
        env:
          PYDICOM: ${{ matrix.pydicom }}
          # Keep this minimum in step with pyproject.toml.
          PYDICOM_MINIMUM: '3.0.2'
          QUICK: ${{ inputs.quick }}
          PYTHON_MATRIX: ${{ inputs.python-matrix }}
          EXTRA_PYTEST_ARGS: ${{ inputs.extra-pytest-args }}
          CI_COMMIT: ${{ github.sha }}
        run: |
          set -euxo pipefail
          minimum=$(python .github/scripts/pydicom_coverage.py minimum)
          if [[ "${PYDICOM}" == minimum ]]; then
            version="${minimum}"
          else
            # Resolve afresh: uv run --with retains a satisfying locked version.
            pinned=$(uv pip compile --python-version 3.14 --no-deps --no-header --no-annotate --quiet - <<< "pydicom>=${minimum}")
            version="${pinned#pydicom==}"
          fi
          PYDICOM_VERSION="${version}" python .github/scripts/pydicom_coverage.py plan

      - uses: ./.github/actions/setup-project
        # Missing outputs select execution; malformed plans fail their step.
        if: steps.coverage.outputs.reuse != 'true'
        with:
          python-version: '3.14'
          extras: 'tests'

      - name: Run the de-identification tests with ${{ matrix.pydicom }} pydicom
        id: tests
        if: steps.coverage.outputs.reuse != 'true'
        shell: bash
        env:
          PYDICOM: ${{ matrix.pydicom }}
          PYDICOM_VERSION: ${{ steps.coverage.outputs.version }}
        run: |
          set -euxo pipefail
          mkdir -p test-results
          # Reuse the locked environment and overlay only pydicom. Invoke
          # Python so it imports pydicom from uv's overlay environment, print
          # the version tested, and fail if the overlay did not take effect.
          overlay=(uv run --no-sync --with "pydicom==${PYDICOM_VERSION}" --)
          "${overlay[@]}" python -c 'import os, pydicom; print("pydicom", pydicom.__version__); assert pydicom.__version__ == os.environ["PYDICOM_VERSION"], pydicom.__version__'
          "${overlay[@]}" python -m pymedphys dev tests -m "not slow" \
            lib/pymedphys/tests/dicom/test_deidentify_*.py \
            lib/pymedphys/tests/dev/test_deid_tables.py \
            -n 2 --dist worksteal --durations=15 \
            --junitxml="${GITHUB_WORKSPACE}/test-results/junit-pydicom-${PYDICOM}.xml"

      - name: Record pydicom coverage
        id: evidence
        shell: bash
        env:
          PYDICOM: ${{ matrix.pydicom }}
          PYDICOM_VERSION: ${{ steps.coverage.outputs.version }}
          REUSE: ${{ steps.coverage.outputs.reuse }}
        run: |
          set -euxo pipefail
          if [[ "${REUSE}" == true ]]; then
            python .github/scripts/pydicom_coverage.py record
          else
            uv run --no-sync --with "pydicom==${PYDICOM_VERSION}" -- \
              python .github/scripts/pydicom_coverage.py record
          fi

      - name: Upload test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-pydicom-${{ matrix.pydicom }}
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload pydicom coverage
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pydicom-coverage-${{ matrix.pydicom }}
          path: test-results/pydicom-coverage-${{ matrix.pydicom }}.json
          if-no-files-found: error
          retention-days: 30

  # Independent validators, dciodvfy and dcentvfy from dicom3tools and
  # dicom-validator, check each instance that the engine releases from the
  # synthetic corpus, and its input, under each preset. A finding that an
  # output introduces must be explained in dicom_validation_known.toml. The
  # reports go to the job summary and an artefact; they hold no value or path.
  dicom-validators:
    name: DICOM validation of de-identified output
    timeout-minutes: 30
    # The dicom3tools package that setup-dicom-validators pins is Ubuntu
    # 24.04's.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The corpus tests read no downloaded data.
      - uses: ./.github/actions/setup-project
        with:
          python-version: '3.14'
          extras: 'tests'

      - uses: ./.github/actions/setup-dicom-validators
        id: validators

      - name: Validate the de-identified synthetic corpus
        id: tests
        shell: bash
        env:
          PYTEST_ADDOPTS: ${{ inputs.extra-pytest-args }}
          PYMEDPHYS_DICOM_VALIDATORS: required
          PYMEDPHYS_DICOM_VALIDATOR_STANDARD: ${{ steps.validators.outputs.standard-path }}
        run: |
          set -euxo pipefail
          mkdir -p test-results
          export PYMEDPHYS_DICOM_VALIDATION_REPORT="${GITHUB_WORKSPACE}/test-results/dicom-validation"
          # One process: each policy's run and validation is a module-scoped
          # fixture, which workers would each repeat.
          uv run -- pymedphys dev tests --dicom-validators \
            lib/pymedphys/tests/dicom/test_deidentify_dicom_validation_corpus.py \
            --durations=15 \
            --junitxml="${GITHUB_WORKSPACE}/test-results/dicom-validation.xml"

      - name: Summarise the validation reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          for report in test-results/dicom-validation/*/dicom-validation.md; do
            [ -f "${report}" ] || continue
            run=$(basename "$(dirname "${report}")")
            {
              echo "## Run ${run}"
              echo
              # Each report's headings, one level down.
              sed 's/^#/##/' "${report}"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # Ubuntu packages an old dicom3tools snapshot, whose dictionary lacks
      # attributes added to the standard since; this records how far behind it
      # is, and never fails the job.
      - name: List the newest dicom3tools snapshot
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          newest=$(curl -fsSL --max-time 60 https://www.dclunie.com/dicom3tools/workinprogress/index.html \
            | grep -o 'dicom3tools_1\.00\.snapshot\.[0-9]\{14\}' | sort -u | tail -n 1)
          installed=$(dciodvfy -version 2>&1 | sed -n 's/^dicom3tools Version: //p')
          echo "dicom3tools: ${installed} installed; newest snapshot ${newest#dicom3tools_}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the validation reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dicom-validation
          path: test-results/*
          if-no-files-found: error
          retention-days: 30

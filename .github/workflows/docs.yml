name: Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          cache-data: 'true'
          groups: 'docs'

      # Executing the notebooks is most of the build. jupyter-cache keeps the
      # outputs of each notebook whose code is unchanged, and this cache keeps
      # its store between runs, but only for an exact key over everything
      # execution can read. See .github/scripts/notebook_cache_key.py.
      - name: Key the executed-notebook cache
        id: notebook-key
        run: uv run --no-sync python .github/scripts/notebook_cache_key.py >> "$GITHUB_OUTPUT"

      - name: Cache executed notebooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lib/pymedphys/docs/_build/.jupyter_cache
          key: docs-notebooks-v1-${{ runner.os }}-${{ steps.notebook-key.outputs.hash }}

      - name: Build documentation
        run: uv run pymedphys dev docs

      - name: Check retained documentation URLs and local links
        run: uv run --no-sync python .github/scripts/check_documentation_migration.py lib/pymedphys/docs/_build/html

      - name: Upload documentation HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: lib/pymedphys/docs/_build/html
          if-no-files-found: error

  # Runs alongside the HTML build. It reads the sources without executing
  # notebooks, so it needs no data and finishes first.
  linkcheck:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          groups: 'docs'

      - name: Check external links
        id: linkcheck
        continue-on-error: true
        timeout-minutes: 10
        # Link-check settings live in _config.yml.
        run: uv run pymedphys dev docs --linkcheck

      - name: Validate link-check report
        if: ${{ !cancelled() && steps.linkcheck.outcome != 'skipped' }}
        env:
          LINKCHECK_OUTCOME: ${{ steps.linkcheck.outcome }}
        run: |
          if [[ ! -f lib/pymedphys/docs/_build/linkcheck/output.json ]]; then
            echo "::error::The link checker did not produce a report."
            exit 1
          fi
          if [[ "$LINKCHECK_OUTCOME" == "failure" ]]; then
            echo "::warning::External link checking failed. See the docs-linkcheck artifact."
          fi

      - name: Upload link-check report
        if: ${{ !cancelled() && steps.linkcheck.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-linkcheck
          path: lib/pymedphys/docs/_build/linkcheck
          if-no-files-found: error

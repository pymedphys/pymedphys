name: MIDI-B Benchmark

# On demand, download one subset of NCI's MIDI-B test data from TCIA
# (https://doi.org/10.7937/cf2p-aw56, CC BY 4.0), de-identify it with the
# development benchmark harness under each preset, and score the release
# against the subset's answer key, both with the harness and with NCI's own
# validation script (D-018).
#
# MIDI-B's files carry synthetic identifiers, which the project treats as
# real, and this repository's logs and artefacts are public. So the logs and
# the artefact hold only what the tools print by design (counts, codes,
# digests, and versions): the standard error and standard output of the
# benchmark and of the DICOM validation, where libraries log, go to files on
# the runner, the jobs print the result files instead, and a crash is
# reported by .github/scripts/run_redacted.py as its type and code locations
# alone. The
# data, the release, the QC pack, and the mapping files never leave the
# runner.
on:
  workflow_dispatch:
    inputs:
      subset:
        description: MIDI-B subset
        type: choice
        options: [validation, test, both]
        default: validation
      answer-key-url:
        description: An answer key to use in place of the pinned one (HTTPS)
        type: string
        default: ''
      answer-key-sha256:
        description: That answer key's SHA-256
        type: string
        default: ''
      answer-keys-from:
        description: >-
          Where the answer key comes from: the pinned copy, or TCIA's own
          Aspera package, checked against the pin
        type: choice
        options: [pinned, tcia]
        default: pinned
      engine-ref:
        description: >-
          Optionally, a pull request's head (refs/pull/<n>/head) or a branch
          (refs/heads/<name>) to merge into the chosen branch on the runner,
          to benchmark an engine change before it merges
        type: string
        default: ''
  # Temporary, for the first runs before this workflow is on the default
  # branch; removed before review.
  push:
    branches: [claude/deid-midi-b-ci-ko3ghq]
    paths:
      - .github/workflows/midi-b-benchmark.yml
      - .github/scripts/midi_b_tcia_answer_keys.py
      - lib/pymedphys/_dicom/deidentify/midi_data.toml
      - lib/pymedphys/_dicom/deidentify/midi_download.py
      - lib/pymedphys/_dicom/deidentify/midi_benchmark*.py

permissions:
  contents: read

concurrency:
  group: midi-b-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: MIDI-B ${{ matrix.subset }} ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        # A push (temporary, above) has no inputs, and runs both.
        subset: >-
          ${{ fromJSON(inputs.subset == 'validation' && '["validation"]'
          || inputs.subset == 'test' && '["test"]'
          || '["validation", "test"]') }}
        preset: [basic, basic-clean-descriptors]
    # The dicom3tools package that setup-dicom-validators pins is Ubuntu
    # 24.04's.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      SUBSET: ${{ matrix.subset }}
      PRESET: ${{ matrix.preset }}
      CHOSEN: ${{ inputs.subset }}
      # A push (temporary, above) has no inputs, and checks TCIA's packages.
      ANSWER_KEYS_FROM: ${{ inputs.answer-keys-from || 'tcia' }}
      # IBM's Aspera command line client, Apache-2.0; it installs IBM's
      # transfer daemon, which carries IBM's own licence, on the runner only.
      # Not ASCLI_*: ascli reads environment variables so named as options.
      ASPERA_GEM_VERSION: 4.27.2
      ASPERA_GEM_SHA256: 562eb4214e8910b03b6618eb862ef8065362b501504bf35a270aa514279b3f6c
      ANSWER_KEY_URL: ${{ inputs.answer-key-url }}
      ANSWER_KEY_SHA256: ${{ inputs.answer-key-sha256 }}
      # A push (temporary, above) benchmarks #2339's engine fix with this
      # branch, to measure it before it merges.
      ENGINE_REF: >-
        ${{ inputs.engine-ref
        || (github.event_name == 'push' && 'refs/pull/2339/head' || '') }}
      # NCI's validation script (https://github.com/CBIIT/midi_validation_script,
      # Apache-2.0) at a pinned commit. It pins pydicom 2.2.1, so it runs in
      # an environment of its own, on Python 3.10.
      NCI_SCRIPT_COMMIT: ccc0939317d5ffd14edda33bc04641490d6f2254
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Merging an engine ref needs the history back to the merge base.
          fetch-depth: ${{ env.ENGINE_REF != '' && '0' || '1' }}

      # The merge stays on the runner, which is deleted when the job ends.
      - name: Merge the engine ref
        if: env.ENGINE_REF != ''
        run: |
          if [[ ! "${ENGINE_REF}" =~ ^refs/(pull/[0-9]+/head|heads/[A-Za-z0-9._/-]+)$ ]]; then
            echo "The engine ref must be refs/pull/<n>/head or refs/heads/<branch>."
            exit 1
          fi
          git fetch --no-tags origin "${ENGINE_REF}"
          git -c user.name="MIDI-B Benchmark" -c user.email="midi-b-benchmark@invalid" \
            merge --no-edit --no-ff FETCH_HEAD
          echo "ENGINE_SHA=$(git rev-parse FETCH_HEAD)" >> "${GITHUB_ENV}"

      # The Test subset is 11 GB, and the release and QC pack about as much
      # again; remove toolchains this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # The Test subset's answer key and run outcomes approach the runner's
      # 16 GB, and a runner out of memory is lost with its results. Swap on
      # the freed disk gives headroom.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /midi-b-swapfile
          sudo chmod 600 /midi-b-swapfile
          sudo mkswap /midi-b-swapfile > /dev/null
          sudo swapon /midi-b-swapfile
          free -m

      # The user extra holds the decoders for compressed transfer syntaxes,
      # and the tests extra dicom-validator.
      - uses: ./.github/actions/setup-project
        with:
          extras: 'user tests'

      - uses: ./.github/actions/setup-dicom-validators
        id: validators

      - name: Prepare private and result directories
        run: |
          umask 077
          mkdir -p "${RUNNER_TEMP}/midi-b/private" "${RUNNER_TEMP}/midi-b/results"
          if [[ -n "${ENGINE_REF}" ]]; then
            echo "${GITHUB_SHA} merged with ${ENGINE_REF} at ${ENGINE_SHA}" \
              > "${RUNNER_TEMP}/midi-b/results/engine.txt"
          fi

      # TCIA publishes the answer keys only as Faspex packages. Fetch them
      # with IBM's client, list their files' names, sizes, and digests, and
      # hand this subset's ZIP file to the downloader, which checks it
      # against the pinned digest that the Zenodo copy shares.
      - name: Fetch the answer keys from TCIA
        if: env.ANSWER_KEYS_FROM == 'tcia'
        run: |
          if [[ -n "${ANSWER_KEY_URL}" ]]; then
            echo "Give an answer key's URL or take the keys from TCIA, not both."
            exit 1
          fi
          gem_file="${RUNNER_TEMP}/aspera-cli-${ASPERA_GEM_VERSION}.gem"
          curl -sSfL -o "${gem_file}" "https://rubygems.org/downloads/aspera-cli-${ASPERA_GEM_VERSION}.gem"
          echo "${ASPERA_GEM_SHA256}  ${gem_file}" | sha256sum --check --strict -
          # These two logs hold no MIDI-B data, so show them on a failure.
          ruby --version
          gem install --user-install --no-document "${gem_file}" > "${RUNNER_TEMP}/gem.log" 2>&1 \
            || { tail -n 40 "${RUNNER_TEMP}/gem.log"; exit 1; }
          PATH="$(ruby -e 'print Gem.user_dir')/bin:${PATH}"
          export PATH
          ascli config transferd install > "${RUNNER_TEMP}/transferd.log" 2>&1 \
            || { tail -n 40 "${RUNNER_TEMP}/transferd.log"; exit 1; }
          python3 -I .github/scripts/midi_b_tcia_answer_keys.py fetch "${RUNNER_TEMP}/midi-b/tcia"
          python3 -I .github/scripts/midi_b_tcia_answer_keys.py list "${RUNNER_TEMP}/midi-b/tcia" \
            | tee "${RUNNER_TEMP}/midi-b/results/tcia-answer-keys.txt"
          mapfile -t keys < <(find "${RUNNER_TEMP}/midi-b/tcia" -type f \
            -name "MIDI-B-Answer-Key-${SUBSET^}.zip")
          if [[ "${#keys[@]}" -ne 1 ]]; then
            echo "TCIA's packages hold ${#keys[@]} answer keys for ${SUBSET}, not one."
            exit 1
          fi
          echo "ANSWER_KEY_FILE=${keys[0]}" >> "${GITHUB_ENV}"

      # The downloader prints only counts, digests, and positions.
      - name: Download the subset from TCIA
        run: |
          args=(--subset "${SUBSET}" --dest "${RUNNER_TEMP}/midi-b/data")
          if [[ -n "${ANSWER_KEY_URL}" ]]; then
            if [[ "${CHOSEN}" == both ]]; then
              echo "An answer key belongs to one subset: choose validation or test to give one."
              exit 1
            fi
            args+=(--answer-key-url "${ANSWER_KEY_URL}" --answer-key-sha256 "${ANSWER_KEY_SHA256}")
          fi
          if [[ -n "${ANSWER_KEY_FILE:-}" ]]; then
            args+=(--answer-key-file "${ANSWER_KEY_FILE}")
          fi
          uv run --no-sync python .github/scripts/run_redacted.py \
            pymedphys._dicom.deidentify.midi_download "${args[@]}"
          cp "${RUNNER_TEMP}/midi-b/data/download.json" "${RUNNER_TEMP}/midi-b/results/"
          df -h /

      - name: Run the benchmark
        id: benchmark
        run: |
          data="${RUNNER_TEMP}/midi-b/data"
          work="${RUNNER_TEMP}/midi-b/work"
          results="${RUNNER_TEMP}/midi-b/results"
          if [[ ! -f "${data}/answer-key.db" ]]; then
            echo "No answer key is pinned for ${SUBSET} or given, so the benchmark did not run." \
              | tee "${results}/benchmark.md"
            echo "ran=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          name="$(jq -r '.name' "${data}/download.json")"
          # Memory and swap in use every five minutes, so that a lost runner
          # shows whether memory ran out.
          (while sleep 300; do
            free -m | awk '/^Mem:/ {m = $3} /^Swap:/ {s = $3} END {
              print "Memory used " m " MB, swap used " s " MB" }'
          done) &
          sampler=$!
          uv run --no-sync python .github/scripts/run_redacted.py \
            --private-stdout "${RUNNER_TEMP}/midi-b/private/benchmark-stdout.log" \
            pymedphys._dicom.deidentify.midi_benchmark_command run \
            --source "${data}/images" \
            --answer-key "${data}/answer-key.db" \
            --work "${work}" \
            --collection "${name}" \
            --preset "${PRESET}" \
            --watch "(0020,0011)" --watch "(0028,0106)" --watch "(0008,0008)" \
            2> "${RUNNER_TEMP}/midi-b/private/benchmark-stderr.log"
          kill "${sampler}"
          free -m
          cp "${work}/benchmark.md" "${work}/benchmark.json" "${results}/"
          echo "ran=true" >> "${GITHUB_OUTPUT}"
          df -h /

      # dciodvfy, dcentvfy, and dicom-validator on each released file and its
      # input (D-030). The result files name no value or path. Standard error
      # and standard output, where a library's log records could quote a
      # value, stay on the runner; the log shows only the wrapper's report of
      # a crash, and the summary the Markdown results. Findings do not fail
      # the job: they are results.
      - name: Validate the release against its inputs
        if: steps.benchmark.outputs.ran == 'true'
        timeout-minutes: 120
        env:
          PYMEDPHYS_DICOM_VALIDATOR_STANDARD: ${{ steps.validators.outputs.standard-path }}
        run: |
          results="${RUNNER_TEMP}/midi-b/results"
          status=0
          uv run --no-sync python .github/scripts/run_redacted.py \
            --private-stdout "${RUNNER_TEMP}/midi-b/private/dicom-validation-stdout.log" \
            pymedphys._dicom.deidentify.dicom_validation_command midi \
            --source "${RUNNER_TEMP}/midi-b/data/images" \
            --work "${RUNNER_TEMP}/midi-b/work" \
            --out "${RUNNER_TEMP}/midi-b/dicom-validation" \
            2> "${RUNNER_TEMP}/midi-b/private/dicom-validation-stderr.log" \
            || status=$?
          echo "The DICOM validation comparison exited with ${status} (0 passed, 1 unexplained findings, 2 could not compare)." \
            | tee "${results}/dicom-validation-status.txt"
          for file in dicom-validation.json dicom-validation.md; do
            if [[ -f "${RUNNER_TEMP}/midi-b/dicom-validation/${file}" ]]; then
              cp "${RUNNER_TEMP}/midi-b/dicom-validation/${file}" "${results}/"
            fi
          done
          df -h /

      # Kept and shown now, in case the runner is lost in NCI's script, which
      # takes longest; the last steps replace them with every result.
      - name: Upload the benchmark's results
        if: ${{ !cancelled() && steps.benchmark.outputs.ran == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midi-b-${{ env.SUBSET }}-${{ env.PRESET }}-results
          path: ${{ runner.temp }}/midi-b/results/
          if-no-files-found: warn
          retention-days: 90

      - name: Show the benchmark's results
        if: ${{ !cancelled() && steps.benchmark.outputs.ran == 'true' }}
        run: |
          results="${RUNNER_TEMP}/midi-b/results"
          for file in benchmark.md dicom-validation-status.txt dicom-validation.md; do
            if [[ -f "${results}/${file}" ]]; then
              cat "${results}/${file}"
              echo
            fi
          done

      # NCI's script scores the same release from the mapping files that the
      # harness wrote. It logs values from the files, so its logs and its
      # results database stay on the runner, and only the harness's count of
      # its results, which holds none, is kept.
      - name: Score the release with NCI's validation script
        if: steps.benchmark.outputs.ran == 'true'
        timeout-minutes: 150
        run: |
          nci="${RUNNER_TEMP}/nci"
          private="${RUNNER_TEMP}/midi-b/private"
          work="${RUNNER_TEMP}/midi-b/work"
          results="${RUNNER_TEMP}/midi-b/results"
          git init -q "${nci}"
          git -C "${nci}" fetch -q --depth 1 https://github.com/CBIIT/midi_validation_script.git \
            "${NCI_SCRIPT_COMMIT}"
          git -C "${nci}" checkout -q FETCH_HEAD
          uv venv -q --python 3.10 "${RUNNER_TEMP}/nci-venv"
          uv pip install -q --python "${RUNNER_TEMP}/nci-venv/bin/python" \
            -r "${nci}/requirements.txt"
          {
            echo "NCI validation script commit ${NCI_SCRIPT_COMMIT}"
            uv pip freeze --python "${RUNNER_TEMP}/nci-venv/bin/python"
          } > "${results}/nci-script-environment.txt"
          jq -n \
            --arg release "${work}/release" \
            --arg output "${private}/nci-output" \
            --arg key "${RUNNER_TEMP}/midi-b/data/answer-key.db" \
            --arg uids "${work}/validation-script/uid_mapping.csv" \
            --arg patients "${work}/validation-script/patid_mapping.csv" \
            --arg logs "${private}/nci-logs" \
            '{run_name: "release", input_data_path: $release,
              output_data_path: $output, answer_db_file: $key,
              uid_mapping_file: $uids, patid_mapping_file: $patients,
              multiprocessing: "False", multiprocessing_cpus: "1",
              log_path: $logs, log_level: "info", report_series: "False"}' \
            > "${private}/nci-config.json"
          # Each of the script's worker processes holds its own copy of the
          # answer key and loads its own OCR model, which ran a 16 GB runner
          # out of memory with four; one process scores only the released
          # files, which are few.
          free -m
          # Memory and swap every five minutes, as in the benchmark step.
          (while sleep 300; do
            free -m | awk '/^Mem:/ {m = $3} /^Swap:/ {s = $3} END {
              print "Memory used " m " MB, swap used " s " MB" }'
          done) &
          sampler=$!
          status=0
          (cd "${nci}" && "${RUNNER_TEMP}/nci-venv/bin/python" run_validation.py \
            "${private}/nci-config.json") > "${private}/nci-script.log" 2>&1 || status=$?
          kill "${sampler}"
          free -m
          echo "NCI's validation script exited with ${status}."
          database="${private}/nci-output/release/validation_results.db"
          if [[ -f "${database}" ]]; then
            uv run --no-sync python .github/scripts/run_redacted.py \
              pymedphys._dicom.deidentify.midi_benchmark_command script-results \
              "${database}" > "${results}/script-results.json" \
              || echo "The script's results could not be counted." \
                | tee "${results}/script-results.txt"
          else
            echo "NCI's validation script wrote no results (exit status ${status})." \
              | tee "${results}/script-results.txt"
          fi
          df -h /

      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          results="${RUNNER_TEMP}/midi-b/results"
          {
            echo "# MIDI-B ${SUBSET}, ${PRESET}"
            echo
            if [[ -f "${results}/engine.txt" ]]; then
              echo "Engine: $(cat "${results}/engine.txt")"
              echo
            fi
            if [[ -f "${results}/download.json" ]]; then
              echo '```json'
              cat "${results}/download.json"
              echo '```'
              echo
            fi
            if [[ -f "${results}/benchmark.md" ]]; then
              cat "${results}/benchmark.md"
              echo
            fi
            if [[ -f "${results}/dicom-validation-status.txt" ]]; then
              echo "## DICOM validation"
              echo
              cat "${results}/dicom-validation-status.txt"
              echo
              if [[ -f "${results}/dicom-validation.md" ]]; then
                cat "${results}/dicom-validation.md"
                echo
              fi
            fi
            for file in script-results.json script-results.txt; do
              if [[ -f "${results}/${file}" ]]; then
                echo "## NCI validation script"
                echo
                if [[ "${file}" == *.json ]]; then echo '```json'; fi
                cat "${results}/${file}"
                if [[ "${file}" == *.json ]]; then echo '```'; fi
              fi
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midi-b-${{ env.SUBSET }}-${{ env.PRESET }}-results
          path: ${{ runner.temp }}/midi-b/results/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

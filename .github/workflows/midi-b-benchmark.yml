name: MIDI-B Benchmark

# Temporary discovery run: what TCIA serves for MIDI-B. Replaced by the
# benchmark itself before review.
on:
  push:
    branches: [claude/deid-midi-b-ci-ko3ghq]
    paths: [.github/workflows/midi-b-benchmark.yml, .github/scripts/midi_b_discover.py]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I .github/scripts/midi_b_discover.py

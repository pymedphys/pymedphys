name: MIDI-B Benchmark

# On demand, download one subset of NCI's MIDI-B test data from TCIA
# (https://doi.org/10.7937/cf2p-aw56, CC BY 4.0), de-identify it with the
# development benchmark harness under each configuration of a group, a
# preset or one option alone, and score each release against the subset's
# answer key with the harness, and a preset's with NCI's own validation
# script too (D-018). Each job downloads its subset once and runs its
# group's configurations in turn, since the data never leaves the runner:
# no artefact or cache holds it. A group of Retain options runs basic first
# and compares each option's run with it, check by check (the flip check).
#
# MIDI-B's files carry synthetic identifiers, which the project treats as
# real, and this repository's logs and artefacts are public. So the logs and
# the artefact hold only what the tools print by design (counts, codes,
# digests, and versions): the standard error and standard output of the
# benchmark and of the DICOM validation, where libraries log, go to files on
# the runner, the jobs print the result files instead, and a crash is
# reported by .github/scripts/run_redacted.py as its type and code locations
# alone. The
# data, the release, the QC pack, and the mapping files never leave the
# runner.
on:
  workflow_dispatch:
    inputs:
      subset:
        description: MIDI-B subset
        type: choice
        options: [validation, test, both]
        default: validation
      configurations:
        description: >-
          Which configurations run: basic and basic-clean-descriptors; the
          other presets; each Retain option alone, with its flip check; each
          Clean option alone; or all of them, in seven jobs for each subset
        type: choice
        options: [basic-presets, other-presets, retain, clean, all]
        default: basic-presets
      answer-key-url:
        description: An answer key to use in place of the pinned one (HTTPS)
        type: string
        default: ''
      answer-key-sha256:
        description: That answer key's SHA-256
        type: string
        default: ''
      answer-keys-from:
        description: >-
          Where the answer key comes from: the pinned copy, or TCIA's own
          Aspera package, checked against the pin
        type: choice
        options: [pinned, tcia]
        default: pinned
      engine-ref:
        description: >-
          Optionally, pull requests' heads (refs/pull/<n>/head) or branches
          (refs/heads/<name>), separated by spaces, to merge in turn into the
          chosen branch on the runner, to benchmark engine changes before
          they merge
        type: string
        default: ''
  # Temporary, for the first runs before this workflow is on the default
  # branch; removed before review. Off until TCIA's change to its rate
  # limits is live.
  # push:
  #   branches: [claude/deid-midi-b-ci-ko3ghq]
  #   paths:
  #     - .github/workflows/midi-b-benchmark.yml
  #     - .github/scripts/midi_b_tcia_answer_keys.py
  #     - lib/pymedphys/_dicom/deidentify/midi_data.toml
  #     - lib/pymedphys/_dicom/deidentify/midi_download.py
  #     - lib/pymedphys/_dicom/deidentify/midi_benchmark*.py

permissions:
  contents: read

concurrency:
  group: midi-b-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: MIDI-B ${{ matrix.subset }} ${{ matrix.group }}
    strategy:
      fail-fast: false
      # Each job downloads its subset from TCIA: no more than four at once.
      max-parallel: 4
      matrix:
        # A push (temporary, above) has no inputs, and runs both.
        subset: >-
          ${{ fromJSON(inputs.subset == 'validation' && '["validation"]'
          || inputs.subset == 'test' && '["test"]'
          || '["validation", "test"]') }}
        # Each group's configurations are chosen in "Choose the
        # configurations" below. A push (temporary, above) runs basic-presets.
        group: >-
          ${{ fromJSON(inputs.configurations == 'other-presets' && '["other-presets"]'
          || inputs.configurations == 'retain' && '["retain-1", "retain-2", "retain-3"]'
          || inputs.configurations == 'clean' && '["clean", "clean-pixel-data"]'
          || inputs.configurations == 'all'
            && '["basic-presets", "other-presets", "retain-1", "retain-2", "retain-3", "clean", "clean-pixel-data"]'
          || '["basic-presets"]') }}
    # The dicom3tools package that setup-dicom-validators pins is Ubuntu
    # 24.04's.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      SUBSET: ${{ matrix.subset }}
      GROUP: ${{ matrix.group }}
      CHOSEN: ${{ inputs.subset }}
      # A push (temporary, above) has no inputs, and checks TCIA's packages.
      ANSWER_KEYS_FROM: ${{ inputs.answer-keys-from || 'tcia' }}
      # IBM's Aspera command line client, Apache-2.0; it installs IBM's
      # transfer daemon, which carries IBM's own licence, on the runner only.
      # Not ASCLI_*: ascli reads environment variables so named as options.
      ASPERA_GEM_VERSION: 4.27.2
      ASPERA_GEM_SHA256: 562eb4214e8910b03b6618eb862ef8065362b501504bf35a270aa514279b3f6c
      ANSWER_KEY_URL: ${{ inputs.answer-key-url }}
      ANSWER_KEY_SHA256: ${{ inputs.answer-key-sha256 }}
      ENGINE_REF: ${{ inputs.engine-ref }}
      # NCI's validation script (https://github.com/CBIIT/midi_validation_script,
      # Apache-2.0) at a pinned commit. It pins pydicom 2.2.1, so it runs in
      # an environment of its own, on Python 3.10.
      NCI_SCRIPT_COMMIT: ccc0939317d5ffd14edda33bc04641490d6f2254
      # Released files that NCI's script scores at a time. Test's 23,811
      # released files in one part used about 15.7 GB of memory and 12.9 GB
      # of swap.
      NCI_PART_FILES: 5000
      # A re-run's artefacts are named apart from the first attempt's: the
      # last upload's overwrite deletes the first attempt's artefact of that
      # name, not this attempt's, and then conflicts with this attempt's.
      ATTEMPT_SUFFIX: >-
        ${{ github.run_attempt != '1'
        && format('-attempt-{0}', github.run_attempt) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Merging an engine ref needs the history back to the merge base.
          fetch-depth: ${{ env.ENGINE_REF != '' && '0' || '1' }}

      # The merge stays on the runner, which is deleted when the job ends.
      - name: Merge the engine ref
        if: env.ENGINE_REF != ''
        run: |
          read -r -a refs <<< "${ENGINE_REF}"
          merged=""
          for ref in "${refs[@]}"; do
            if [[ ! "${ref}" =~ ^refs/(pull/[0-9]+/head|heads/[A-Za-z0-9._/-]+)$ ]]; then
              echo "Each engine ref must be refs/pull/<n>/head or refs/heads/<branch>."
              exit 1
            fi
            git fetch --no-tags origin "${ref}"
            git -c user.name="MIDI-B Benchmark" -c user.email="midi-b-benchmark@invalid" \
              merge --no-edit --no-ff FETCH_HEAD
            merged="${merged:+${merged}, then }${ref} at $(git rev-parse FETCH_HEAD)"
          done
          echo "ENGINE_MERGES=${merged}" >> "${GITHUB_ENV}"

      # The Test subset is 11 GB, and the release and QC pack about as much
      # again; remove toolchains this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # The Test subset's answer key and run outcomes approach the runner's
      # 16 GB, and a runner out of memory is lost with its results. Swap on
      # the freed disk gives headroom.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /midi-b-swapfile
          sudo chmod 600 /midi-b-swapfile
          sudo mkswap /midi-b-swapfile > /dev/null
          sudo swapon /midi-b-swapfile
          free -m

      # The user extra holds the decoders for compressed transfer syntaxes,
      # and the tests extra dicom-validator and, for Clean Pixel Data, the
      # text-detection extra.
      - uses: ./.github/actions/setup-project
        with:
          extras: 'user tests'

      - uses: ./.github/actions/setup-dicom-validators
        id: validators

      - name: Prepare private and result directories
        run: |
          umask 077
          mkdir -p "${RUNNER_TEMP}/midi-b/private" "${RUNNER_TEMP}/midi-b/results"
          if [[ -n "${ENGINE_REF}" ]]; then
            echo "${GITHUB_SHA} merged with ${ENGINE_MERGES}" \
              > "${RUNNER_TEMP}/midi-b/results/engine.txt"
          fi

      # Where the runner reaches TCIA from, and whether each of TCIA's
      # addresses answers it, before the job first asks TCIA for anything and
      # again after a failure: TCIA's site has stopped answering some runners
      # for most of an hour, and TCIA can match these with its own logs. They
      # hold no MIDI-B data. Each request to TCIA's site and to NBIA also
      # names the runner's address and the run in its User-Agent header, so
      # that TCIA can find the job's requests in its logs.
      - name: Record how the runner reaches TCIA
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -I .github/scripts/midi_b_tcia_answer_keys.py network --github-env "${GITHUB_ENV}"

      # TCIA publishes the answer keys only as Faspex packages. Fetch them
      # with IBM's client, list their files' names, sizes, and digests, and
      # hand this subset's ZIP file to the downloader, which checks it
      # against the pinned digest that the Zenodo copy shares.
      - name: Fetch the answer keys from TCIA
        if: env.ANSWER_KEYS_FROM == 'tcia'
        run: |
          if [[ -n "${ANSWER_KEY_URL}" ]]; then
            echo "Give an answer key's URL or take the keys from TCIA, not both."
            exit 1
          fi
          gem_file="${RUNNER_TEMP}/aspera-cli-${ASPERA_GEM_VERSION}.gem"
          curl -sSfL -o "${gem_file}" "https://rubygems.org/downloads/aspera-cli-${ASPERA_GEM_VERSION}.gem"
          echo "${ASPERA_GEM_SHA256}  ${gem_file}" | sha256sum --check --strict -
          # These two logs hold no MIDI-B data, so show them on a failure.
          ruby --version
          gem install --user-install --no-document "${gem_file}" > "${RUNNER_TEMP}/gem.log" 2>&1 \
            || { tail -n 40 "${RUNNER_TEMP}/gem.log"; exit 1; }
          PATH="$(ruby -e 'print Gem.user_dir')/bin:${PATH}"
          export PATH
          # IBM's download site has not answered some runners: three tries.
          for attempt in 1 2 3; do
            if ascli config transferd install > "${RUNNER_TEMP}/transferd.log" 2>&1; then
              break
            fi
            tail -n 40 "${RUNNER_TEMP}/transferd.log"
            if (( attempt == 3 )); then
              exit 1
            fi
            echo "Installing IBM's transfer daemon: attempt ${attempt} of 3 failed at $(date -u +%FT%TZ); trying again in $((60 * attempt)) s."
            sleep $((60 * attempt))
          done
          note="runner ${MIDI_B_RUNNER_ADDRESS:-unknown}; run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}; ${SUBSET} ${GROUP}"
          python3 -I .github/scripts/midi_b_tcia_answer_keys.py fetch "${RUNNER_TEMP}/midi-b/tcia" \
            --user-agent-note "${note}"
          python3 -I .github/scripts/midi_b_tcia_answer_keys.py list "${RUNNER_TEMP}/midi-b/tcia" \
            | tee "${RUNNER_TEMP}/midi-b/results/tcia-answer-keys.txt"
          mapfile -t keys < <(find "${RUNNER_TEMP}/midi-b/tcia" -type f \
            -name "MIDI-B-Answer-Key-${SUBSET^}.zip")
          if [[ "${#keys[@]}" -ne 1 ]]; then
            echo "TCIA's packages hold ${#keys[@]} answer keys for ${SUBSET}, not one."
            exit 1
          fi
          echo "ANSWER_KEY_FILE=${keys[0]}" >> "${GITHUB_ENV}"

      # The downloader prints only counts, digests, and positions.
      - name: Download the subset from TCIA
        run: |
          note="runner ${MIDI_B_RUNNER_ADDRESS:-unknown}; run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}; ${SUBSET} ${GROUP}"
          args=(--subset "${SUBSET}" --dest "${RUNNER_TEMP}/midi-b/data" --user-agent-note "${note}")
          if [[ -n "${ANSWER_KEY_URL}" ]]; then
            if [[ "${CHOSEN}" == both ]]; then
              echo "An answer key belongs to one subset: choose validation or test to give one."
              exit 1
            fi
            args+=(--answer-key-url "${ANSWER_KEY_URL}" --answer-key-sha256 "${ANSWER_KEY_SHA256}")
          fi
          if [[ -n "${ANSWER_KEY_FILE:-}" ]]; then
            args+=(--answer-key-file "${ANSWER_KEY_FILE}")
          fi
          uv run --no-sync python .github/scripts/run_redacted.py \
            pymedphys._dicom.deidentify.midi_download "${args[@]}"
          cp "${RUNNER_TEMP}/midi-b/data/download.json" "${RUNNER_TEMP}/midi-b/results/"
          df -h /

      - name: Record how the runner reaches TCIA after a failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -I .github/scripts/midi_b_tcia_answer_keys.py network

      # Each of the group's configurations, as kind:name:scoring, run in
      # turn. The kind is preset or option, a custom option set of that
      # option alone; the scoring is full (the harness, the DICOM
      # validation, and NCI's script), validated (the harness and the DICOM
      # validation), or reference (the harness alone, for the flip checks).
      # On the Test subset, the harness took about 62 minutes, the
      # validation 10, and NCI's script 22, so each group fits the job's
      # timeout.
      - name: Choose the configurations
        run: |
          case "${GROUP}" in
            basic-presets)
              configurations="preset:basic:full preset:basic-clean-descriptors:full" ;;
            other-presets)
              configurations="preset:tps-import:full preset:public-release:full" ;;
            retain-1)
              configurations="preset:basic:reference option:retain_safe_private:validated option:retain_uids:validated option:retain_device_identity:validated" ;;
            retain-2)
              configurations="preset:basic:reference option:retain_institution_identity:validated option:retain_patient_characteristics:validated" ;;
            retain-3)
              configurations="preset:basic:reference option:retain_longitudinal_full_dates:validated option:retain_longitudinal_modified_dates:validated" ;;
            clean)
              configurations="option:clean_descriptors:validated option:clean_structured_content:validated option:clean_graphics:validated" ;;
            clean-pixel-data)
              configurations="option:clean_pixel_data:validated" ;;
            *)
              echo "Unknown group ${GROUP}."
              exit 1 ;;
          esac
          echo "CONFIGURATIONS=${configurations}" >> "${GITHUB_ENV}"
          echo "${GROUP}: ${configurations}"

      # Each configuration de-identifies the subset into a work directory of
      # its own, is scored, and its release and QC pack are deleted before
      # the next, so that the disk holds one at a time. Its results go to a
      # results directory of its own; its check outcomes, for the flip
      # checks, stay on the runner. dciodvfy, dcentvfy, and dicom-validator
      # check each released file and its input (D-030); their findings do
      # not fail the job: they are results. Standard error and standard
      # output, where a library's log records could quote a value, stay on
      # the runner; the log shows the wrapper's report of a refusal or a
      # crash, and each configuration's Markdown results as it finishes, in
      # case the runner is lost.
      #
      # NCI's script scores a preset's release from the mapping files that
      # the harness wrote. It logs values from the files, so its logs and
      # its results database stay on the runner, and only the harness's
      # count of its results, which holds none, is kept. The script scores
      # each withheld instance as missing and holds every result in memory,
      # which ran a 16 GB runner out on the Test subset, so it is given the
      # released instances' rows alone. It scores the released files as it
      # would with the whole key. Where most of the Test subset is released,
      # the results alone nearly fill memory and swap, so it scores the
      # release in parts of NCI_PART_FILES files, each with its own answer
      # key; it scores each file on its own, so the parts' results add up to
      # the whole's. Each of its worker processes holds its own copy of the
      # answer key and loads its own OCR model, which ran a 16 GB runner out
      # of memory with four; one process scores each part.
      - name: Run the configurations
        id: configurations
        timeout-minutes: 320
        env:
          PYMEDPHYS_DICOM_VALIDATOR_STANDARD: ${{ steps.validators.outputs.standard-path }}
        run: |
          umask 077
          data="${RUNNER_TEMP}/midi-b/data"
          private="${RUNNER_TEMP}/midi-b/private"
          results="${RUNNER_TEMP}/midi-b/results"
          nci="${RUNNER_TEMP}/nci"
          if [[ ! -f "${data}/answer-key.db" ]]; then
            echo "No answer key is pinned for ${SUBSET} or given, so the benchmark did not run." \
              | tee "${results}/benchmark.md"
            echo "ran=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "ran=true" >> "${GITHUB_OUTPUT}"
          name="$(jq -r '.name' "${data}/download.json")"

          setup_nci() {
            [[ -d "${RUNNER_TEMP}/nci-venv" ]] && return 0
            git init -q "${nci}" \
              && git -C "${nci}" fetch -q --depth 1 https://github.com/CBIIT/midi_validation_script.git \
                "${NCI_SCRIPT_COMMIT}" \
              && git -C "${nci}" checkout -q FETCH_HEAD \
              && uv venv -q --python 3.10 "${RUNNER_TEMP}/nci-venv" \
              && uv pip install -q --python "${RUNNER_TEMP}/nci-venv/bin/python" \
                -r "${nci}/requirements.txt" \
              && {
                echo "NCI validation script commit ${NCI_SCRIPT_COMMIT}"
                uv pip freeze --python "${RUNNER_TEMP}/nci-venv/bin/python"
              } > "${results}/nci-script-environment.txt"
          }

          # Score one configuration's release with NCI's script.
          score_with_nci() {
            local work="$1" out="$2" logs="$3"
            local parts="${logs}/nci-parts"
            if ! setup_nci; then
              echo "NCI's validation script could not be installed." | tee "${out}/script-results.txt"
              return 1
            fi
            mkdir -p "${parts}"
            find "${work}/release" -type f -name '*.dcm' | LC_ALL=C sort > "${parts}/files.txt"
            split -l "${NCI_PART_FILES}" -d -a 3 "${parts}/files.txt" "${parts}/list-"
            shopt -s nullglob
            local lists=("${parts}"/list-*)
            local status=0 list part part_status
            local databases=()
            for list in "${lists[@]}"; do
              part="part-${list##*/list-}"
              # Links to the part's files, which the script follows.
              mkdir "${parts}/${part}"
              xargs -d '\n' -a "${list}" cp -s --parents -t "${parts}/${part}"
              uv run --no-sync python .github/scripts/run_redacted.py \
                pymedphys._dicom.deidentify.midi_benchmark_command released-answer-key \
                "${data}/answer-key.db" \
                --release "${parts}/${part}" \
                --uid-mapping "${work}/validation-script/uid_mapping.csv" \
                --out "${parts}/${part}-answer-key.db" \
                > "${parts}/${part}-answer-key.json"
              jq -n \
                --arg name "${part}" \
                --arg release "${parts}/${part}" \
                --arg output "${logs}/nci-output" \
                --arg key "${parts}/${part}-answer-key.db" \
                --arg uids "${work}/validation-script/uid_mapping.csv" \
                --arg patients "${work}/validation-script/patid_mapping.csv" \
                --arg logs "${logs}/nci-logs" \
                '{run_name: $name, input_data_path: $release,
                  output_data_path: $output, answer_db_file: $key,
                  uid_mapping_file: $uids, patid_mapping_file: $patients,
                  multiprocessing: "False", multiprocessing_cpus: "1",
                  log_path: $logs, log_level: "info", report_series: "False"}' \
                > "${parts}/${part}-config.json"
              part_status=0
              (cd "${nci}" && timeout 150m "${RUNNER_TEMP}/nci-venv/bin/python" run_validation.py \
                "${parts}/${part}-config.json") >> "${logs}/nci-script.log" 2>&1 \
                || part_status=$?
              echo "NCI's validation script exited with ${part_status} on ${part}."
              if (( part_status != 0 )); then status=${part_status}; fi
              databases+=("${logs}/nci-output/${part}/validation_results.db")
            done
            # The answer keys' counts, added up over the parts.
            cat /dev/null "${parts}"/part-*-answer-key.json \
              | jq -s '{parts: length,
                        released_instances: (map(.released_instances) | add // 0),
                        answer_key_instances: (map(.answer_key_instances) | add // 0),
                        rows: (map(.rows) | add // 0)}' \
              | tee "${out}/nci-answer-key.json"
            echo "NCI's validation script exited with ${status}."
            local missing=0 database
            for database in "${databases[@]}"; do
              [[ -f "${database}" ]] || missing=$((missing + 1))
            done
            if (( ${#databases[@]} > 0 && missing == 0 )); then
              uv run --no-sync python .github/scripts/run_redacted.py \
                pymedphys._dicom.deidentify.midi_benchmark_command script-results \
                "${databases[@]}" > "${out}/script-results.json" \
                || echo "The script's results could not be counted." \
                  | tee "${out}/script-results.txt"
            else
              echo "NCI's validation script wrote no results for ${missing} of ${#databases[@]} parts (exit status ${status})." \
                | tee "${out}/script-results.txt"
            fi
            rm -rf "${parts}" "${logs}/nci-output"
          }

          # De-identify and score one configuration, kind:name:scoring.
          run_configuration() {
            local kind label scoring
            IFS=: read -r kind label scoring <<< "$1"
            local policy=(--preset "${label}")
            if [[ "${kind}" == option ]]; then
              policy=(--option "${label}")
            fi
            local work="${RUNNER_TEMP}/midi-b/work-${label}"
            local out="${results}/${label}"
            local logs="${private}/${label}"
            local validation="${RUNNER_TEMP}/midi-b/dicom-validation-${label}"
            mkdir -p "${out}" "${logs}" || return 1
            echo "${label} (${scoring}) started at $(date -u +%FT%TZ)."
            if ! uv run --no-sync python .github/scripts/run_redacted.py \
              --private-stdout "${logs}/benchmark-stdout.log" \
              pymedphys._dicom.deidentify.midi_benchmark_command run \
              --source "${data}/images" \
              --answer-key "${data}/answer-key.db" \
              --work "${work}" \
              --collection "${name}" \
              "${policy[@]}" \
              --watch "(0020,0011)" --watch "(0028,0106)" --watch "(0008,0008)" \
              2> "${logs}/benchmark-stderr.log"; then
              echo "The benchmark did not finish under ${label}." | tee "${out}/benchmark-status.txt"
              rm -rf "${work}"
              return 1
            fi
            cp "${work}/benchmark.md" "${work}/benchmark.json" "${out}/" || return 1
            cp "${work}/check-outcomes.txt" "${private}/outcomes-${label}.txt" || return 1
            cat "${out}/benchmark.md"
            free -m
            if [[ "${scoring}" != reference ]]; then
              local status=0
              timeout 120m uv run --no-sync python .github/scripts/run_redacted.py \
                --private-stdout "${logs}/dicom-validation-stdout.log" \
                pymedphys._dicom.deidentify.dicom_validation_command midi \
                --source "${data}/images" \
                --work "${work}" \
                --out "${validation}" \
                2> "${logs}/dicom-validation-stderr.log" \
                || status=$?
              echo "The DICOM validation comparison exited with ${status} (0 passed, 1 unexplained findings, 2 could not compare, 124 timed out)." \
                | tee "${out}/dicom-validation-status.txt"
              local file
              for file in dicom-validation.json dicom-validation.md; do
                if [[ -f "${validation}/${file}" ]]; then
                  cp "${validation}/${file}" "${out}/"
                fi
              done
              if [[ -f "${out}/dicom-validation.md" ]]; then
                cat "${out}/dicom-validation.md"
              fi
            fi
            if [[ "${scoring}" == full ]]; then
              score_with_nci "${work}" "${out}" "${logs}"
            fi
            rm -rf "${work}" "${validation}"
            echo "${label} finished at $(date -u +%FT%TZ)."
            df -h /
          }

          # Memory and swap in use every five minutes, so that a lost runner
          # shows whether memory ran out.
          (while sleep 300; do
            free -m | awk '/^Mem:/ {m = $3} /^Swap:/ {s = $3} END {
              print "Memory used " m " MB, swap used " s " MB" }'
          done) &
          sampler=$!
          failed=0
          for configuration in ${CONFIGURATIONS}; do
            run_configuration "${configuration}" || failed=1
          done
          kill "${sampler}"
          exit "${failed}"

      # Each Retain option's run against basic's, check by check: the flip
      # check fails where a check that the option does not govern changed,
      # or where none that it governs did. Its results hold only counts,
      # codes, and tags.
      - name: Compare each Retain option's run with basic's
        id: flips
        if: ${{ !cancelled() && steps.configurations.outputs.ran == 'true' }}
        run: |
          data="${RUNNER_TEMP}/midi-b/data"
          private="${RUNNER_TEMP}/midi-b/private"
          results="${RUNNER_TEMP}/midi-b/results"
          failed=0
          if [[ " ${CONFIGURATIONS} " != *" preset:basic:reference "* ]]; then
            echo "This group has no flip checks."
          fi
          for configuration in ${CONFIGURATIONS}; do
            IFS=: read -r kind label _ <<< "${configuration}"
            if [[ "${kind}" != option || " ${CONFIGURATIONS} " != *" preset:basic:reference "* ]]; then
              continue
            fi
            out="${results}/${label}"
            mkdir -p "${out}"
            if [[ ! -f "${private}/outcomes-basic.txt" || ! -f "${private}/outcomes-${label}.txt" ]]; then
              echo "The flip check of ${label} did not run: a run did not finish." \
                | tee "${out}/flip-check.md"
              failed=1
              continue
            fi
            status=0
            uv run --no-sync python .github/scripts/run_redacted.py \
              pymedphys._dicom.deidentify.midi_benchmark_command flip-check \
              "${data}/answer-key.db" \
              --reference "${private}/outcomes-basic.txt" \
              --compared "${private}/outcomes-${label}.txt" \
              --option "${label}" \
              --out "${out}/flip-check.json" \
              > "${out}/flip-check.md" 2> "${private}/flip-check-${label}-stderr.log" \
              || status=$?
            cat "${out}/flip-check.md"
            echo "The flip check of ${label} exited with ${status} (0 passed, 1 failed, found no effect, or could not compare, 2 crashed)." \
              | tee "${out}/flip-check-status.txt"
            if (( status != 0 )); then failed=1; fi
          done
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          results="${RUNNER_TEMP}/midi-b/results"
          {
            echo "# MIDI-B ${SUBSET}, ${GROUP}"
            echo
            if [[ -f "${results}/engine.txt" ]]; then
              echo "Engine: $(cat "${results}/engine.txt")"
              echo
            fi
            if [[ -f "${results}/download.json" ]]; then
              echo '```json'
              cat "${results}/download.json"
              echo '```'
              echo
            fi
            if [[ -f "${results}/benchmark.md" ]]; then
              cat "${results}/benchmark.md"
              echo
            fi
            for configuration in ${CONFIGURATIONS:-}; do
              IFS=: read -r _ label _ <<< "${configuration}"
              out="${results}/${label}"
              [[ -d "${out}" ]] || continue
              echo "## ${label}"
              echo
              for file in benchmark-status.txt benchmark.md; do
                if [[ -f "${out}/${file}" ]]; then
                  # Its headings two levels down, under the configuration's.
                  sed 's/^#/###/' "${out}/${file}"
                  echo
                fi
              done
              if [[ -f "${out}/dicom-validation-status.txt" ]]; then
                echo "### DICOM validation"
                echo
                cat "${out}/dicom-validation-status.txt"
                echo
                if [[ -f "${out}/dicom-validation.md" ]]; then
                  sed 's/^#/###/' "${out}/dicom-validation.md"
                  echo
                fi
              fi
              for file in script-results.json script-results.txt; do
                if [[ -f "${out}/${file}" ]]; then
                  echo "### NCI validation script"
                  echo
                  if [[ -f "${out}/nci-answer-key.json" ]]; then
                    echo "The answer key it was given, the released instances' rows:"
                    echo
                    echo '```json'
                    cat "${out}/nci-answer-key.json"
                    echo '```'
                    echo
                  fi
                  if [[ "${file}" == *.json ]]; then echo '```json'; fi
                  cat "${out}/${file}"
                  if [[ "${file}" == *.json ]]; then echo '```'; fi
                  echo
                fi
              done
              if [[ -f "${out}/flip-check.md" ]]; then
                sed 's/^#/###/' "${out}/flip-check.md"
                echo
              fi
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midi-b-${{ env.SUBSET }}-${{ env.GROUP }}-results${{ env.ATTEMPT_SUFFIX }}
          path: ${{ runner.temp }}/midi-b/results/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

      # After the results are kept: a failed flip check fails the job.
      - name: Fail on a failed flip check
        if: ${{ !cancelled() && steps.flips.outputs.failed == '1' }}
        run: |
          echo "A flip check failed, found no effect, or could not run; see the summary."
          exit 1

name: Integration Tests

on:
  workflow_call:
    inputs:
      run-slow:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      run-slow:
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'all'

      - name: Run doctests
        run: |
          uv run pymedphys dev doctests -v

      - name: Run the StackOverflow example
        run: uv run python examples/stackoverflow/gamma.py

  slow-tests:
    name: Slow Tests
    if: ${{ inputs.run-slow }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'dev tests'

      - name: Run slow tests
        run: |
          uv run -- pymedphys dev tests --slow -v

  wheel-build:
    name: Wheel Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project

      - name: Build and test wheel
        run: |
          uv build --wheel
          uv pip install dist/*.whl
          uv run pymedphys --help
          uv run python -c "import pymedphys"

  # The exported requirements files, dependency-extra.txt, pyproject.hash, and
  # _version.py are generated from pyproject.toml and uv.lock; a commit that
  # changes the sources without regenerating them fails here.
  propagate:
    name: Generated Files Are Current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'dev'

      - name: Regenerate the propagated files and check for drift
        run: |
          uv run pymedphys dev propagate
          git diff --exit-code -- \
            requirements.txt requirements-docs.txt pyproject.hash \
            lib/pymedphys/dependency-extra.txt lib/pymedphys/_version.py

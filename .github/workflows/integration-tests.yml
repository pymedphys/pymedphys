name: Integration Tests

on:
  workflow_call:
    inputs:
      run-wheel-build:
        description: Build and smoke-test distributions (the release builds its own)
        type: boolean
        default: true
        required: false
      run-slow:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      run-wheel-build:
        description: Build and smoke-test distributions (the release builds its own)
        type: boolean
        default: true
        required: false
      run-slow:
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'all'
          cache-data: 'true'

      - name: Run doctests
        run: |
          uv run pymedphys dev doctests -v

      - name: Run the StackOverflow example
        run: uv run python examples/stackoverflow/gamma.py

      # The gamma benchmark tooling in examples/ is not part of the package,
      # so the unit-test jobs do not collect its tests.
      - name: Run the gamma benchmark tooling tests
        run: uv run python -m unittest discover -s examples -p 'test_gamma_*.py'

  slow-tests:
    name: Slow Tests
    if: ${{ inputs.run-slow }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'tests'
          cache-data: 'true'

      # The slow tests are independent, and processes that share the data
      # cache take turns with each archive, from download to extraction.
      - name: Run slow tests
        run: |
          uv run -- pymedphys dev tests --slow -v -n auto --durations=15

  # The distribution checks create venvs, run console scripts, and build from
  # file:// indexes, which differ on Windows and macOS. Ubuntu runs these
  # tests in ci.yml whenever the tooling checks are selected.
  script-tests:
    name: Script Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Selection tests scan the package for slow markers and doctests.
          sparse-checkout: |
            .github
            lib/pymedphys

      - uses: ./.github/actions/setup-project
        with:
          install-project: 'false'

      # The test runner only, hash-checked from uv.lock, in its own step.
      - name: Install the script-tests group
        run: uv sync --frozen --only-group script-tests

      - name: Run the script tests
        run: uv run --no-sync pytest -n auto .github/scripts

  # One job for the packaging checks, which each take seconds.
  #
  # The wheel build makes the sdist and then the wheel from it, so a file
  # missing from the sdist fails here, then installs the wheel into a fresh
  # venv outside the project's environment. See
  # .github/scripts/check_distributions.py. It runs first, on the checkout as
  # committed.
  #
  # The exported requirements.txt, dependency-extra.txt, pyproject.hash, and
  # _version.py are generated from pyproject.toml and uv.lock; a commit that
  # changes the sources without regenerating them fails the drift check, which
  # reports even when the wheel checks fail.
  packaging:
    name: Packaging and Generated Files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Building needs only the project and uv; propagation also formats the
      # generated version file with Ruff, from the pre-commit group.
      - uses: ./.github/actions/setup-project
        with:
          groups: 'pre-commit'

      - name: Build the sdist, then the wheel from it
        if: inputs.run-wheel-build
        run: uv build

      - name: Check the distributions
        if: inputs.run-wheel-build
        run: python .github/scripts/check_distributions.py dist

      - name: Regenerate the propagated files and check for drift
        if: ${{ !cancelled() }}
        run: |
          uv run pymedphys dev propagate
          git diff --exit-code -- \
            requirements.txt pyproject.hash \
            lib/pymedphys/dependency-extra.txt lib/pymedphys/_version.py

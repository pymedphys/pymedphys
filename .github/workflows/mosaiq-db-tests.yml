name: Database Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mosaiq-db:
    name: Mosaiq database (${{ matrix.install }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every database test, with everything installed.
          - install: tests
            extras: tests
            groups: ''
            paths: ''
          # The mosaiq extra alone, which must hold everything pymedphys.mosaiq
          # needs. The fixtures group loads the mock database. Tests of other
          # features skip themselves when their packages are missing.
          - install: mosaiq
            extras: mosaiq
            groups: test-runner mosaiq-db-fixtures
            paths: tests/mosaiq

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: sqlServerPassw0rd
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          cache-data: 'true'
          extras: ${{ matrix.extras }}
          groups: ${{ matrix.groups }}

      - name: Wait for SQL Server startup
        run: |
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('localhost',1433)); s.close()"; then
              echo "SQL Server is accepting connections"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/30)"
            sleep 2
          done
          echo "::error::SQL Server failed to start within 60 seconds"
          exit 1

      # The readiness probe above waits for SQL Server, so a failure here is a
      # real failure and is reported once rather than retried.
      - name: Run database tests
        env:
          MOSAIQ_SQL_SERVER: localhost
          MOSAIQ_SQL_USER: SA
          MOSAIQ_SQL_PASSWORD: sqlServerPassw0rd
          TEST_PATHS: ${{ matrix.paths }}
        run: |
          set -euxo pipefail
          read -ra paths <<< "${TEST_PATHS}"
          # --no-sync keeps uv from installing anything beyond the matrix entry.
          uv run --no-sync -- pymedphys dev tests -v --mosaiqdb "${paths[@]}"

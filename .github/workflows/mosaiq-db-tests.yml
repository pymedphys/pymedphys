name: Database Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mosaiq-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: sqlServerPassw0rd
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'mosaiq tests dicom'

      - name: Wait for SQL Server startup
        run: |
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('localhost',1433)); s.close()"; then
              echo "SQL Server is accepting connections"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/30)"
            sleep 2
          done
          echo "::error::SQL Server failed to start within 60 seconds"
          exit 1

      # The readiness probe above waits for SQL Server, so a failure here is a
      # real failure and is reported once rather than retried.
      - name: Run database tests
        env:
          MOSAIQ_SQL_SERVER: localhost
          MOSAIQ_SQL_USER: SA
          MOSAIQ_SQL_PASSWORD: sqlServerPassw0rd
        run: uv run pymedphys dev tests -v --mosaiqdb

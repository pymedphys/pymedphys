name: Face Block Check on Visible Human

# On demand, download the CT series of the NLM Visible Human Project's two
# cadavers from NCI Imaging Data Commons' public bucket (collection
# nlm_visible_human_project), check each against the file count and digest
# that the check pins, and check the face block finder and CT defacing of the
# Clean Recognizable Visual Features Option on them (D-057). The scans are
# held-out evidence: the finder's settings are not to be tuned to them.
#
# The data are used under the National Library of Medicine's Terms and
# Conditions (https://www.nlm.nih.gov/databases/download/terms_and_conditions.html).
# Courtesy of the U.S. National Library of Medicine. NLM has not endorsed
# PyMedPhys or these results, which may not reflect the most current or
# accurate data available from NLM.
#
# As the maintainer allowed, the results name the series and give the
# measures, and the artefact holds renders of both cadavers' heads. The
# series themselves are never cached or uploaded.
on:
  workflow_dispatch:
  # Temporary, so that the check can run before the workflow is on the
  # default branch: removed before the pull request that adds it is ready.
  push:
    branches:
      - claude/project-thread-gh9w58
    paths:
      - .github/workflows/face-validation-visible-human.yml

permissions:
  contents: read

concurrency:
  group: face-validation-vhp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Face block check on Visible Human
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # A re-run's artefact is named apart from the first attempt's.
      ATTEMPT_SUFFIX: >-
        ${{ github.run_attempt != '1'
        && format('-attempt-{0}', github.run_attempt) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The user extra holds pydicom, NumPy, SciPy, and Matplotlib.
      - uses: ./.github/actions/setup-project
        with:
          extras: 'user'

      - name: Download the series from Imaging Data Commons
        timeout-minutes: 45
        run: |
          mkdir -p "${RUNNER_TEMP}/vhp"
          mapfile -t series < <(uv run --no-sync python -c \
            'from pymedphys._dicom.deidentify.face_validation_vhp import SERIES; print("\n".join(each.uuid for each in SERIES))')
          python .github/scripts/fetch_idc_series.py \
            --out "${RUNNER_TEMP}/vhp/data" "${series[@]}"
          du -sh "${RUNNER_TEMP}/vhp/data"
          df -h /

      # The command refuses any series whose files are not those pinned,
      # and writes face-validation-vhp.json, face-validation-vhp.md, and the
      # renders of each head.
      - name: Run the check
        timeout-minutes: 60
        run: |
          results="${RUNNER_TEMP}/vhp/results"
          uv run --no-sync python -m \
            pymedphys._dicom.deidentify.face_validation_command visible-human \
            "${RUNNER_TEMP}/vhp/data" --out "${results}" > /dev/null
          echo "${GITHUB_SHA}" > "${results}/commit.txt"

      - name: Show the results
        if: ${{ !cancelled() }}
        run: |
          page="${RUNNER_TEMP}/vhp/results/face-validation-vhp.md"
          if [[ -f "${page}" ]]; then
            tee -a "${GITHUB_STEP_SUMMARY}" < "${page}"
          else
            echo "The check wrote no results; the log shows why." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: face-validation-vhp-results${{ env.ATTEMPT_SUFFIX }}
          path: ${{ runner.temp }}/vhp/results/
          if-no-files-found: warn
          retention-days: 90

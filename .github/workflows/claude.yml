name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        # The Claude action pushes branches and needs the checkout credentials.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      # Use the same pinned setup-uv action as the rest of CI.
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude-code-action v1 takes the model and tool permissions only
          # through claude_args. It already allows reading, searching, and
          # editing files in the workspace, and committing and pushing through
          # its own git add, git commit, git rm, and push wrapper. The entries
          # below add read-only git and GitHub commands and the uv tooling;
          # uv run executes repository code, as running the tests requires.
          # An entry ending in :* matches that command prefix; any other entry
          # matches only that exact command. Do not add git push, which would
          # bypass the push wrapper's checks, or commands that switch, merge,
          # or reset branches, which the action manages itself.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools
            "Bash(git status:*)"
            "Bash(git log:*)"
            "Bash(git diff:*)"
            "Bash(git branch)"
            "Bash(git branch -a)"
            "Bash(git remote -v)"
            "Bash(git config user.name)"
            "Bash(git config user.email)"
            "Bash(git fetch)"
            "Bash(git fetch origin)"
            "Bash(gh pr list:*)"
            "Bash(gh pr view:*)"
            "Bash(uv sync:*)"
            "Bash(uv lock:*)"
            "Bash(uv add:*)"
            "Bash(uv remove:*)"
            "Bash(uv run:*)"
            "Bash(ls:*)"
            "Bash(pwd)"
            "Bash(cat:*)"
            "Bash(head:*)"
            "Bash(tail:*)"
            "Bash(which:*)"
            "Bash(echo:*)"

name: Gamma performance study

# Opt in by pushing a benchmarks/gamma-* branch. Ordinary PR pushes do not
# launch a multi-hour study. workflow_dispatch is available once on main.
on:
  push:
    branches: ['benchmarks/gamma-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check study before large allocations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/gamma-scaling-requirements.txt
      - run: python -m unittest discover -s examples -p 'test_gamma_scaling.py'
      - name: Exercise all implementations on small grids
        run: python examples/gamma_scaling.py --dimensions 2 3 --profiles global local cap2 --scales 0.02 --round-indices 0 --output smoke
  benchmark:
    needs: preflight
    name: ${{ matrix.dimension }}D ${{ matrix.profile }} round ${{ matrix.round }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        dimension: [2, 3]
        profile: [global, cap2, local]
        round: [0, 1, 2, 3]
    env:
      BENCHMARK_JOB_LABEL: ${{ matrix.dimension }}d-${{ matrix.profile }}-round-${{ matrix.round }}
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install fixed benchmark dependencies
        run: python -m pip install -r examples/gamma-scaling-requirements.txt
      - name: Record runner and environment
        run: |
          mkdir -p environment
          python -m pip freeze > environment/requirements-resolved.txt
          lscpu > environment/lscpu.txt
          free -h > environment/memory.txt
          uname -a > environment/uname.txt
      - name: Run balanced four-way comparisons
        env:
          DIMENSION: ${{ matrix.dimension }}
          PROFILE: ${{ matrix.profile }}
          ROUND: ${{ matrix.round }}
          CURRENT_REVISION: ${{ github.sha }}
        run: |
          python -u examples/gamma_scaling.py \
            --dimensions "$DIMENSION" --profiles "$PROFILE" \
            --round-indices "$ROUND" --current-ref "$CURRENT_REVISION" \
            --threads 4 --repeats 1 --scales 1 3 10 30 100 \
            --worker-timeout 3600 --output results
      - name: Preserve measurements, including partial results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamma-${{ matrix.dimension }}d-${{ matrix.profile }}-round-${{ matrix.round }}
          path: |
            results/results.json
            results/*.csv
            results/*.png
            results/*.svg
            results/README.md
            environment/
          if-no-files-found: error
          retention-days: 90
  combine:
    name: Combine verified study and figures
    needs: benchmark
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/gamma-scaling-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gamma-*
          path: parts
      - name: Validate, combine and plot
        run: |
          python examples/gamma_scaling.py --merge parts --output combined
          cat combined/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamma-scaling-canonical
          path: combined/
          if-no-files-found: error
          retention-days: 90

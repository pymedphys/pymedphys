name: Security Scan

on:
  schedule:
    - cron: '41 3 * * MON'  # Staggered to avoid top-of-hour congestion
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Read-only by default. Jobs that upload SARIF or open issues add what they need.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.action != 'labeled' &&
        github.event.action != 'unlabeled' }}

env:
  # Scanner versions. The scanners run through uvx, so nothing here touches the
  # project environment. Bump deliberately and keep the pre-commit zizmor hook
  # on the same version.
  PIP_AUDIT_VERSION: 2.10.1
  BANDIT_VERSION: 1.9.4
  ZIZMOR_VERSION: 1.30.1

jobs:
  # PR scans follow their inputs. Main, scheduled and manual runs always
  # scan, because new vulnerabilities can appear without repository changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-dependency-audit: ${{ steps.select.outputs.run-dependency-audit }}
      run-python-security: ${{ steps.select.outputs.run-python-security }}
      run-workflow-audit: ${{ steps.select.outputs.run-workflow-audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select affected scans
        id: select
        run: python .github/scripts/select_checks.py

  # Audits the lockfile rather than an installed environment, so every extra
  # and platform marker is covered and nothing has to be installed.
  dependency-audit:
    needs: [changes]
    if: needs.changes.outputs.run-dependency-audit == 'true'
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Export the locked dependency set
        run: >-
          uv export --frozen --all-extras --no-emit-project --no-hashes
          --output-file audit-requirements.txt

      # Advisory on pull requests and pushes: an advisory published against a
      # dependency must not turn an unrelated commit red. Blocking on scheduled
      # and manual runs, which is where new advisories are meant to surface.
      - name: Run pip-audit
        continue-on-error: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: |
          # PYSEC-2025-183 (PyJWT "weak encryption") is disputed upstream and
          # has no fixed version.
          uvx "pip-audit==${PIP_AUDIT_VERSION}" \
            --requirement audit-requirements.txt \
            --no-deps --disable-pip --strict \
            --desc on --progress-spinner off \
            --ignore-vuln PYSEC-2025-183

      - name: Open or update the tracking issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dependency audit found known vulnerabilities"
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            body="The weekly pip-audit run failed. Report: ${RUN_URL}"
          else
            body="A manually triggered pip-audit run failed. Report: ${RUN_URL}"
          fi
          gh label create security-audit --force --color B60205 \
            --description "Opened automatically by the dependency audit"
          number="$(gh issue list --label security-audit --state open --json number --jq '.[0].number')"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --label security-audit --body "${body}"
          fi

  # Configuration lives in [tool.bandit] in pyproject.toml. Blocking on every
  # event: fix the finding or add a justified "nosec" comment.
  python-security:
    needs: [changes]
    if: needs.changes.outputs.run-python-security == 'true'
    name: Python Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Run Bandit
        run: |
          run_bandit() {
            uvx --from "bandit[toml,sarif]==${BANDIT_VERSION}" bandit \
              --configfile pyproject.toml --recursive lib/pymedphys --quiet "$@"
          }
          set +e
          run_bandit
          status=$?
          set -e
          run_bandit --format sarif --output bandit.sarif || true
          exit "${status}"

      - name: Upload Bandit SARIF
        # Fork pull requests cannot write security events.
        if: >-
          ${{ !cancelled() &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-results
          path: bandit.sarif
          retention-days: 14
          if-no-files-found: error

  # The same check runs offline through pre-commit. Findings below medium
  # severity are style advice and do not block.
  workflow-audit:
    needs: [changes]
    if: needs.changes.outputs.run-workflow-audit == 'true'
    name: Workflow Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Run zizmor
        env:
          # The online audits (impostor commits, known vulnerable actions)
          # query the GitHub API.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Workflow files staged under claude_created_workflows_preview for a
          # maintainer to move (see CLAUDE.md) are audited in place so that
          # they arrive clean. The loop is a no-op once they have been moved.
          inputs=(.github)
          for staged in claude_created_workflows_preview/*.yml; do
            if [[ -f "${staged}" ]]; then
              inputs+=("${staged}")
            fi
          done
          run_zizmor() {
            uvx "zizmor==${ZIZMOR_VERSION}" --min-severity medium "$@" "${inputs[@]}"
          }
          set +e
          run_zizmor --format github
          status=$?
          set -e
          run_zizmor --format sarif > zizmor.sarif || true
          exit "${status}"

      - name: Upload zizmor SARIF
        # Fork pull requests cannot write security events.
        if: >-
          ${{ !cancelled() &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  security-summary:
    name: Security Summary
    needs: [changes, dependency-audit, python-security, workflow-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required status and generate security report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python .github/scripts/check_workflow_status.py
          --title 'Security Scan Results'
          --conditional dependency-audit=run-dependency-audit
          --conditional python-security=run-python-security
          --conditional workflow-audit=run-workflow-audit
      - name: Explain the gating policy
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'

          The dependency audit is advisory on pull requests and pushes, and
          blocking on scheduled and manual runs, where a failure opens or
          updates the issue labelled `security-audit`. Bandit and zizmor block
          on every event. Secret scanning and push protection are GitHub-native
          repository settings rather than workflow jobs.
          EOF

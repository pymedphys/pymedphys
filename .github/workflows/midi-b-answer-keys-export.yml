name: MIDI-B answer keys for Zenodo

# One-off, removed in the commit after its run. The maintainer asked on
# 12 October 2026 for the two MIDI-B answer-key ZIP files that TCIA
# publishes (https://doi.org/10.7937/cf2p-aw56, CC BY 4.0) only through
# Aspera, to upload them to Zenodo for the MIDI-B benchmark's
# answer_key_url. This run fetches them as the benchmark does, checks each
# against the digest pinned in midi_data.toml, and keeps both, unchanged,
# as an artefact for one day. It is the one exception to the benchmark's
# rule that only counts, codes, and digests leave CI: anyone signed in to
# GitHub can download the artefact until it expires.
on:
  push:
    branches: [claude/deid-midi-b-ci-ko3ghq]
    paths:
      - .github/workflows/midi-b-answer-keys-export.yml

permissions:
  contents: read

concurrency:
  group: midi-b-answer-keys-export
  cancel-in-progress: false

jobs:
  export:
    name: Export MIDI-B answer keys
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # As in midi-b-benchmark.yml.
      ASPERA_GEM_VERSION: 4.27.2
      ASPERA_GEM_SHA256: 562eb4214e8910b03b6618eb862ef8065362b501504bf35a270aa514279b3f6c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the answer keys from TCIA
        run: |
          gem_file="${RUNNER_TEMP}/aspera-cli-${ASPERA_GEM_VERSION}.gem"
          curl -sSfL -o "${gem_file}" "https://rubygems.org/downloads/aspera-cli-${ASPERA_GEM_VERSION}.gem"
          echo "${ASPERA_GEM_SHA256}  ${gem_file}" | sha256sum --check --strict -
          ruby --version
          gem install --user-install --no-document "${gem_file}" > "${RUNNER_TEMP}/gem.log" 2>&1 \
            || { tail -n 40 "${RUNNER_TEMP}/gem.log"; exit 1; }
          PATH="$(ruby -e 'print Gem.user_dir')/bin:${PATH}"
          export PATH
          ascli config transferd install > "${RUNNER_TEMP}/transferd.log" 2>&1 \
            || { tail -n 40 "${RUNNER_TEMP}/transferd.log"; exit 1; }
          python3 -I .github/scripts/midi_b_tcia_answer_keys.py fetch "${RUNNER_TEMP}/tcia"
          python3 -I .github/scripts/midi_b_tcia_answer_keys.py list "${RUNNER_TEMP}/tcia"

      # Only the two ZIP files, each matching its pin, go into the artefact.
      - name: Check each answer key against its pinned digest
        run: |
          mkdir "${RUNNER_TEMP}/export"
          for subset in validation test; do
            name="MIDI-B-Answer-Key-${subset^}.zip"
            mapfile -t keys < <(find "${RUNNER_TEMP}/tcia" -type f -name "${name}")
            if [[ "${#keys[@]}" -ne 1 ]]; then
              echo "TCIA's packages hold ${#keys[@]} files named ${name}, not one."
              exit 1
            fi
            pinned="$(python3 -I -c 'import sys, tomllib
          with open(sys.argv[1], "rb") as file:
              print(tomllib.load(file)[sys.argv[2]]["answer_key_sha256"])' \
              lib/pymedphys/_dicom/deidentify/midi_data.toml "${subset}")"
            echo "${pinned}  ${keys[0]}" | sha256sum --check --strict -
            cp "${keys[0]}" "${RUNNER_TEMP}/export/${name}"
          done
          ls -l "${RUNNER_TEMP}/export"

      - name: Keep the answer keys for one day
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midi-b-answer-keys-for-zenodo
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 1
          # The ZIP files are already compressed.
          compression-level: 0

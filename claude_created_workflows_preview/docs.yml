name: Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'docs'

      - name: Prepare Sphinx configuration and data
        run: uv run pymedphys dev docs --prep

      - name: Build documentation
        run: uv run pymedphys dev docs

      - name: Check external links
        id: linkcheck
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # Link-check settings live in _config.yml. Reuse the HTML build's
          # environment: nothing is re-read or re-executed, and the report
          # exists seconds after the step starts.
          uv run python -m sphinx -b linkcheck \
            -d lib/pymedphys/docs/_build/.doctrees \
            lib/pymedphys/docs lib/pymedphys/docs/_build/linkcheck

      - name: Validate link-check report
        if: ${{ !cancelled() && steps.linkcheck.outcome != 'skipped' }}
        env:
          LINKCHECK_OUTCOME: ${{ steps.linkcheck.outcome }}
        run: |
          if [[ ! -f lib/pymedphys/docs/_build/linkcheck/output.json ]]; then
            echo "::error::The link checker did not produce a report."
            exit 1
          fi
          if [[ "$LINKCHECK_OUTCOME" == "failure" ]]; then
            echo "::warning::External link checking failed. See the docs-linkcheck artifact."
          fi

      - name: Upload link-check report
        if: ${{ !cancelled() && steps.linkcheck.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-linkcheck
          path: lib/pymedphys/docs/_build/linkcheck
          if-no-files-found: error

      - name: Upload documentation HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: lib/pymedphys/docs/_build/html
          if-no-files-found: error

name: Type Check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'dev tests'

      - name: Run pyright
        run: |
          uv run -- pyright

  mypy:
    name: MyPy (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # continue-on-error lets the workflow succeed even if mypy fails,
    # but the step and job will show as failed (yellow warning) so
    # issues are visible. Do NOT also add || true on the command —
    # that would hide failures entirely.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          extras: 'dev tests'

      # mypy and its stub packages are in the dev extra, so the result does
      # not drift with whatever version happens to be current.
      - name: Run mypy
        run: uv run mypy lib/pymedphys

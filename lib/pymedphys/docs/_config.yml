title: PyMedPhys
author: the PyMedPhys community
copyright: "2018-2025"
logo: img/pymedphys.svg
execute:
  execute_notebooks: cache
  allow_errors: false
  raise_on_error: true
parse:
  myst_extended_syntax: []

html:
  favicon: img/pymedphys.svg
  analytics:
    google_analytics_id: UA-26591325-7
  home_page_in_navbar: false
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  baseurl: https://docs.pymedphys.com/

repository:
  url: https://github.com/pymedphys/pymedphys
  branch: main
  path_to_book: lib/pymedphys/docs

launch_buttons:
  notebook_interface: "jupyterlab"
  binderhub_url: "https://mybinder.org"
  colab_url: "https://colab.research.google.com"
  thebe: true

sphinx:
  config:
    language: en
    # github.com permalinks, issues, and PRs do not rot, and unauthenticated
    # checks of github.com are rate limited until the link-check step times out.
    linkcheck_ignore:
      - 'https://github\.com/.*'
    # Sphinx cannot set float-typed values such as the rate-limit timeout
    # from the command line, so keep every link-check setting here.
    linkcheck_workers: 10
    linkcheck_timeout: 10
    linkcheck_retries: 1
    linkcheck_rate_limit_timeout: 30
    linkcheck_report_timeouts_as_broken: false
    # Navigation is defined by the embedded toctrees in index pages. Keep the
    # Jupyter Book extensions except sphinx_external_toc, which conflicts with them.
    extensions:
      - sphinx_togglebutton
      - sphinx_copybutton
      - myst_nb
      - jupyter_book
      - sphinx_thebe
      - sphinx_comments
      - sphinx.ext.intersphinx
      - sphinx_design
      - sphinx_book_theme
      - sphinx.ext.autodoc
      - sphinx.ext.doctest
      - sphinx.ext.viewcode
      - sphinx.ext.autosummary
      - sphinx.ext.napoleon
      - sphinxarg.ext
      - matplotlib.sphinxext.plot_directive

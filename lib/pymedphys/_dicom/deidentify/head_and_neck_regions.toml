# Reviewed list: the anatomic regions of PS3.16 Annex L (Table L-1) that
# lie in the head or neck, or contain it, curated by hand. A CT series
# whose Body Part Examined (0018,0015) is one of these terms, or whose
# Anatomic Region Sequence (0008,2218) gives one of these codes, declares
# that it shows the head or neck, which raises its indicator of a
# reconstructable face (MIDI report Section 1.18.3).
#
# The list takes every region that lies wholly or partly in the head or
# neck: the head, face, skull, brain and its ventricles, the eyes, ears,
# nose, mouth, jaws, teeth, sinuses, salivary glands, pharynx, larynx,
# trachea, oesophagus, thyroid and parathyroid, the cervical spine and its
# joints, the spinal cord, and the arteries and veins of the head and neck,
# since an angiogram of any of them can cover the face. It also takes the
# regions that contain the neck, such as Neck and Chest, Spine, and Entire
# body. It does not take a region that names a whole system, such as Artery,
# Vein, or Cardiovascular system, which says nothing of where the series
# lies.
#
# Each region has its SNOMED CT code (SCT), its SNOMED RT identifier (SRT)
# where Table L-1 gives one, which older instances give instead, and its
# Body Part Examined term where Table L-1 gives one.

schema = "pymedphys-deid-head-and-neck-regions/1"
edition = "2026d"

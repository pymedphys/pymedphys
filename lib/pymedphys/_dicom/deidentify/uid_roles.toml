# Supplementary (L2) rules: the role of every UI attribute in the pinned
# PS3.6 data dictionary, curated by hand.
#
# instance: identifies an instance, event, entity, device, or organisation.
# definition: identifies a definition that a standard or vendor publishes,
#   such as a SOP Class, transfer syntax, coding scheme, or context group.
#
# A value registered in the pinned tables is retained under either role,
# because it names a public definition. Any other value is replaced; in a
# definition attribute the replacement is also reported. Attributes that
# Table E.1-1 lists without a note are instance UIDs it replaces.
# File Meta Information (group 0002), command (group 0000), and directory
# (group 0004) elements are not in Table 6-1; the file container rules
# rebuild or remove them.

schema = "pymedphys-deid-uid-roles/1"
edition = "2026d"
acknowledgement = "DICOM PS3.6 2026d, © NEMA"


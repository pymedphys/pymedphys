# The reviewed vocabulary of technique descriptors, for the automatic tier
# of free-text Clean Descriptors. A value of one of the attributes below is
# kept as it is only where every word of it is in this vocabulary, as the
# rules of technique_descriptors.py read it, and it echoes no identifier of
# the instance.
#
# The vocabulary is the words of the groups and the units below, and the
# Enumerated Values and Defined Terms that the pinned PS3.3 gives the
# attributes of term_attributes and the pinned PS3.16 Annex L gives Body
# Part Examined, each split at "_" and spaces; less every excluded word, and
# every common personal name (common_names.json) that is not an exception.
# Words are matched without case. Each group says why its words describe
# technique, anatomy, or equipment rather than a person. A group, or the
# units, may not hold an excluded word, or a common name that is not an
# exception, so that each such word is a decision recorded here.

schema = "pymedphys-deid-technique-vocabulary/1"

# The attributes whose values the automatic tier may keep: the technique
# descriptors of the plan for the option the maintainer chose on 12 October
# 2026, which describe how the images were made.
attributes = [
  "(0008,103E)", # Series Description
  "(0018,1030)", # Protocol Name
  "(0018,0024)", # Sequence Name
  "(0018,0010)", # Contrast/Bolus Agent
  "(0018,1040)", # Contrast/Bolus Route
  "(0008,2111)", # Derivation Description
  "(0040,0254)", # Performed Procedure Step Description
  "(0028,1055)", # Window Center & Width Explanation
  "(0054,1101)", # Attenuation Correction Method
  "(0054,1105)", # Scatter Correction Method
  "(0054,1103)", # Reconstruction Method
]

# Attributes whose Defined Terms and Enumerated Values describe acquisition,
# reconstruction, or anatomy.
term_attributes = [
  "(0008,0008)", # Image Type
  "(0008,0060)", # Modality
  "(0018,0020)", # Scanning Sequence
  "(0018,0021)", # Sequence Variant
  "(0018,0022)", # Scan Options
  "(0018,0023)", # MR Acquisition Type
  "(0018,5100)", # Patient Position
  "(0018,5101)", # View Position
  "(0020,0060)", # Laterality
  "(0028,0051)", # Corrected Image
  "(0054,1000)", # Series Type
  "(0054,1100)", # Randoms Correction Method
  "(0054,1102)", # Decay Correction
  "(0018,9008)", # Echo Pulse Sequence
  "(0018,9017)", # Steady State Pulse Sequence
  "(0018,9025)", # Spectrally Selected Suppression
  "(0018,9032)", # Geometry of k-Space Traversal
  "(0018,9034)", # Rectilinear Phase Encode Reordering
  "(0018,9043)", # Receive Coil Type
  "(0018,9064)", # k-space Filtering
  "(0018,9075)", # Diffusion Directionality
  "(0018,9078)", # Parallel Acquisition Technique
  "(0018,9147)", # Diffusion Anisotropy Type
  "(0018,9302)", # Acquisition Type
  "(0018,9316)", # Convolution Kernel Group
  "(0018,9323)", # Exposure Modulation Type
]


options = { clean_descriptors = "C" }
note = "The strain of a non-human subject, typed in a nomenclature, which can also carry other text, such as a colony or project name; Strain Code Sequence carries the strain as a code. It is removed by Type, and cleaned as a descriptor under Clean Descriptors."


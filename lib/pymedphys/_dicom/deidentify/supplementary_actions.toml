# Supplementary (L2) actions for attributes of the pinned PS3.6 data
# dictionary that Table E.1-1 of PS3.15 omits, curated by hand. Each action is
# a code of Table E.1-1a, and each rule says why the attribute has it.
#
# Every person name (PN) attribute that Table E.1-1 omits has a rule, so that
# no person's name is kept merely because the table does not list it. So does
# every text attribute (VR LO, SH, LT, ST, UC, or UT) that Table E.1-1 omits
# and an IOD of the supported scope uses, at any depth, so that no
# operator-typed text is kept merely because the table does not list it. A
# rule never covers an attribute that Table E.1-1 lists, or a UI, DA, DT, or
# TM attribute, which the roles files give roles.
#
# "action" is the Basic Profile action. As in Table E.1-1, "options" can give
# an action under an option, which overrides it when that option is selected:
# only C under clean_descriptors and K under retain_device_identity, only for
# a text attribute, and only over an action that removes or replaces the
# value.

schema = "pymedphys-deid-supplementary-actions/1"
edition = "2026d"
acknowledgement = "DICOM PS3.6 2026d, © NEMA"

# Person names, and the pixel data flags that the engine keeps as received.

[[attribute]]
tag = "(0014,0104)"
keyword = "SecondaryReviewerName"
action = "X/Z/D"
note = "A person's name. PS3.6 marks it DICONDE, and none of the IODs whose Types are generated uses it, so the action suits whatever Type an IOD gives it, as for Operators' Name in Table E.1-1."

[[attribute]]
tag = "(0014,2006)"
keyword = "EvaluatorName"
action = "X/Z/D"
note = "A person's name. PS3.6 marks it DICONDE, and none of the IODs whose Types are generated uses it, so the action suits whatever Type an IOD gives it, as for Operators' Name in Table E.1-1."

[[attribute]]
tag = "(0028,0301)"
keyword = "BurnedInAnnotation"
action = "K"
note = "The engine does not change pixel data, so the value is kept as received and never set to NO, and a received NO is not taken as evidence of safety. PS3.15 sets it to NO only under the Clean Pixel Data Option."

[[attribute]]
tag = "(0028,0302)"
keyword = "RecognizableVisualFeatures"
action = "K"
note = "The engine does not change pixel data, so the value is kept as received and never set to NO, and a received NO is not taken as evidence of safety. PS3.15 sets it to NO only under the Clean Recognizable Visual Features Option."

[[attribute]]
tag = "(0040,A067)"
keyword = "DocumentAuthorTrial"
action = "X"
note = "A person's name, retired in 2009 with the other (Trial) attributes of Structured Reporting; Table E.1-1 removes the others that name a person, Current Observer (Trial) and Verbal Source (Trial)."

# Text attributes that Table E.1-1 omits and the supported IODs use.
#
# Operator-typed labels and text: removed by Type, and cleaned as
# descriptors under Clean Descriptors.

[[attribute]]
tag = "(0008,0115)"
keyword = "CodingSchemeName"
action = "X/Z/D"
options = { clean_descriptors = "C" }
note = "The full name of a coding scheme. A local scheme's name is typed by whoever defines the scheme and can name the institution, and the codes do not need it, since Coding Scheme Designator identifies the scheme. It is therefore treated as typed text: removed by Type, and cleaned as a descriptor under Clean Descriptors."

[[attribute]]
tag = "(0008,030E)"
keyword = "PrivateDataElementDescription"
action = "X/Z/D"
options = { clean_descriptors = "C" }
note = "Free text on the purpose or use of a private data element, written by whoever defines the element, which can be the institution's own software. It is removed by Type, and cleaned as a descriptor under Clean Descriptors."

[[attribute]]
tag = "(0008,030F)"
keyword = "PrivateDataElementEncoding"
action = "X/Z/D"
options = { clean_descriptors = "C" }
note = "Free text on how a private data element's value is encoded, written by whoever defines the element, like Private Data Element Description. It is removed by Type, and cleaned as a descriptor under Clean Descriptors."

[[attribute]]

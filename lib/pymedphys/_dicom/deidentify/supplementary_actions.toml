# Coded and technical values: kept under every option.

[[attribute]]
tag = "(0008,0070)"
keyword = "Manufacturer"
action = "K"
note = "The name of the company that made the equipment or device, which the equipment itself writes in the General Equipment Module. It is kept because it is Type 1 in Contributing Equipment Sequence (PS3.3 Table C.12-1), so it cannot be removed there, and because Table E.1-1 omits it deliberately while listing the identifiers of single devices, such as Device Serial Number; for equipment that a company makes, it names the maker of a product that many sites share. A device made in-house, as Patient Treatment Preparation Device Sequence (Table 10.35-1, Type 2), Device Sequence, or Container Component Sequence can record, can carry the hospital as its Manufacturer. That residual risk is accepted: the value names an institution, not a patient, and every distinct retained string is reviewed by a person before a public release."

[[attribute]]
tag = "(0008,0100)"
keyword = "CodeValue"
action = "K"
note = "The value of a coded entry in the coding scheme that Coding Scheme Designator names: vocabulary, not text a person types. It is kept, since replacing it, where it is Type 1C in the Basic Code Sequence Macro, would destroy the code's meaning. Table E.1-1 acts whole on code sequences whose codes identify a person or an institution, or record a diagnosis, such as Person Identification Code Sequence, Institution Code Sequence, and Admitting Diagnoses Code Sequence."

[[attribute]]
tag = "(0008,0102)"
keyword = "CodingSchemeDesignator"
action = "K"
note = "Identifies the coding scheme of a coded entry, such as DCM or SCT. It qualifies the code value and is kept with it, for the same reasons."

[[attribute]]
tag = "(0008,0103)"
keyword = "CodingSchemeVersion"
action = "K"
note = "The version of a coding scheme, which the scheme's publisher assigns. It qualifies the code value and is kept with it, for the same reasons."

[[attribute]]
tag = "(0008,0104)"
keyword = "CodeMeaning"
action = "K"
note = "The text that conveys a code's meaning, which the coding scheme gives it. It is kept with the code value, for the same reasons, and Table E.1-1 acts whole on code sequences whose codes identify someone, such as Person Identification Code Sequence."

[[attribute]]
tag = "(0008,0112)"
keyword = "CodingSchemeRegistry"
action = "K"
note = "The external registry of a coding scheme, a Defined Term such as HL7. It names a public registry and identifies no one, so it is kept."

[[attribute]]
tag = "(0008,0114)"
keyword = "CodingSchemeExternalID"
action = "K"
note = "The identifier that an external registry, such as HL7's, gives a registered coding scheme. It names a published scheme and identifies no one, so it is kept."

[[attribute]]
tag = "(0008,0119)"
keyword = "LongCodeValue"
action = "K"
note = "A code value longer than 16 characters, used in place of Code Value. It is kept for the same reasons as Code Value."

[[attribute]]
tag = "(0008,0302)"
keyword = "PrivateCreatorReference"
action = "K"
note = "The private creator that reserves a block of private data elements, a fixed string, such as a vendor's and product's name, that the software defining the block writes in every instance. It identifies software, not a device, person, or patient, so it is kept, which lets the block's description be read."

[[attribute]]
tag = "(0008,030C)"
keyword = "PrivateDataElementName"
action = "K"
note = "The name by which the software that defines a private data element refers to it, a fixed string written in every instance alike. It describes the element, not its value, and identifies no one, so it is kept."

[[attribute]]
tag = "(0008,030D)"
keyword = "PrivateDataElementKeyword"
action = "K"
note = "A keyword for a private data element, in the form of the keywords of PS3.6, fixed by the software that defines the element. It describes the element, not its value, and identifies no one, so it is kept."

[[attribute]]
tag = "(0008,1090)"
keyword = "ManufacturerModelName"
action = "K"
note = "The manufacturer's name for the model of the equipment or device, the same for every unit of that model. It identifies a product rather than one device, and Table E.1-1 omits it while listing Device Serial Number, which identifies one device. It is kept, as information about the acquisition."

[[attribute]]
tag = "(0010,0213)"
keyword = "StrainNomenclature"
action = "K"
note = "The nomenclature of Strain Description, a Defined Term such as MGI_2013 (PS3.3 C.7.1.1.1.4). It names a published nomenclature and identifies no one, so it is kept."

[[attribute]]
tag = "(0010,0223)"
keyword = "GeneticModificationsNomenclature"
action = "K"
note = "The nomenclature of Genetic Modifications Description, a Defined Term such as MGI_2013 (PS3.3 C.7.1.1.1.4). It names a published nomenclature and identifies no one, so it is kept."

[[attribute]]
tag = "(0018,1020)"
keyword = "SoftwareVersions"
action = "K"
note = "The manufacturer's designation of the versions of the equipment's software, which the equipment itself writes. It identifies software releases shared by every site that runs them, and is needed to interpret how the data were produced, so it is kept."

[[attribute]]
tag = "(0018,1160)"
keyword = "FilterType"
action = "K"
note = "The type of filter in the X-ray beam, which the CT scanner writes from its configuration, with Defined Terms such as FLAT or WEDGE in some modules. It is a technical value that identifies no one, so it is kept."

[[attribute]]
tag = "(0018,1210)"
keyword = "ConvolutionKernel"
action = "K"
note = "A label for the kernel or algorithm used to reconstruct the image, which the scanner writes from its configuration. It is a technical value that identifies no one, and is needed to interpret image noise and resolution, so it is kept."

[[attribute]]
tag = "(0028,1054)"
keyword = "RescaleType"
action = "K"
note = "The units of the rescaled pixel values, a Defined Term such as HU (PS3.3 C.11.1.1.2) that the equipment writes. It identifies no one, and replacing it would change how the pixel values are read, so it is kept."

[[attribute]]
tag = "(0066,0031)"
keyword = "AlgorithmVersion"
action = "K"
note = "The version that a manufacturer assigns a software algorithm, like Software Versions. It is a technical value that identifies no one, so it is kept."

[[attribute]]
tag = "(0072,0054)"
keyword = "SelectorSequencePointerPrivateCreator"
action = "K"
note = "The private creators of the sequences that lead to a modified private attribute, fixed strings written by software, like Private Creator Reference, so it is kept. In the supported IODs it occurs only within Original Attributes Sequence, which Table E.1-1 removes under every option."

[[attribute]]
tag = "(0072,0056)"
keyword = "SelectorAttributePrivateCreator"
action = "K"
note = "The private creator of a modified private attribute, a fixed string written by software, like Private Creator Reference, so it is kept. In the supported IODs it occurs only within Original Attributes Sequence, which Table E.1-1 removes under every option."

[[attribute]]
tag = "(3002,0052)"
keyword = "FluenceModeID"
action = "K"
note = "Identifies a non-standard fluence mode, such as FFF, as the treatment machine's configuration names it. It is a technical value that identifies no one, and is needed to reproduce the beam, so it is kept."

[[attribute]]
tag = "(300A,007B)"
keyword = "FractionPattern"
action = "K"
note = "A string of 0s and 1s giving the weekly pattern of fractions, starting on a Monday. It holds no dates or text, only the pattern, and is needed to reproduce the treatment course, so it is kept."

[[attribute]]
tag = "(300A,0226)"
keyword = "SourceIsotopeName"
action = "K"
note = "The name of a brachytherapy source's isotope, such as Ir-192, from the planning system's source library. It names an isotope and identifies no one, and it is Type 1, so replacing it would lose the source's physics; it is kept."

[[attribute]]
tag = "(3010,001A)"
keyword = "ManufacturerModelVersion"
action = "K"
note = "The version of the manufacturer's model of a device, which identifies a product rather than one device, like Manufacturer's Model Name, so it is kept."

[[attribute]]
tag = "(3010,001D)"
keyword = "DeviceAlternateIdentifierFormat"
action = "K"
note = "The format of a device's alternate identifier, such as an RFID or bar code format (PS3.3 10.36.1.1). It names a format, not a device, and Table E.1-1 empties the identifier itself, Device Alternate Identifier (3010,001B), so it is kept."

[[attribute]]
tag = "(60xx,0045)"
keyword = "OverlaySubtype"
action = "K"
note = "A Defined Term for the purpose of an overlay (PS3.3 C.9.2.1.3). It is a coded value that identifies no one, so it is kept."

# De-identification Method: kept, and added to by the engine.

[[attribute]]
tag = "(0012,0063)"
keyword = "DeidentificationMethod"
action = "K"
note = "A description of each de-identification already applied. PS3.15 E.1.1 has a de-identifier add its own description to this attribute, so the engine keeps the values already present and adds two of its own: a readable value naming PyMedPhys, its version, the PS3.15 edition, and the preset, and the policy digest."

# Names and identifiers of people, organisations, records, and networks,
# identifiers that a device reads, and the text of overlays: removed by Type
# under every option.

[[attribute]]
tag = "(0008,0116)"
keyword = "CodingSchemeResponsibleOrganization"
action = "X/Z/D"
note = "The organisation responsible for a coding scheme, which PS3.3 says may include contact information, so for a local scheme it names the institution and can name a person. Table E.1-1 removes names of people and organisations, such as Operators' Name, Institution Name, and Clinical Trial Sponsor Name, under every supported option, so it is removed by Type under every option too."

[[attribute]]
tag = "(0008,0122)"
keyword = "MappingResourceName"
action = "X/Z/D"
note = "The name of the mapping resource that defines a context group, such as DICOM Content Mapping Resource. PS3.3 Section 8.4 says that its value may denote the institution or organisation that specified the value set, so it can name the institution, and the codes do not need it, since Mapping Resource (0008,0105) identifies the resource. Like Coding Scheme Responsible Organization, it is removed by Type under every option."

[[attribute]]
tag = "(0010,0214)"
keyword = "StrainStockNumber"
action = "X/Z/D"
note = "The stock number of a non-human subject's strain, issued by the organisation in Strain Source, which can be the institution's own colony. Table E.1-1 removes comparable identifiers, such as Accession Number and Container Identifier, under every option, so it is removed by Type under every option too."

[[attribute]]
tag = "(0010,0217)"
keyword = "StrainSource"
action = "X/Z/D"
note = "The organisation that supplied a non-human subject, which can be the institution's own colony. Table E.1-1 removes names of organisations, such as Institution Name and Clinical Trial Sponsor Name, under every supported option, so it is removed by Type under every option too."

[[attribute]]
tag = "(0010,2295)"
keyword = "BreedRegistrationNumber"
action = "X/Z/D"
note = "The number of a non-human subject in a breed registry, which identifies one animal and, through the registry, its owner. It is removed by Type under every option, as Table E.1-1 removes the patient's other identifiers, such as Other Patient IDs Sequence."

[[attribute]]
tag = "(0018,1803)"
keyword = "NTPSourceAddress"
action = "X/Z/D"
note = "The IP address of the time server, which identifies a network and so usually the institution. Table E.1-1 at most cleans network identities, such as Station AE Title, even under Retain Device Identity, and a supplementary rule can only keep a value under that option, so it is removed by Type under every option."

[[attribute]]
tag = "(0024,0202)"
keyword = "AlgorithmSource"
action = "X/Z/D"
note = "The source of an algorithm, which PS3.3 says can be a manufacturer, researcher, or university, so it can name a person or the institution. Table E.1-1 removes names of people and organisations, such as Operators' Name and Institution Name, under every supported option, so it is removed by Type under every option too."

[[attribute]]
tag = "(0040,0031)"
keyword = "LocalNamespaceEntityID"
action = "X/Z/D"
note = "Identifies, in a local namespace, an issuer of identifiers, such as of patient IDs or accession numbers, and so names the institution or one of its departments. It is removed by Type under every option, as Table E.1-1 removes Issuer of Patient ID."

[[attribute]]
tag = "(0040,0032)"
keyword = "UniversalEntityID"
action = "X/Z/D"
note = "A universal identifier, such as an ISO object identifier, of an issuer of identifiers, such as the authority that assigns patient IDs, and so identifies the institution. It is removed by Type under every option, as Table E.1-1 removes Issuer of Patient ID."

[[attribute]]
tag = "(0040,E001)"
keyword = "HL7InstanceIdentifier"
action = "X/Z/D"
note = "The identifier of a referenced HL7 document, a UID with an optional extension, which identifies one document about the patient. Table E.1-1 replaces the UIDs of instances, but this is text, which takes no keyed UID replacement, so it is removed by Type under every option."

[[attribute]]
tag = "(0088,0130)"
keyword = "StorageMediaFileSetID"
action = "X/Z/D"
note = "A human-readable identifier of the storage media that hold a referenced instance, which can be typed with a patient's name or a date. It is removed by Type under every option, like other identifiers of records; in the supported IODs it occurs only within Referenced Patient Photo Sequence, which Table E.1-1 removes."

[[attribute]]
tag = "(300A,00F9)"
keyword = "AccessoryCode"
action = "X/Z/D"
note = "A machine-readable identifier for an accessory, block, or compensator, which PS3.3 Tables C.8-48 and C.8-50 describe as 'intended to be read by a device such as a bar-code reader', nearly the words in which Table 10.36-1 describes Device Alternate Identifier (3010,001B). Table E.1-1 empties that attribute (Z) and gives it no action under Retain Device Identity. A block or compensator is usually made for one patient, so its code can refer to them, and the labels of such items are cleaned rather than kept, so it is removed by Type under every option."

[[attribute]]
tag = "(300A,0355)"
keyword = "TrayAccessoryCode"
action = "X/Z/D"
note = "A machine-readable identifier for the tray of a block or compensator, which PS3.3 Table C.8-50 describes as 'intended to be read by a device such as a bar-code reader', nearly the words in which Table 10.36-1 describes Device Alternate Identifier (3010,001B). Table E.1-1 empties that attribute (Z) and gives it no action under Retain Device Identity. The tray carries a block or compensator, which is usually made for one patient, and the labels of such items are cleaned rather than kept, so it is removed by Type under every option, like Accessory Code."

[[attribute]]
tag = "(60xx,0022)"
keyword = "OverlayDescription"
action = "X/Z/D"
note = "User-defined comments about an overlay. Table E.1-1 removes Overlay Comments under every option except Clean Graphics, which is not supported, so this is removed by Type under every option rather than cleaned as a descriptor."

[[attribute]]
tag = "(60xx,1500)"
keyword = "OverlayLabel"
action = "X/Z/D"
note = "A user-defined label or name for an overlay. Like Overlay Description, it is removed by Type under every option, as Table E.1-1 removes Overlay Comments under every option except Clean Graphics, which is not supported."

# Dates in a text VR: removed under every option.

[[attribute]]
tag = "(0010,0033)"
keyword = "PatientBirthDateInAlternativeCalendar"
action = "X"
note = "The patient's date of birth in an alternative calendar. Its VR is LO, but it holds a date in no specified format, so it could be neither shifted nor checked; it is removed under every option, as no supported option keeps Patient's Birth Date. It is Type 3 in the Patient Module."

[[attribute]]
tag = "(0010,0034)"
keyword = "PatientDeathDateInAlternativeCalendar"
action = "X"
note = "The patient's date of death in an alternative calendar. Its VR is LO, but it holds a date in no specified format, so it could be neither shifted nor checked; it is removed under every option, like the alternative calendar date of birth. It is Type 3 in the Patient Module."

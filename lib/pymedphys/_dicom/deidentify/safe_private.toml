# Reviewed rules for the Retain Safe Private Option (PS3.15 E.3.10), curated
# by hand for one edition of PS3.15.
#
# E.3.10 retains the private attributes "known by the de-identifier to be
# safe from identity leakage". Table E.3.10-1 is one way of knowing, but its
# Note calls it "a sample list of Private Attributes thought to be safe",
# which vendors do not guarantee, and suggests retaining numeric values only,
# with code strings a possible exception, and treating bulk binary data as
# particularly unsafe. So every row of the table has a rule here, and each
# rule says how its value is handled when the Option is selected:
#
# numeric:  FD, FL, SL, SS, SV, UL, US, UV, and AT values, and IS and DS
#           values that are valid numbers of their VR.
# code:     CS values made only of the characters that VR CS allows.
# uid:      UI values, replaced as every other UID is (D-003).
# text:     LO, LT, SH, ST, UC, and UT values, cleaned as descriptors are, and
#           removed where no reviewed cleaner applies.
# sequence: SQ values, whose items are parsed and each nested attribute
#           handled on its own merits (E.3.10).
# remove:   not retained: OB, OW, and UN values, and attributes for which the
#           table gives no single VR, which cannot be checked.
#
# Each rule takes the handling of its VR unless its note says why not. A
# reviewed addition, for a private attribute that the table does not list,
# must retain its value, and cites the public document that shows it is
# safe; there are none yet. TCIA's Private Tag Dictionary, which ships in
# _tcia/, is a separate list that a run may choose instead of this one; it is
# not a source of additions.
#
# The comment after each rule is the table's description of the attribute.

schema = "pymedphys-deid-safe-private/1"
edition = "2026d"
acknowledgement = "DICOM PS3.15 2026d, © NEMA"

[[table]]
private_creator = "Philips PET Private Group"
elements = [
  { tag = "(7053,xx00)", vr = "DS", vm = "1", handling = "numeric" },  # SUV Factor - Multiplying Stored Pixel Values by Rescale Slope then this factor results in SUVbw in g/l
  { tag = "(7053,xx09)", vr = "DS", vm = "1", handling = "numeric" },  # Activity Concentration Factor - Multiplying Stored Pixel Values by Rescale Slope then this factor results in MBq/ml.
]

[[table]]
private_creator = "ELSCINT1"
elements = [
  { tag = "(00E1,xx21)", vr = "DS", vm = "1", handling = "numeric" },  # DLP
  { tag = "(00E1,xx50)", vr = "DS", vm = "1", handling = "numeric" },  # Acquisition Duration
  { tag = "(01E1,xx26)", vr = "CS", vm = "1", handling = "code" },  # Phantom Type
  { tag = "(01F1,xx01)", vr = "CS", vm = "1", handling = "code" },  # Acquisition Type
  { tag = "(01F1,xx07)", vr = "DS", vm = "1", handling = "numeric" },  # Table Velocity
  { tag = "(01F1,xx26)", vr = "DS", vm = "1", handling = "numeric" },  # Pitch
  { tag = "(01F1,xx27)", vr = "DS", vm = "1", handling = "numeric" },  # Rotation Time
]

[[table]]
private_creator = "GEMS_ACQU_01"
elements = [
  { tag = "(0019,xx23)", vr = "DS", vm = "1", handling = "numeric" },  # Table Speed [mm/rotation]
  { tag = "(0019,xx24)", vr = "DS", vm = "1", handling = "remove", note = "A time in seconds that can be an absolute time of the scan rather than a duration, and no reviewed vendor document says which, so it is removed, as the Basic Profile removes acquisition times." },  # Mid Scan Time [sec]
  { tag = "(0019,xx27)", vr = "DS", vm = "1", handling = "numeric" },  # Rotation Speed (Gantry Period)
  { tag = "(0019,xx9E)", vr = "LO", vm = "1", handling = "text" },  # Internal Pulse Sequence Name
]

[[table]]
private_creator = "GEMS_PARM_01"
elements = [
  { tag = "(0043,xx27)", vr = "SH", vm = "1", handling = "text" },  # Scan Pitch Ratio in the form "n.nnn:1"
  { tag = "(0043,xx39)", vr = "IS", vm = "4", handling = "numeric" },  # 1stvalue is B Value
  { tag = "(0043,xx6F)", vr = "DS", vm = "3-4", handling = "numeric" },  # Scanner Table Entry + Gradient Coil Selected
]

[[table]]
private_creator = "GEMS_HELIOS_01"
elements = [
  { tag = "(0045,xx01)", vr = "SS", vm = "1", handling = "numeric" },  # Number of Macro Rows in Detector
  { tag = "(0045,xx02)", vr = "FL", vm = "1", handling = "numeric" },  # Macro width at ISO Center
]


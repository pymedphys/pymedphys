# The requirements register for DICOM de-identification, curated by hand.
# The "Requirements register" section of
# docs/contrib/info/deidentification-design.md describes its fields.
# PS3.15 text is reproduced verbatim from the edition below.

schema = "pymedphys-deid-requirements/2"
edition = "2026d"
acknowledgement = "DICOM PS3.15 2026d, © NEMA"
midi_report = "Clunie DA et al., Report of the Medical Image De-Identification (MIDI) Task Group: Best Practices and Recommendations, 7 February 2025, arXiv:2303.10473"

[[requirement]]
id = "PS3.15-E.1.1-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_daa1954b-9af4-4bad-aa35-41690a97fc7f"
text = '''
Each Attribute to be protected shall then either be removed from the Data Set, or have its value replaced by a different "replacement value" that does not allow identification of the patient.
'''
status = "implemented"
decisions = ["D-001", "D-003", "D-005", "D-011", "D-020", "D-021"]
implementation = [
  "_dicom/deidentify/dummy_values.py",
  "_dicom/deidentify/edits.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/pseudonyms.py",
  "_dicom/deidentify/walker.py",
]
note = '''
Patient ID and Patient's Name have keyed replacement values that keep subjects separate and do not contain the source identifier.
Z writes a zero-length value, and D a conspicuous constant for each VR that does not depend on the source value, or a second constant where the source value equals the first, so the replacement always differs from it; a UI value takes its keyed replacement, and D on an attribute of any other VR is refused until a reviewed rule covers it.
Reviewed rules give Person Identification Code Sequence one item with a dummy code, Referenced Performed Procedure Step Sequence one item for each source item with its UID replaced, and ICC Profile a fixed sRGB profile, and keep each item of Verifying Observer Sequence with only the four attributes that PS3.3 defines there, each under its own rule (D-021).
The run's instance transform removes or replaces each Attribute to be protected in every instance it writes, and an end-to-end test of `basic` and `basic-clean-descriptors` over the synthetic collection finds none of the collection's markers in the published files (MIDI-BP-01).
'''

[[requirement]]
id = "PS3.15-E.1.1-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_08a36063-841b-4499-9a4e-8501cc83acae"
text = '''
Each Attribute specified to be retained shall be retained. At the discretion of the de-identifier, Attributes may be added to the Data Set to be protected.
'''
status = "implemented"
decisions = ["D-007", "D-011", "D-022", "D-023"]
implementation = [
  "_dicom/deidentify/actions.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/preservation.py",
  "_dicom/deidentify/preserving_writer.py",
  "_dicom/deidentify/walker.py",
]
note = '''
Reviewed rules add the text attributes, dates, and times that Table E.1-1 omits to those protected (D-022, D-023).
A policy keeps (K) each attribute that its selected options retain, and an option set that gives an attribute to be retained another action as well is rejected.
The one exception is `tps-import`, which modifies eleven device and beam hold dates and times that Retain Device Identity would keep and claims no PS3.15 conformance (D-007).
A written file can be verified against the plan for its instance: every source element is kept, changed, or removed; nothing else is written; the file has its source's transfer syntax; every change is written; and each kept element has the same VR as written, length form, and Value Field bytes as in the source, encapsulated Pixel Data the same bytes as a whole, a kept private element the same Private Creator, and kept text the same Specific Character Set in force, so a VR resolved again or text decoded and encoded again is refused.
A data set is written from its source's bytes: each kept element is copied byte for byte, including a sequence with no change in it; a kept sequence with a change in it is written with undefined lengths, keeping every item; and only replacements and introduced elements are encoded, each refused unless its text can be written in the character set in force at its place and its VR is the one written, so pydicom never re-encodes a kept value or resolves its VR again.
A plan that keeps an element inside a removed or replaced sequence, keeps a group length, or changes the character set of kept text is refused.
The run's instance transform plans each instance's data set from its policy, writes it this way, verifies it, and sequesters an instance whose output fails verification.
'''

[[requirement]]
id = "PS3.15-E.1.1-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_1c3d937e-b42b-4cd7-80db-092f09622605"
text = '''
If used, all instances of the Encrypted Attributes Data Set shall be encoded with a DICOM Transfer Syntax, encrypted, and stored in the Data Set to be protected as an Item of the Encrypted Attributes Sequence (0400,0500). The encryption shall be done using RSA [RFC 2313] for the key transport of the content-encryption keys. A de-identifier conforming to this security Profile may use either AES or Triple-DES for content-encryption. The AES key length may be any length allowed by the RFCs. The Triple-DES key length is 168 bits as defined by [ANSI X9.52]. Encoding shall be performed according to the specifications for RSA Key Transport and Triple DES Content Encryption in [RFC 3370] and for AES Content Encryption in [RFC 3565].
'''
status = "out-of-scope"
decisions = ["D-013"]
note = '''
The engine does not write the Encrypted Attributes Sequence, and removes any that its input carries (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.1-04"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_bf62b269-f6b0-4598-ab70-36dec5b54ea5"
text = '''
No requirements on the size of the asymmetric key pairs used for RSA key transport are defined in this confidentiality scheme. Implementations claiming conformance to the Basic Application Level Confidentiality Profile as a de-identifier shall always protect (e.g., encrypt and replace) the SOP Instance UID (0008,0018) Attribute as well as all references to other SOP Instances, whether contained in the main Data Set or embedded in an Item of a Sequence of Items, that could potentially be used by unauthorized entities to identify the patient.
'''
status = "implemented"
decisions = ["D-003", "D-004"]
implementation = [
  "_dicom/deidentify/edits.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/keys.py",
  "_dicom/deidentify/uid_roles.py",
  "_dicom/deidentify/uids.py",
]
note = '''
Replacement UIDs are derived from the key, so every occurrence of a UID is replaced consistently, and every UI attribute has a reviewed role.
The run's instance transform replaces each SOP Instance UID and each reference to another SOP Instance in a data set, at the top level and in sequences, with the same replacement in every instance of the run.
Under the Retain UIDs Option, the SOP Instance UID and the references that Table E.1-1 gives K under it are kept instead (PS3.15-E.3.9-01, D-040).
'''

[[requirement]]
id = "PS3.15-E.1.1-05"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_7a8255cd-d599-4fca-9414-99cca6ed47a7"
text = '''
The Attribute Patient Identity Removed (0012,0062) shall be replaced or added to the Data Set with a value of YES. Additionally, one or more codes from CID 7050 “De-identification Method” corresponding to the Profile and Options used shall be added to De-identification Method Code Sequence (0012,0064), and/or a text string describing the method used shall be inserted in or added to De-identification Method (0012,0063).
'''
status = "implemented"
decisions = ["D-012", "D-024"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/markers.py",
  "_dicom/deidentify/method_digest.py",
]
note = '''
The markers of an instance are computed from its policy, the de-identification method digest, and the options it satisfies, and added to a copy of its data set (D-012).
Patient Identity Removed is set to YES.
De-identification Method keeps its values and, unless they already include the pair as two consecutive values, gains two: the method digest, 64 lowercase hexadecimal digits, which fit one LO value, computed from the policy and everything the engine could apply, including its own source and rule files and the source files of the PyMedPhys modules it imports, whether or not the policy's options use them, and then a readable value naming PyMedPhys, its version, the PS3.15 edition, and the preset.
The digest identifies the policy and the PyMedPhys implementation and resources that apply it, not the runtime environment, which Software Versions records instead, so upgrading Python, pydicom, or tomlkit leaves it unchanged (D-012, D-024).
The digest is PyMedPhys's own provenance, added beside the readable description that this paragraph allows; PS3.15 does not require it.
De-identification Method Code Sequence keeps its items and gains the CID 7050 codes of the Basic Profile and of each satisfied option that it does not already hold.
Under a policy that claims conformance, every selected option must be satisfied except Clean Descriptors, so that the codes name each option whose actions the instance carries.
`tps-import`, which claims no conformance, adds no code and says so in its readable value.
The run's instance transform adds the markers to each instance it de-identifies, then writes the instance and verifies what it preserves.
An end-to-end test runs `basic` and `basic-clean-descriptors` over the synthetic collection and finds in every released instance Patient Identity Removed YES, the method digest as the first value of De-identification Method, and the code of the Basic Profile, with that of Clean Descriptors under `basic-clean-descriptors` and not under `basic` (MIDI-BP-01).
'''

[[requirement]]
id = "PS3.15-E.1.1-06"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_41258edc-da3a-43bb-ae04-3734051a876b"
text = '''
If the Data Set being de-identified is being stored within a DICOM File, then the File Meta Information including the 128 byte preamble, if present, shall be replaced with a description of the de-identifying application. Otherwise, there is a risk that identity information may leak through unmodified File Meta Information or preamble. See PS3.10. This includes information regarding Application Entity Titles, Presentation Addresses, implementation information, and private information.
'''
status = "implemented"
decisions = ["D-002", "D-025", "D-027"]
implementation = [
  "_dicom/deidentify/file_meta.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/preserving_writer.py",
]
note = '''
The File Meta Information that replaces the source file's describes the de-identifier by a fixed Implementation Class UID under the PyMedPhys root and an Implementation Version Name, and holds no Application Entity Title, Presentation Address, or private element.
A data set is written with it and a zeroed preamble, whatever File Meta Information and preamble the source file held.
The run's instance transform writes each de-identified instance this way.
'''

[[requirement]]
id = "PS3.15-E.1.1-07"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_3f2a2e5f-92da-442a-847e-232d77a14d9d"
text = '''
If the Data Set being de-identified is being communicated by DICOM Real-Time Video, then the File Meta Information including the 128 byte preamble, if present, shall be replaced with a description of the de-identifying application. Otherwise, there is a risk that identity information may leak through unmodified File Meta Information or preamble. See PS3.22. This includes information regarding Application Entity Titles, Presentation Addresses, implementation information, and private information.
'''
status = "not-applicable"
note = '''
The engine reads and writes DICOM files, not DICOM Real-Time Video.
'''

[[requirement]]
id = "PS3.15-E.1.1-08"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_04d7f07b-6ab7-4580-9294-c8bb7cbfec9e"
text = '''
All Data Elements with a Group Number of 0004 shall be removed from any SOP Instance or DICOM File other than a DICOMDIR File. If a DICOMDIR File is required, it shall either be created from the de-identified DICOM Files it references, or an existing DICOMDIR File shall be de-identifed according to this Profile. Any existing non-de-identified DICOMDIR File shall be removed from the File-set.
'''
status = "implemented"
decisions = ["D-016"]
implementation = [
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/run.py",
  "_dicom/deidentify/run_discovery.py",
  "_dicom/deidentify/run_results.py",
]
note = '''
Every element of group 0004 in a data set, at the top level or in an item, has a rule that removes it, under every policy, before any other rule applies.
A source DICOMDIR is never passed through, and none is written, since the output is a plain directory tree rather than a File-set (D-016): a run refuses a source file named `DICOMDIR`, whose Media Storage SOP Class UID is the Media Storage Directory Storage SOP Class, or that holds a Directory Record Sequence.
The run's instance transform applies those rules to each instance it writes, so no written file holds an element of group 0004.
'''

[[requirement]]
id = "PS3.15-E.1.1-09"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_3980cc0a-c52c-4abd-bb2d-5598fedad2ea"
text = '''
The Attributes listed in Table E.1-1 for each Profile or Option are contained in Standard IODs, or may be contained in Standard Extended IODs. An implementation claiming conformance to the Basic Application Level Confidentiality Profile as a de-identifier shall protect or retain all instances of the Attributes listed in Table E.1-1, whether contained in the top level Data Set or embedded in an Item of a Sequence of Items. The action codes in Table E.1-1a are used in Table E.1-1.
'''
status = "implemented"
decisions = ["D-001", "D-007", "D-009", "D-011", "D-020", "D-021", "D-022", "D-028"]
implementation = [
  "_dicom/deidentify/actions.py",
  "_dicom/deidentify/compound_actions.py",
  "_dicom/deidentify/edits.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/elements.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/sequences.py",
  "_dicom/deidentify/source.py",
  "_dicom/deidentify/standard.py",
  "_dicom/deidentify/walker.py",
]
note = '''
Each attribute that Table E.1-1 lists has an action under the Basic Profile and the selected options, an option's action overriding the Profile's, and an attribute to which two selected options give different actions is reported as a conflict.
Policy validation rejects every conflict except those the `tps-import` preset resolves, so each preset's policy gives every attribute one action.
A compound action of Table E.1-1a resolves to one action from the strictest Type that the instance's IOD gives the attribute at its place, at the top level or in a sequence, and X/Z on a Type 1 or 1C attribute gives D, the non-zero-length dummy value that Table E.1-1a allows Z.
A plain Z on such an attribute gives D too, and a plain D on an attribute that the IOD does not define at that place gives X, as Note 13 after Table E.1-1a describes.
A plain X removes the attribute whatever its Type; where the IOD requires the attribute at that place, the innermost enclosing sequence that the IOD makes Type 3 at its own place is removed with it, and where none encloses it, the instance is sequestered.
Removing Overlay Data removes every attribute of its repeating group, and ROI Interpreter Sequence is removed alone; so is Clinical Trial Protocol Ethics Committee Name, which Table E.1-1 gives D, since its Type 1C condition needs the approval number, which the table removes under every option (D-020).
One place departs from the table's X, as the maintainer decided: Requested Procedure ID, Type 2 in a Structured Report's Type 1C Referenced Request Sequence, is emptied there rather than sequester the report (D-020).
Each element, at the top level or in an item, is read with the VR that the pinned data dictionary gives its attribute, so that the attributes inside a sequence that pydicom does not know and reads as UN, such as an RT Plan's RT Assertions Sequence, can be found; an element whose VR conflicts with the dictionary, or whose value or items do not decode exactly, is reported as undecodable rather than read as pydicom guesses it.
Each element, at the top level or in an item, takes the rule of the first source that covers it: the engine's own removals, Table E.1-1's Private Attributes row, the table's other rows, whose masked tags match only the repeating groups, the supplementary rules and UID roles, removal by Type of other text, and the rule for attributes that no rule covers (D-022); a sequence to which an option gives C takes its Basic Profile action (D-009).
Every instance of the Private Attributes row is removed from a data set, at the top level and in the items of every standard sequence, including one that pydicom reads as UN (D-028).
A source file is admitted only once its whole structure is read from its own bytes, with every Value Length and Item Length but the undefined length even, so that every element at the top level and in items is found.
The run's instance transform applies the resolved actions to every instance of each attribute in each instance it de-identifies, at the top level and in sequences, including the sequences and overlay groups that a plain X removes with an attribute, sequesters the instances that a plain X calls for, and removes private attributes.
'''

[[requirement]]
id = "PS3.15-E.1.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_5b59ff63-97b3-463c-b620-baaf9c1d98c8"
text = '''
The application shall decrypt, using its recipient key, one instance of the Encrypted Content (0400,0520) Attribute within the Encrypted Attributes Sequence (0400,0500) and decode the resulting block of bytes into a DICOM Data Set using the Transfer Syntax specified in the Encrypted Content Transfer Syntax UID (0400,0510). Re-identifiers claiming conformance to this Profile shall be capable of decrypting the Encrypted Content using either AES or Triple-DES in all possible key lengths specified in this Profile.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.2-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_f6c7c02e-f2ab-455f-a868-449791d534b6"
text = '''
The application shall move all Attributes contained in the single item of the Modified Attributes Sequence (0400,0550) of the decoded Data Set into the top level Data Set, replacing "dummy value" Attributes that may be present in the top level Data Set.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.2-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_f9cea275-9cd9-4112-bd77-630521aaecf7"
text = '''
The Attribute Patient Identity Removed (0012,0062) shall be replaced or added to the Data Set with a value of NO and De-identification Method (0012,0063) and De-identification Method Code Sequence (0012,0064) shall be removed.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.3-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_6d2a4608-8e1e-4783-9841-ff86b8e54bf1"
text = '''
The Conformance Statement of an application that claims conformance to the Basic Application Level Confidentiality Profile shall describe:

- which Attributes are removed during protection;
- which Attributes are replaced by dummy values and how the dummy values are generated;
- which Attributes are included in Encrypted Attributes Data Sets for later re-identification, and any pertinent details about how keys are selected for performing the encryption;
- the scope across which the application is able to ensure referential integrity of replacement values for references such as SOP Instance UID, Frame of Reference UID, etc. if multiple SOP instances are protected (e.g., across multiple Studies, consistent replacement if the same Study processed more than once, etc.);
- which Attributes and Attribute Values are inserted during protection of a SOP instance;
- which Transfer Syntaxes are supported for encoding/decoding of the Encrypted Attributes Data Set;
- which Options are supported;
- any additional restrictions (e. g. key sizes for public keys).
'''
status = "implemented"
decisions = ["D-003", "D-004", "D-005", "D-006", "D-007", "D-008", "D-012", "D-013", "D-016", "D-020", "D-021", "D-022", "D-023", "D-025", "D-026", "D-027"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_markdown.py",
  "_dicom/deidentify/conformance_values.py",
  "_dicom/deidentify/run_report.py",
]
note = '''
The conformance statement of a policy is generated as CommonMark from the policy, the pinned tables, and the engine's parameters.
It lists the action that the engine applies to each attribute of Table E.1-1, of each supplementary rule, and of each UI attribute that the table omits, with each compound action resolved by Type at every place where a supported IOD defines the attribute (D-020), and why where the engine's own removals, the File Meta Information that it writes in place of the source's (D-025), or a sequence given C supersede the policy's action; the rules that give every other element its action (D-022); the values that Z, D, and U write, including the reviewed item of Person Identification Code Sequence, the keyed pseudonyms at the top level of the data set, the synthetic birth dates of `tps-import` (D-008), and replacement UIDs of at most 44 characters (D-003, D-005, D-021); how dates and times are handled: without a Retain Longitudinal Temporal Information Option, by the listed actions of the attributes that have a temporal role, unshifted (D-006, D-007, D-023); referential integrity within a run under its 256-bit key, and none across runs (D-004); that no attribute is encrypted for later re-identification, so that no transfer syntax encodes an Encrypted Attributes Data Set (D-013); the attributes and values that the markers insert, as the engine computes them for the policy (D-012); the removal of private attributes at every level of nesting; what the residual search covers, and each reason it lists a value as not searched (D-027); how the release report names each sequestered instance by a label drawn at random for the run, with each stage and reason code (D-026), including the release gate's withholding of every file of a subject one of whose instances gave no values to search, counts the instances held for review by the codes that can hold one, and counts the values that the residual search does not search by attribute and reason, with per-instance detail only in the confidential QC pack (D-027); and the options applied, those that can be composed, and those that are not supported.
It describes what each run's QC pack lists for review: each distinct retained string (D-017), each instance whose attributes show an indicator of risk in its pixel data, and each CT, MR, PET, and RT Dose volume, CT, MR, and PET localizer, RT Image, and Segmentation among the released and held instances, with whether it names the head or neck (D-015).
A statement lists what it cannot yet describe and then claims nothing.
Plain X, Z, and D are resolved by Type at every place too (D-020), except within a sequence that the engine removes with its contents, and the resolved Z and D are checked against the walker's plan of a synthetic instance.
Where an IOD requires an attribute given a plain X, the statement names the enclosing sequence or overlay group that D-020 removes with it, or that the instance is sequestered, and each is checked against the walker's plan of a synthetic instance; it gives Requested Procedure ID Z in a dose report's Referenced Request Sequence, and says that this departs from the table's X.
Under Clean Descriptors, it describes how ROI Name is cleaned in two tiers: automatic renaming against a published TG-263 edition, which it names, and reviewers' decisions, with every reason a name is held, what is written for each, and the condition on which an instance gains the Clean Descriptors code, each checked against the engine (D-009).
Each run with a release reporter writes the statement of its policy, as `conformance-statement.md` beside the release report at the root of the release, since it holds no instance value; it describes the policy and vocabulary that the report records, and the report gives the run's own method digest and reviewed-names digest.
The statements of `basic` and `basic-clean-descriptors` list nothing as pending.
For each selected option that has a cleaner, it gives the attributes that the policy gives C and the cleaner settles, with its method: the AE titles under Retain Device Identity (D-034), the free text under Retain Patient Characteristics, which writes none of its values itself and, under Clean Descriptors too, is given the reviewed descriptors list's decisions (D-038, PS3.15-E.3.7-02), and the dates and times that Modified Dates modifies (D-039, PS3.15-E.3.6-04).
A statement still lists as pending, and so claims nothing for, the manner of cleaning any other attribute to which the policy gives C other than under Clean Descriptors alone; this completes with those options.
Under `tps-import`, it describes the synthetic birth dates that Patient's Birth Date takes, how the reference study is chosen, the empty value written where the ages are missing or inconsistent, and the `birth-date-conflict` sequestration of a later run that contradicts the reference (D-008).
Under `tps-import`, it gives each attribute other than ROI Name that the policy gives C the action that the preset's other options give it, with the eleven device dates and times modified as the preset modifies them, as descriptor cleaning falls back to it (D-009).
Under Retain Safe Private, it describes how the reviewed safe private rules are matched and applied, and lists each rule that can retain an attribute (D-035, PS3.15-E.3.10-04).
'''

[[requirement]]
id = "PS3.15-E.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.2.html#para_5279f5b8-f623-45dc-85f9-a64d7842b064"
text = '''
The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "REMOVED" if none of the Retain Longitudinal Temporal Information Options is applied.
'''
status = "implemented"
decisions = ["D-012", "D-031"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/markers.py",
]
note = '''
Every policy that does not apply Modified Dates, the only Retain Longitudinal Temporal Information Option in scope, sets Longitudinal Temporal Information Modified to REMOVED in its markers, replacing any value already present, since REMOVED is the strictest, and refusing a present value that is not UNMODIFIED, MODIFIED, or REMOVED (D-012).
The run's instance transform adds it to each instance it de-identifies.
An end-to-end test runs `basic` and `basic-clean-descriptors`, neither of which applies Modified Dates, over the synthetic collection and finds REMOVED in every released instance (MIDI-BP-01).
MIDI-B's answer keys expect another value here, under their TCIA review category, so every released instance that the key checks there fails that check by design (D-031).
'''

[[requirement]]
id = "PS3.15-E.3.1-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.html#para_10d107c2-b55c-4b9f-8817-f317d1e756c4"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information burned in to the Pixel Data (7FE0,0010) corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "implemented"
decisions = ["D-015", "D-033", "D-037", "D-048"]
implementation = [
  "_dicom/deidentify/api.py",
  "_dicom/deidentify/command.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/pixel_cleaning.py",
  "_dicom/deidentify/pixel_decoding.py",
  "_dicom/deidentify/pixel_region_rules.py",
  "_dicom/deidentify/pixel_region_rules_command.py",
  "_dicom/deidentify/redaction_review.py",
  "_dicom/deidentify/text_detection.py",
]
note = '''
Text that a text finder finds in Pixel Data is blacked out, whatever it says, and every instance cleaned is held for review (D-037).
Reviewed region rules, kept by the custodian and keyed by SOP Class UID, Manufacturer, Manufacturer's Model Name, Rows, and Columns, add rectangles that are blacked out in every frame of a matching image beside the finder's regions; the instance is still held for review, the QC pack records which regions rules gave, and the rules' keyed digest is an input to the method digest (D-024, D-037).
A private command records a rule from an attested QC pack, holding only regions that the reviewer's verdict approved for the image, keyed by the image's source file, which must have the SHA-256 that the pack records (D-037, D-048).
Compressed Pixel Data is decoded first, in the isolated decoding child for the native decoders, and its frames are written uncompressed, in Explicit VR Little Endian, as decoded, with or without a region, so that the QC pack previews the samples that a release writes (D-037).
In native Pixel Data, the bit plane of an overlay that an overlay group without Overlay Data places above High Bit is cleared in the same write, and its group removed, so the instance is cleaned rather than sequestered as uncleanable-pixel-data (D-037).
A later run of the same files, given the attested QC pack, blacks out the regions that the reviewer accepted, with any that the reviewer added, without the finder, and releases the instance with the option's code; for compressed Pixel Data, only where its frames decode to the SHA-256 that the pack records, and otherwise the instance is held again. An instance that the reviewer rejected is sequestered (D-048).
The private command's run under the option, and the library's, makes the text detector with the pinned model, and takes the attested QC pack whose verdicts apply and the custodian's region rules (D-033).
A workflow run by hand counts the regions that the text detector finds in the slices of the HaN-Seg data set's 42 head and neck planning CTs and 42 T1-weighted MRs, which hold no burned-in text, on a hosted runner that alone downloads it, and publishes only counts, which bear on how many regions a reviewer clears; it claims no result (D-037).
'''

[[requirement]]
id = "PS3.15-E.3.1-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.html#para_caede39a-46e2-4eec-9a38-1a37dbd70926"
text = '''
The Attribute Burned In Annotation (0028,0301) shall be added to the Data Set with a Value of "NO".
'''
status = "implemented"
decisions = ["D-012", "D-015", "D-048"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/markers.py",
]
note = '''
Applies only with the Clean Pixel Data Option.
An instance that satisfies the option, because it holds no top-level pixel data or a reviewer approved its regions, has Burned In Annotation set to NO, replacing any value present, whether or not its IOD defines the attribute; in the RT Plan, RT Structure Set, RT Beams Treatment Record, MR Spectroscopy, Spatial Registration, Deformable Spatial Registration, X-Ray Radiation Dose SR, and Radiopharmaceutical Radiation Dose SR IODs, which do not, it is a standard attribute of a Standard Extended SOP Class (PS3.2 Section 7.3), and the validators' findings of it there are known differences (D-048).
Any other instance keeps Burned In Annotation as received, and it is never set to NO otherwise (D-015).
'''

[[requirement]]
id = "PS3.15-E.3.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.2.html#para_e022456d-4042-4795-88e5-80e9fc6aa308"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, if there is sufficient visual information within the Pixel Data of a set of instances to allow an individual to be recognized from the instances themselves or a reconstruction of a set of instances, then sufficient removal or distortion of the Pixel Data shall be applied to prevent recognition.
'''
status = "implemented"
decisions = ["D-015", "D-016", "D-017", "D-033", "D-046", "D-050", "D-051", "D-052", "D-054"]
implementation = [
  "_dicom/deidentify/api.py",
  "_dicom/deidentify/command.py",
  "_dicom/deidentify/defacing.py",
  "_dicom/deidentify/dose_defacing.py",
  "_dicom/deidentify/face_blocks.py",
  "_dicom/deidentify/face_review.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/pixel_cleaning.py",
  "_dicom/deidentify/qc_attestation.py",
  "_dicom/deidentify/qc_contours.py",
  "_dicom/deidentify/region_defacing.py",
  "_dicom/deidentify/segmentation_defacing.py",
]
note = '''
The engine claims the option only for an instance in which a reviewer found no recognisable face, by the attested face verdicts of an earlier run's QC pack, matched by the SHA-256 of each source file and of the pixel data, and an RT Structure Set's contours, that the run writes of it, or one that cannot show a face (D-046).
The library's run under the option, and the private command's, take the attested QC pack whose face verdicts apply, and refuse to start without one (D-033, D-046).
The `public-release` preset selects the option, as do custom option sets that name it (Presets, D-046).
The QC pack shows each RT Structure Set's contours, as written, on a contour sheet, with every surface that an ROI hides behind its own and every mark that it would hide, to within two voxels, at most 4 mm, of its edge as seen from the front, the back, and the sides, and records their SHA-256 only where it shows them, and the pixel data's only where previews that could show a face draw every frame, a volume's slices by its projection and surface render, and an RT Dose's only by renders of its surfaces at each of a ladder of dose levels, from any dose above 0 up, with every surface that a level hides behind its own, or a map of a lone plane by those levels, so a verdict releases only contours and pixel data that the reviewer saw, and an instance the pack does not show in full is held, as is a set with a voxel of hidden marks that its rows' frontal view, view from behind, and profiles cannot draw, even where an oblique view would; the hidden marks are drawn in layers, each contour's where no other's lie beside them, so that is only where one contour's own marks lie side by side within its ROI's region, as where one line drawn back and forth covers a patch or near the tip of a sharp V (D-017).
Every other instance that can show a face, with pixel data, as an RT Structure Set, or as a Deformable Spatial Registration with a deformation grid, which no preview of the pack draws, is held for review and never released, so no released instance that claims the option has the visual information that the paragraph requires to be removed or distorted.
Under the option, the engine also writes air into the face block of each CT series in which it finds one, keeping the brain in the cranial cavity above the orbits, and holds a series with a target in its block or an eye ROI away from the globes it found, and each RT Structure Set, RT Dose with pixel data, PET instance, or Segmentation in a defaced series' Frame of Reference, naming none, or referring to a defaced slice, which it does not clean (D-050), but for an RT Dose in the frame of only one defaced series, whose dose in that series' block, less the brain kept, it sets to zero, or holds where that dose is too great (D-051), and an RT Structure Set or single-frame PET image in such a frame, whose contours that reach the face it cuts by the block, less the brain kept where a contour allows, and whose activity in the block, less the brain kept, it sets to zero, and a Segmentation in such a frame, once Segmentation is in scope, whose pixels in a segment in the block, less the brain kept, it writes as its background, holding one with any such pixel without a verdict, since the QC pack does not yet show segments (D-052); a defaced instance still claims the option only where a reviewer found no recognisable face in it as defaced.
A workflow run by hand checks the face block and the air written against the eye and organ masks of the HaN-Seg data set's 42 head and neck planning CTs, on a hosted runner that alone downloads it, and publishes only counts, which bear on D-050's placeholder margin and eye reach, though not its cavity floor, since HaN-Seg marks no brain; it claims no result (D-054).
A development command run on a person's own machine applies the same finder, target and eye ROI holds, RT Dose defacing, and contour cutting to a directory of DICOM files, such as planning exports, renders nothing, and writes only counts, which bear on D-050's placeholder margin and eye reach and D-051's dose fraction, though not the cavity floor, since it measures no brain; it claims no result either (D-054).
'''

[[requirement]]
id = "PS3.15-E.3.2-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.2.html#para_94fec0c3-65fa-465b-a269-59d262066345"
text = '''
The Attribute Recognizable Visual Features (0028,0302) shall be added to the Data Set with a Value of "NO".
'''
status = "implemented"
decisions = ["D-012", "D-015", "D-046"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/markers.py",
]
note = '''
Applies only with the Clean Recognizable Visual Features Option.
An instance that satisfies the option has Recognizable Visual Features set to NO, replacing any value present, whether or not its IOD defines the attribute; in the RT Plan, RT Structure Set, RT Beams Treatment Record, MR Spectroscopy, Spatial Registration, Deformable Spatial Registration, X-Ray Radiation Dose SR, and Radiopharmaceutical Radiation Dose SR IODs, which do not, it is a standard attribute of a Standard Extended SOP Class (PS3.2 Section 7.3), and the validators' findings of it there are known differences (D-046).
Under any other policy, Recognizable Visual Features is kept as received and never set to NO (D-015).
'''

[[requirement]]
id = "PS3.15-E.3.3-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.3.html#para_628bbc9f-6ba4-4316-bfcd-fdc7bc2d3076"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information encoded in graphics, text annotations or overlays corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "implemented"
decisions = ["D-041"]
implementation = [
  "_dicom/deidentify/clean_graphics.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/pixel_cleaning.py",
]
note = '''
The engine applies the Clean Graphics Option to a custom option set; no preset selects it (D-041).
No cleaner of graphics exists yet, so each of the four rows that Table E.1-1 gives C under the option takes its Basic Profile action: Curve Data, Overlay Data, and Overlay Comments are removed, Overlay Data with its overlay group where the IOD's Overlay Plane Module is user-optional, and Graphic Annotation Sequence takes D, which removes it from every supported IOD.
Every instance written under the option claims it, since E.3.3 specifies what the option removes and Table E.1-1 gives the minimum actions, as for Clean Descriptors (D-009).
An overlay group that has no Overlay Data may place its overlay in unused bits of Pixel Data; under the option, that bit plane is cleared above High Bit in native Pixel Data, in the same write as Clean Pixel Data's redaction, the written Pixel Data is checked to differ from the source in nothing else, and the overlay's group is removed, so the instance is released with the option's code (D-041).
An instance whose overlay cannot be so cleared, such as one in compressed Pixel Data or within Bits Stored, is sequestered under the option as overlay-in-pixel-data.
The conformance statement gives each row its Basic Profile action and why.
'''

[[requirement]]
id = "PS3.15-E.3.4-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.4.html#para_004bdf87-7f40-48e2-b5f4-eab3e21d7103"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information encoded in SR Content Items or Acquisition Context or Specimen Preparation Sequence Items corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed.
'''
status = "implemented"
decisions = ["D-001", "D-010", "D-047"]
implementation = [
  "_dicom/deidentify/content_items.py",
  "_dicom/deidentify/removed_items.py",
  "_dicom/deidentify/structured_content.py",
  "_dicom/deidentify/supplementary_concepts.py",
  "_dicom/deidentify/codes.py",
  "_dicom/deidentify/walker.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/policy.py",
]
note = '''
The engine applies the Clean Structured Content Option to a custom option set; no preset selects it (D-047).
Of the Structured Reports, the X-Ray and Radiopharmaceutical Radiation Dose SRs are supported and the others sequestered (D-010); of the supported IODs, only those two define Content Sequence, at their root, and none Waveform Annotation Sequence. Waveform Annotation Sequence takes its Basic Profile action; Content Sequence is cleaned wherever an IOD defines it, at any depth of its nested Content Sequences, with the root content item that holds it, and a report whose tree cannot be kept is sequestered, since the Basic Profile gives Content Sequence D and a sequence has no dummy value (D-021).
Acquisition Context Sequence and Specimen Preparation Sequence are kept where the IOD defines them, and each content item is cleaned by its Value Type and concept name, as Table E.3.4-1 gives them, generated for the concept names that DICOM and SNOMED CT code (D-001).
A reviewed list gives the table's actions to the concepts that it omits where PS3.16's templates use them for a patient characteristic that Table E.1-1 removes, each removed, and kept under Retain Patient Characteristics where Table E.1-1 keeps the attribute that holds it, and to Subject ID as a CODE, which TID 1007 gives it and the table lists only as TEXT, removed under every option (D-047).
An item whose concept name neither the table nor the list gives keeps its codes and numbers, and its other values take their own rules, as in any kept sequence.
A concept name coded by a retired SNOMED designator, SRT, SNM3, or 99SDM, is looked up as the SNOMED CT code that PS3.16 Table O-1 maps it to (D-001).
X/D gives D wherever the concept appears, as though a template required the item there, and so do the X rows of DateTime Ended and X-Ray Attenuator Model Data, which Enhanced X-Ray Radiation Dose reports' templates require; D writes the dummy value of the value's VR, and gives a UIDREF item's UID the replacement that U gives, which keeps a registered UID such as a public frame of reference.
An item cannot be kept where the selected options remove it, where its concept name is coded in a scheme whose rows the table does not hold, or where it is coded by a retired SNOMED designator with a code that Table O-1 does not map. In Acquisition Context Sequence and Specimen Preparation Sequence, such an item, or one that cannot be read as one Value Type and one concept name, makes the whole sequence take its Basic Profile action. In Content Sequence, such an item is removed on its own, with everything in it, and so is each item that names a removed item by Referenced Content Item Identifier, and each CONTAINER left with no items; any other item left with no items loses its Content Sequence, which is Type 1C, and each kept Referenced Content Item Identifier is renumbered to name the same item in the output (D-047). A report whose root cannot be kept or is left with no items, whose tree holds an item that cannot be read, or whose tree loses an item while holding a Referenced Content Item Identifier that names no item of it, is sequestered.
The synthetic collection's two dose reports carry markers in their content-item values and are released only where Clean Structured Content keeps their trees; each value is kept or replaced by its concept's row of Table E.3.4-1.
'''

[[requirement]]
id = "PS3.15-E.3.5-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.5.html#para_eb16943f-79ba-4765-bedf-94a66b6744ac"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information that is embedded in text or string Attributes corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "implemented"
decisions = ["D-009", "D-022", "D-036"]
implementation = [
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/roi_names.py",
  "_dicom/deidentify/reviewed_roi_names.py",
  "_dicom/deidentify/reviewed_names_command.py",
  "_dicom/deidentify/reviewed_descriptors.py",
  "_dicom/deidentify/reviewed_descriptors_command.py",
  "_dicom/deidentify/technique_descriptors.py",
  "_dicom/deidentify/common_names.py",
  "_dicom/deidentify/run_report.py",
  "_dicom/deidentify/run_qc.py",
  "_dicom/deidentify/qc_pack.py",
]
note = '''
The first supported release includes the Option for ROI names (D-009).
The automatic tier decides, for the ROI names of one structure set, which are written in the spelling of the TG-263 spreadsheet's published edition, whose entries' digest the module records, because they match one of its names once case, spaces, and the separators `_` and `-` are disregarded (a hyphen in a vocabulary name, which TG-263 writes for a subtraction, must be matched by one, and a name starting with `_`, which TG-263 gives a structure not used for dose evaluation, or `-` goes to review), and which go to review, because they match none or several, echo a known patient or other person identifier, or would duplicate a differently spelt name of the same structure set.
A name so written is cleaned, not retained, so it needs no review before the claim.
The reviewed-names list, which the custodian keeps outside output and QC directories and which names no value in its errors or `repr`, records a reviewer's decision to keep, map, or empty each other name, for reuse on later runs.
The reviewed tier applies the list's decisions to the names the automatic tier does not rename; checks what a kept or mapped name would write for echoes and for duplicates, ignoring case, as the automatic tier does; holds every other name, or empties it where the user chooses so explicitly; and collects the distinct held names for review, with counts by reason that carry no name, and counts every name by what is written for it.
The list's keyed digest, an HMAC under the key in a domain of its own, which reveals no name, is an input to the method digest and recorded in the release report (D-024).
In a run, descriptor cleaning applies these decisions to the ROI Names of each instance, holds an instance with a held name for review, or empties the name where the user chooses so and then does not claim the Option for it; gives every other attribute given C its action without the Option, and still claims the Option where that action removes or replaces each, since this Option specifies what is removed, not what is retained; and gives the QC pack what it wrote for each ROI Name, or why it held it; the run's method digest and release report take the keyed digest, under the de-identification key, of the list's decisions as they stood when the run's transform was made, which are the decisions it applies, and the report counts the instances held for review by reason.
A private command records a reviewer's decisions from a CSV file in the list, all or nothing, refusing a decision that differs from the list's unless told to replace it.
The release report counts the ROI Names of the structure sets that descriptor cleaning cleaned, each by its outcome, and the distinct names sent for review by reason, whether then held or emptied unreviewed, without a name.
A run can also be given an institutional list converted from CSV, as the maintainer decided on 6 October 2026; it renames nothing, and the QC pack shows the reviewer of a held name the list's names it matched.
A ROI Name kept or mapped by a reviewer's decision in the reviewed-names list has passed pooled human review, since each distinct name is reviewed once for the collection.
A reviewed descriptors list, kept as the reviewed-names list is and filled by a private command of its own, records a reviewer's decision to keep, map, or empty one value of each other text attribute given C, and the reviewed tier for those values checks what a kept or mapped value would write for echoes of identifiers, also within its letters and digits, and holds every other value.
For the technique descriptors of D-036, such as Series Description and Protocol Name, an automatic tier keeps a value that the list has no decision on where every word of it is in the reviewed technique vocabulary, which leaves out common personal names that are not reviewed exceptions, and it echoes no identifier.
In a run, descriptor cleaning applies both tiers to each such descriptor whose decoded value it collected in its dictionary VR, each value of a multi-valued VR alone, and writes the element with what they give only where every value is cleaned, at least one has text, and no kept value is beside a mapped or emptied one; every other such element takes its action without the Option, and still claims it where that action removes or replaces it.
A kept value is left out of the residual search and listed among the retained strings; the QC pack lists each element's values, outcomes, and whether it was written; the release report counts them without a value; and the method digest takes the list's keyed digest and the vocabulary's SHA-256 (D-024).
An instance withheld before cleaning leaves the descriptors that cleaning would keep out of its subject's search in the same way, so they do not hold the rest of its series.
'''

[[requirement]]
id = "PS3.15-E.3.5-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.5.html#para_aa4daf86-3e83-4fb1-bb77-75ca192fa98b"
text = '''
The manner of cleaning shall be described in the Conformance Statement.
'''
status = "implemented"
decisions = ["D-009", "D-036"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_markdown.py",
]
note = '''
The conformance statement describes how ROI Name (3006,0026) is cleaned under Clean Descriptors: automatic renaming against the published TG-263 edition that it names, or none without such a vocabulary, the reasons a name goes to review, the reviewers' decisions, the checks of what a reviewed decision would write, that a run's method digest covers its reviewed list (D-024), and what cleaning writes for each name, including that a held name holds its instance for review.
It also says that a run can be given an institutional list of ROI names, which renames nothing and only shows the reviewer of a held name the list's names it matched.
It describes how free-text descriptors are cleaned: the reviewed descriptors list's decisions, the technique descriptors and the rules by which the technique vocabulary keeps a value (D-036), the echo checks, and when an element is written with what cleaning gives it.
Every other attribute given C under Clean Descriptors, and a free-text descriptor that cleaning does not write, takes the action that the policy gives it without that option, as the maintainer decided on 6 October 2026 (D-009); the statement lists that action for each, at each place, as the one the engine applies, so for `basic-clean-descriptors` it lists no manner of cleaning as pending.
The manner of cleaning an attribute to which the policy gives C without Clean Descriptors too and that no cleaner cleans is listed as pending until its option is implemented; the dates and times under Modified Dates are described with their cleaner (PS3.15-E.3.6-04), and the free text that Retain Patient Characteristics gives C is described with the Option's cleaner, which settles Allergies, Patient State, and Sex Parameters for Clinical Use Category Comment before Clean Descriptors where both are selected, and leaves each value to the reviewed descriptors list, which decides on Pre-Medication and Special Needs too (PS3.15-E.3.7-02).
'''

[[requirement]]
id = "PS3.15-E.3.6-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_389c7767-f03f-4716-970d-72a2766aabfa"
text = '''
When the Retain Longitudinal Temporal Information With Full Dates Option is specified in addition to the Basic Application Level Confidentiality Profile, any dates and times present in the Attributes shall be retained, as described in Table E.1-1. The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "UNMODIFIED".
'''
status = "implemented"
decisions = ["D-012", "D-023", "D-042", "D-043"]
implementation = [
  "_dicom/deidentify/actions.py",
  "_dicom/deidentify/markers.py",
  "_dicom/deidentify/option_kept.py",
  "_dicom/deidentify/policy.py",
]
note = '''
A custom policy can select Full Dates, which keeps every date and time that Table E.1-1 gives K under it and the supplementary rules keep under it (D-023); it cannot be selected with Modified Dates.
Longitudinal Temporal Information Modified is UNMODIFIED, unless MODIFIED or REMOVED is already present from an earlier run, which is kept because the dates that run modified or removed are not restored (D-012).
A removed or replaced source value, other than the kept element's own, that equals the whole of a kept date is explained by it and does not withhold the instance; one found inside a longer kept value, such as the date of a kept datetime, still does (D-042, D-043).
'''

[[requirement]]
id = "PS3.15-E.3.6-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_b71081d0-569f-4426-aa01-b0765ce1ab32"
text = '''
When the Retain Longitudinal Temporal Information With Modified Dates Option is specified in addition to the Basic Application Level Confidentiality Profile, any dates and times present in the Attributes listed in Table E.1-1 shall be modified. The modification of the dates and times shall be performed in a manner that:

- aggregates or transforms dates so as to reduce the possibility of matching for re-identification
- preserves the gross longitudinal temporal relationships between images obtained on different dates to the extent necessary for the application
- preserves the fine temporal relationships between images and real-world events to the extent necessary for analysis of the images for the application
'''
status = "implemented"
decisions = ["D-004", "D-006", "D-007", "D-034", "D-039"]
implementation = [
  "_dicom/deidentify/cleaners.py",
  "_dicom/deidentify/dates.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/modified_dates.py",
  "_dicom/deidentify/temporal_roles.py",
]
note = '''
Under Modified Dates, a cleaner of the whole instance modifies every value of the 184 attributes that Table E.1-1 and the supplementary rules give C, by its attribute's reviewed temporal role (D-007, D-039).
A subject-event or radiation-source DA or DT value moves back by the subject's whole-week offset, derived from the key and the subject's identity at first export, which keeps intervals, weekdays, times, and decay intervals; a TM value is kept, since whole weeks keep the time of day (D-006); and Frame Origin Timestamp moves its seconds.
Device, vocabulary-version, and other values take D's dummy value, which discloses nothing of the offset; time zone offsets become a nominal +0000 once each DT value with its own offset is in the instance's local time, which keeps every interval within the instance.
A value that cannot be modified so, such as a DT value without a full date, sequesters its instance.
Under `tps-import`, the eleven device and beam hold dates and times that Retain Device Identity would keep are modified by their role instead.
The offset is the one the subject's profile records (D-004): under a run-scoped key, consistent within a run only; under a project key, read back from the subject profile store in every later run, once project keys are enabled.
'''

[[requirement]]
id = "PS3.15-E.3.6-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_eb42e924-3cfc-4d91-aa01-0f153b41b88c"
text = '''
The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "MODIFIED".
'''
status = "implemented"
decisions = ["D-012", "D-039"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/markers.py",
]
note = '''
Every policy that applies Modified Dates, including `tps-import`, sets Longitudinal Temporal Information Modified to MODIFIED in its markers, unless REMOVED is already present from an earlier run, which is kept because the dates that run removed are not restored (D-012).
The run's instance transform adds it to each instance it de-identifies, which under Modified Dates is written only once every date and time in it is modified (D-039).
'''

[[requirement]]
id = "PS3.15-E.3.6-04"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_cc45149e-ac5e-4b26-bb5f-b8af861cc54d"
text = '''
The manner of date modification shall be described in the Conformance Statement.
'''
status = "implemented"
decisions = ["D-006", "D-007", "D-039"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_values.py",
  "_dicom/deidentify/modified_dates.py",
]
note = '''
The statement of a policy that selects Modified Dates gives the attributes that its cleaner modifies and the cleaner's method: the offset's range and derivation, how each role's values are modified, how local time is chosen, and which values sequester their instance; under Dates and times, it counts the attributes given C by role (D-039).
'''

[[requirement]]
id = "PS3.15-E.3.7-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.7.html#para_2c0a8a67-3b2e-4aad-9153-8491ced6d071"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, information about age, sex, height and weight and other characteristics present in the Attributes shall be retained, as described in Table E.1-1.
'''
status = "implemented"
decisions = ["D-009", "D-011", "D-012", "D-022", "D-034", "D-038"]
implementation = [
  "_dicom/deidentify/cleaners.py",
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/patient_characteristics.py",
  "_dicom/deidentify/reviewed_descriptors.py",
]
note = '''
The fourteen attributes that the Option gives K are kept as read, wherever they are in the data set, with the Option's code (D-038).
Its five attributes of free text, which it gives C, are written with no value where they have none.
Where the policy also selects Clean Descriptors, as `tps-import` does, each other value is kept, mapped, or emptied by a reviewer's decision in the custodian's reviewed descriptors list, and an instance with a value that the list does not clean is held for review, as for ROI Names (D-009); without Clean Descriptors, such an instance is sequestered.
So a released instance retains every characteristic it held, its free text as a reviewer decided (PS3.15-E.3.7-02).
The measures of the body that Table E.1-1 omits, such as Patient's Body Mass Index, are removed under every option (D-022).
Of the presets, only `tps-import` selects the Option, and it is not yet enabled.
'''

[[requirement]]
id = "PS3.15-E.3.7-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.7.html#para_324c4b43-2572-4a19-917c-cab57003b769"
text = '''
The manner of cleaning of retained Attributes shall be described in the Conformance Statement.
'''
status = "implemented"
decisions = ["D-009", "D-034", "D-038"]
implementation = [
  "_dicom/deidentify/cleaners.py",
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_markdown.py",
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/patient_characteristics.py",
]
note = '''
The statement of a policy that selects the Option lists the fourteen attributes that it keeps, with K, and gives the five that it gives C with their method: an attribute with no value is written with none; without Clean Descriptors, no other value is written and its instance is sequestered; with Clean Descriptors, each value takes a reviewer's decision from the reviewed descriptors list, checked for echoes of identifiers, and an instance with a value that the list does not clean is held for review (D-038).
No method cleans their free text automatically, and the automatic tier of technique descriptors does not apply to them; the maintainer decided on 25 October 2026 that the reviewed descriptors list decides on them (D-038).
'''

[[requirement]]
id = "PS3.15-E.3.8-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.8.html#para_b25bc4b3-fc71-4f14-b464-79b8a6591b62"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, information about the identity of the device in the Attributes shall be retained, as described in Table E.1-1.
'''

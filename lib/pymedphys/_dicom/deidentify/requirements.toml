# The requirements register for DICOM de-identification, curated by hand.
# The "Requirements register" section of
# docs/contrib/info/deidentification-design.md describes its fields.
# PS3.15 text is reproduced verbatim from the edition below.

schema = "pymedphys-deid-requirements/2"
edition = "2026d"
acknowledgement = "DICOM PS3.15 2026d, © NEMA"
midi_report = "Clunie DA et al., Report of the Medical Image De-Identification (MIDI) Task Group: Best Practices and Recommendations, 7 February 2025, arXiv:2303.10473"

[[requirement]]
id = "PS3.15-E.1.1-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_daa1954b-9af4-4bad-aa35-41690a97fc7f"
text = '''
Each Attribute to be protected shall then either be removed from the Data Set, or have its value replaced by a different "replacement value" that does not allow identification of the patient.
'''
status = "partial"
milestone = "M3"
decisions = ["D-001", "D-003", "D-005", "D-011", "D-020", "D-021"]
implementation = [
  "_dicom/deidentify/dummy_values.py",
  "_dicom/deidentify/pseudonyms.py",
]
note = '''
Patient ID and Patient's Name have keyed replacement values that keep subjects separate and do not contain the source identifier.
Z writes a zero-length value, and D a conspicuous constant for each VR that does not depend on the source value, or a second constant where the source value equals the first, so the replacement always differs from it; a UI value takes its keyed replacement, and D on an attribute of any other VR is refused until a reviewed rule covers it.
The one reviewed rule so far gives Person Identification Code Sequence one item with a dummy code (D-021).
Remaining: removing or replacing each Attribute to be protected in a data set (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_08a36063-841b-4499-9a4e-8501cc83acae"
text = '''
Each Attribute specified to be retained shall be retained. At the discretion of the de-identifier, Attributes may be added to the Data Set to be protected.
'''
status = "partial"
milestone = "M3"
decisions = ["D-007", "D-011", "D-022", "D-023"]
implementation = [
  "_dicom/deidentify/actions.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/preservation.py",
  "_dicom/deidentify/preserving_writer.py",
]
note = '''
Reviewed rules add the text attributes, dates, and times that Table E.1-1 omits to those protected (D-022, D-023).
A policy keeps (K) each attribute that its selected options retain, and an option set that gives an attribute to be retained another action as well is rejected.
The one exception is `tps-import`, which modifies eleven device and beam hold dates and times that Retain Device Identity would keep and claims no PS3.15 conformance (D-007).
A written file can be verified against the plan for its instance: every source element is kept, changed, or removed; nothing else is written; the file has its source's transfer syntax; every change is written; and each kept element has the same VR as written, length form, and Value Field bytes as in the source, a kept private element the same Private Creator, and kept text the same Specific Character Set in force, so a VR resolved again or text decoded and encoded again is refused.
A data set is written from its source's bytes: each kept element is copied byte for byte, including a sequence with no change in it; a kept sequence with a change in it is written with undefined lengths, keeping every item; and only replacements and introduced elements are encoded, each refused unless its text can be written in the character set in force at its place and its VR is the one written, so pydicom never re-encodes a kept value or resolves its VR again.
A plan that keeps an element inside a removed or replaced sequence, keeps a group length, or changes the character set of kept text is refused.
Remaining: planning each instance's data set from its policy, and sequestering an instance whose output fails verification (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_1c3d937e-b42b-4cd7-80db-092f09622605"
text = '''
If used, all instances of the Encrypted Attributes Data Set shall be encoded with a DICOM Transfer Syntax, encrypted, and stored in the Data Set to be protected as an Item of the Encrypted Attributes Sequence (0400,0500). The encryption shall be done using RSA [RFC 2313] for the key transport of the content-encryption keys. A de-identifier conforming to this security Profile may use either AES or Triple-DES for content-encryption. The AES key length may be any length allowed by the RFCs. The Triple-DES key length is 168 bits as defined by [ANSI X9.52]. Encoding shall be performed according to the specifications for RSA Key Transport and Triple DES Content Encryption in [RFC 3370] and for AES Content Encryption in [RFC 3565].
'''
status = "out-of-scope"
decisions = ["D-013"]
note = '''
The engine does not write the Encrypted Attributes Sequence, and removes any that its input carries (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.1-04"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_bf62b269-f6b0-4598-ab70-36dec5b54ea5"
text = '''
No requirements on the size of the asymmetric key pairs used for RSA key transport are defined in this confidentiality scheme. Implementations claiming conformance to the Basic Application Level Confidentiality Profile as a de-identifier shall always protect (e.g., encrypt and replace) the SOP Instance UID (0008,0018) Attribute as well as all references to other SOP Instances, whether contained in the main Data Set or embedded in an Item of a Sequence of Items, that could potentially be used by unauthorized entities to identify the patient.
'''
status = "partial"
milestone = "M3"
decisions = ["D-003", "D-004"]
implementation = [
  "_dicom/deidentify/keys.py",
  "_dicom/deidentify/uid_roles.py",
  "_dicom/deidentify/uids.py",
]
note = '''
Replacement UIDs are derived from the key, so every occurrence of a UID is replaced consistently, and every UI attribute has a reviewed role.
Remaining: replacing each SOP Instance UID and reference in a data set, including in sequences (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-05"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_7a8255cd-d599-4fca-9414-99cca6ed47a7"
text = '''
The Attribute Patient Identity Removed (0012,0062) shall be replaced or added to the Data Set with a value of YES. Additionally, one or more codes from CID 7050 “De-identification Method” corresponding to the Profile and Options used shall be added to De-identification Method Code Sequence (0012,0064), and/or a text string describing the method used shall be inserted in or added to De-identification Method (0012,0063).
'''
status = "partial"
milestone = "M3"
decisions = ["D-012", "D-024"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/markers.py",
  "_dicom/deidentify/method_digest.py",
]
note = '''
The markers of an instance are computed from its policy, the de-identification method digest, and the options it satisfies, and added to a copy of its data set (D-012).
Patient Identity Removed is set to YES.
De-identification Method keeps its values and, unless they already include the pair as two consecutive values, gains two: the method digest, 64 lowercase hexadecimal digits, which fit one LO value, computed from the policy and everything the engine could apply, including its own source and rule files, whether or not the policy's options use them, and then a readable value naming PyMedPhys, its version, the PS3.15 edition, and the preset.
The digest identifies the policy and the PyMedPhys implementation and resources that apply it, not the runtime environment, which Software Versions records instead, so upgrading Python, pydicom, or tomlkit leaves it unchanged (D-012, D-024).
The digest is PyMedPhys's own provenance, added beside the readable description that this paragraph allows; PS3.15 does not require it.
De-identification Method Code Sequence keeps its items and gains the CID 7050 codes of the Basic Profile and of each satisfied option that it does not already hold.
Under a policy that claims conformance, every selected option must be satisfied except Clean Descriptors, so that the codes name each option whose actions the instance carries.
`tps-import`, which claims no conformance, adds no code and says so in its readable value.
The run's instance transform adds the markers to each instance it de-identifies, then writes the instance and verifies what it preserves.
Remaining: validating each preset end to end (M4).
'''

[[requirement]]
id = "PS3.15-E.1.1-06"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_41258edc-da3a-43bb-ae04-3734051a876b"
text = '''
If the Data Set being de-identified is being stored within a DICOM File, then the File Meta Information including the 128 byte preamble, if present, shall be replaced with a description of the de-identifying application. Otherwise, there is a risk that identity information may leak through unmodified File Meta Information or preamble. See PS3.10. This includes information regarding Application Entity Titles, Presentation Addresses, implementation information, and private information.
'''
status = "partial"
milestone = "M3"
decisions = ["D-002", "D-025", "D-027"]
implementation = [
  "_dicom/deidentify/file_meta.py",
  "_dicom/deidentify/preserving_writer.py",
]
note = '''
The File Meta Information that replaces the source file's describes the de-identifier by a fixed Implementation Class UID under the PyMedPhys root and an Implementation Version Name, and holds no Application Entity Title, Presentation Address, or private element.
A data set is written with it and a zeroed preamble, whatever File Meta Information and preamble the source file held.
Remaining: writing each de-identified instance this way (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-07"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_3f2a2e5f-92da-442a-847e-232d77a14d9d"
text = '''
If the Data Set being de-identified is being communicated by DICOM Real-Time Video, then the File Meta Information including the 128 byte preamble, if present, shall be replaced with a description of the de-identifying application. Otherwise, there is a risk that identity information may leak through unmodified File Meta Information or preamble. See PS3.22. This includes information regarding Application Entity Titles, Presentation Addresses, implementation information, and private information.
'''
status = "not-applicable"
note = '''
The engine reads and writes DICOM files, not DICOM Real-Time Video.
'''

[[requirement]]
id = "PS3.15-E.1.1-08"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_04d7f07b-6ab7-4580-9294-c8bb7cbfec9e"
text = '''
All Data Elements with a Group Number of 0004 shall be removed from any SOP Instance or DICOM File other than a DICOMDIR File. If a DICOMDIR File is required, it shall either be created from the de-identified DICOM Files it references, or an existing DICOMDIR File shall be de-identifed according to this Profile. Any existing non-de-identified DICOMDIR File shall be removed from the File-set.
'''
status = "partial"
milestone = "M4"
decisions = ["D-016"]
implementation = [
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/run.py",
  "_dicom/deidentify/run_results.py",
]
note = '''
Every element of group 0004 in a data set, at the top level or in an item, has a rule that removes it, under every policy, before any other rule applies.
A source DICOMDIR is never passed through, and none is written, since the output is a plain directory tree rather than a File-set (D-016): a run refuses a source file named `DICOMDIR` or whose Media Storage SOP Class UID is the Media Storage Directory Storage SOP Class.
Remaining: removing group 0004 from each instance the engine writes, with the rest of the file container (M4).
'''

[[requirement]]
id = "PS3.15-E.1.1-09"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_3980cc0a-c52c-4abd-bb2d-5598fedad2ea"
text = '''
The Attributes listed in Table E.1-1 for each Profile or Option are contained in Standard IODs, or may be contained in Standard Extended IODs. An implementation claiming conformance to the Basic Application Level Confidentiality Profile as a de-identifier shall protect or retain all instances of the Attributes listed in Table E.1-1, whether contained in the top level Data Set or embedded in an Item of a Sequence of Items. The action codes in Table E.1-1a are used in Table E.1-1.
'''
status = "partial"
milestone = "M3"
decisions = ["D-001", "D-007", "D-009", "D-011", "D-020", "D-021", "D-022", "D-028"]
implementation = [
  "_dicom/deidentify/actions.py",
  "_dicom/deidentify/compound_actions.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/elements.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/private_attributes.py",
  "_dicom/deidentify/sequences.py",
  "_dicom/deidentify/source.py",
  "_dicom/deidentify/standard.py",
]
note = '''
Each attribute that Table E.1-1 lists has an action under the Basic Profile and the selected options, an option's action overriding the Profile's, and an attribute to which two selected options give different actions is reported as a conflict.
Policy validation rejects every conflict except those the `tps-import` preset resolves, so each preset's policy gives every attribute one action.
A compound action of Table E.1-1a resolves to one action from the strictest Type that the instance's IOD gives the attribute at its place, at the top level or in a sequence, and X/Z on a Type 1 or 1C attribute gives D, the non-zero-length dummy value that Table E.1-1a allows Z.
A plain Z on such an attribute gives D too, and a plain D on an attribute that the IOD does not define at that place gives X, as Note 13 after Table E.1-1a describes.
A plain X removes the attribute whatever its Type; where the IOD requires the attribute at that place, the innermost enclosing sequence that the IOD makes Type 3 at its own place is removed with it, and where none encloses it, the instance is sequestered.
Removing Overlay Data removes every attribute of its repeating group, and ROI Interpreter Sequence is removed alone (D-020).
Each element, at the top level or in an item, is read with the VR that the pinned data dictionary gives its attribute, so that the attributes inside a sequence that pydicom does not know and reads as UN, such as an RT Plan's RT Assertions Sequence, can be found; an element whose VR conflicts with the dictionary, or whose value or items do not decode exactly, is reported as undecodable rather than read as pydicom guesses it.
Each element, at the top level or in an item, takes the rule of the first source that covers it: the engine's own removals, Table E.1-1's Private Attributes row, the table's other rows, whose masked tags match only the repeating groups, the supplementary rules and UID roles, removal by Type of other text, and the rule for attributes that no rule covers (D-022); a sequence to which an option gives C takes its Basic Profile action (D-009).
Every instance of the Private Attributes row is removed from a data set, at the top level and in the items of every standard sequence, including one that pydicom reads as UN (D-028).
A source file is admitted only once its whole structure is read from its own bytes, with every Value Length and Item Length but the undefined length even, so that every element at the top level and in items is found.
Remaining: applying the resolved actions to every instance of each attribute, at the top level and in sequences, including the sequences and overlay groups that a plain X removes with an attribute and the instances that it sequesters, and removing private attributes from each instance the engine de-identifies (M3).
'''

[[requirement]]
id = "PS3.15-E.1.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_5b59ff63-97b3-463c-b620-baaf9c1d98c8"
text = '''
The application shall decrypt, using its recipient key, one instance of the Encrypted Content (0400,0520) Attribute within the Encrypted Attributes Sequence (0400,0500) and decode the resulting block of bytes into a DICOM Data Set using the Transfer Syntax specified in the Encrypted Content Transfer Syntax UID (0400,0510). Re-identifiers claiming conformance to this Profile shall be capable of decrypting the Encrypted Content using either AES or Triple-DES in all possible key lengths specified in this Profile.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.2-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_f6c7c02e-f2ab-455f-a868-449791d534b6"
text = '''
The application shall move all Attributes contained in the single item of the Modified Attributes Sequence (0400,0550) of the decoded Data Set into the top level Data Set, replacing "dummy value" Attributes that may be present in the top level Data Set.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.2-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_f9cea275-9cd9-4112-bd77-630521aaecf7"
text = '''
The Attribute Patient Identity Removed (0012,0062) shall be replaced or added to the Data Set with a value of NO and De-identification Method (0012,0063) and De-identification Method Code Sequence (0012,0064) shall be removed.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.3-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_6d2a4608-8e1e-4783-9841-ff86b8e54bf1"
text = '''
The Conformance Statement of an application that claims conformance to the Basic Application Level Confidentiality Profile shall describe:

- which Attributes are removed during protection;
- which Attributes are replaced by dummy values and how the dummy values are generated;
- which Attributes are included in Encrypted Attributes Data Sets for later re-identification, and any pertinent details about how keys are selected for performing the encryption;
- the scope across which the application is able to ensure referential integrity of replacement values for references such as SOP Instance UID, Frame of Reference UID, etc. if multiple SOP instances are protected (e.g., across multiple Studies, consistent replacement if the same Study processed more than once, etc.);
- which Attributes and Attribute Values are inserted during protection of a SOP instance;
- which Transfer Syntaxes are supported for encoding/decoding of the Encrypted Attributes Data Set;
- which Options are supported;
- any additional restrictions (e. g. key sizes for public keys).
'''
status = "partial"
milestone = "M6"
decisions = ["D-003", "D-004", "D-005", "D-006", "D-007", "D-012", "D-013", "D-016", "D-020", "D-021", "D-022", "D-023", "D-025", "D-026", "D-027"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_markdown.py",
  "_dicom/deidentify/conformance_values.py",
  "_dicom/deidentify/run_report.py",
]
note = '''
The conformance statement of a policy is generated as CommonMark from the policy, the pinned tables, and the engine's parameters.
It lists the action that the engine applies to each attribute of Table E.1-1, of each supplementary rule, and of each UI attribute that the table omits, with each compound action resolved by Type at every place where a supported IOD defines the attribute (D-020), and why where the engine's own removals, the File Meta Information that it writes in place of the source's (D-025), or a sequence given C supersede the policy's action; the rules that give every other element its action (D-022); the values that Z, D, and U write, including the reviewed item of Person Identification Code Sequence, the keyed pseudonyms at the top level of the data set, and replacement UIDs of at most 44 characters (D-003, D-005, D-021); how dates and times are handled: without a Retain Longitudinal Temporal Information Option, by the listed actions of the attributes that have a temporal role, unshifted (D-006, D-007, D-023); referential integrity within a run under its 256-bit key, and none across runs (D-004); that no attribute is encrypted for later re-identification, so that no transfer syntax encodes an Encrypted Attributes Data Set (D-013); the attributes and values that the markers insert, as the engine computes them for the policy (D-012); the removal of private attributes at every level of nesting; what the residual search covers, and each reason it lists a value as not searched (D-027); how the release report names each sequestered instance by a label drawn at random for the run, with each stage and reason code (D-026), and counts the values that the residual search does not search by attribute and reason, with per-instance detail only in the confidential QC pack (D-027); and the options applied, those that can be composed, and those that are not supported.
A statement lists what it cannot yet describe and then claims nothing.
Plain X, Z, and D are resolved by Type at every place too (D-020), except within a sequence that the engine removes with its contents, and the resolved Z and D are checked against the walker's plan of a synthetic instance.
Where an IOD requires an attribute given a plain X, the statement names the enclosing sequence or overlay group that D-020 removes with it, or that the instance is sequestered, and each is checked against the walker's plan of a synthetic instance.
Under Clean Descriptors, it describes how ROI Name is cleaned in two tiers: automatic renaming against a published TG-263 edition, which it names, and reviewers' decisions, with every reason a name is held (D-009).
Each run with a release reporter writes the statement of its policy, as `conformance-statement.md` beside the release report at the root of the release, since it holds no instance value; it describes the policy and vocabulary that the report records, and the report gives the run's own method digest and reviewed-names digest.
Remaining: the manner of cleaning every other attribute given C, including how Modified Dates modifies dates and times; the safe private attributes retained, for a policy that selects Retain Safe Private; the synthetic birth date of `tps-import`; and writing the release report and the confidential QC pack with each run, searching each written file, recording the values that the engine does not give the residual search, acting on the search's findings, and recording in the report an instance that the run itself or a gate sequesters (D-016, D-026, D-027).
'''

[[requirement]]
id = "PS3.15-E.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.2.html#para_5279f5b8-f623-45dc-85f9-a64d7842b064"
text = '''
The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "REMOVED" if none of the Retain Longitudinal Temporal Information Options is applied.
'''
status = "partial"
milestone = "M3"
decisions = ["D-012"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/markers.py",
]
note = '''
Every policy that does not apply Modified Dates, the only Retain Longitudinal Temporal Information Option in scope, sets Longitudinal Temporal Information Modified to REMOVED in its markers, replacing any value already present, since REMOVED is the strictest, and refusing a present value that is not UNMODIFIED, MODIFIED, or REMOVED (D-012).
The run's instance transform adds it to each instance it de-identifies.
Remaining: validating each preset end to end (M4).
'''

[[requirement]]
id = "PS3.15-E.3.1-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.html#para_10d107c2-b55c-4b9f-8817-f317d1e756c4"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information burned in to the Pixel Data (7FE0,0010) corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "out-of-scope"
decisions = ["D-015"]
note = '''
The Clean Pixel Data Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.1-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.html#para_caede39a-46e2-4eec-9a38-1a37dbd70926"
text = '''
The Attribute Burned In Annotation (0028,0301) shall be added to the Data Set with a Value of "NO".
'''
status = "out-of-scope"
decisions = ["D-015"]
note = '''
Applies only with the Clean Pixel Data Option.
Burned In Annotation is kept as received and never set to NO (D-015).
'''

[[requirement]]
id = "PS3.15-E.3.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.2.html#para_e022456d-4042-4795-88e5-80e9fc6aa308"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, if there is sufficient visual information within the Pixel Data of a set of instances to allow an individual to be recognized from the instances themselves or a reconstruction of a set of instances, then sufficient removal or distortion of the Pixel Data shall be applied to prevent recognition.
'''
status = "out-of-scope"
decisions = ["D-015"]
note = '''
The Clean Recognizable Visual Features Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.2-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.2.html#para_94fec0c3-65fa-465b-a269-59d262066345"
text = '''
The Attribute Recognizable Visual Features (0028,0302) shall be added to the Data Set with a Value of "NO".
'''
status = "out-of-scope"
decisions = ["D-015"]
note = '''
Applies only with the Clean Recognizable Visual Features Option.
Recognizable Visual Features is kept as received and never set to NO (D-015).
'''

[[requirement]]
id = "PS3.15-E.3.3-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.3.html#para_628bbc9f-6ba4-4316-bfcd-fdc7bc2d3076"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information encoded in graphics, text annotations or overlays corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "out-of-scope"
note = '''
The Clean Graphics Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.4-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.4.html#para_004bdf87-7f40-48e2-b5f4-eab3e21d7103"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information encoded in SR Content Items or Acquisition Context or Specimen Preparation Sequence Items corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed.
'''
status = "out-of-scope"
decisions = ["D-010"]
note = '''
The Clean Structured Content Option is later work.
Until then, Structured Reports are sequestered (D-010).
'''

[[requirement]]
id = "PS3.15-E.3.5-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.5.html#para_eb16943f-79ba-4765-bedf-94a66b6744ac"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information that is embedded in text or string Attributes corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "partial"
milestone = "M4"
decisions = ["D-009", "D-022"]
implementation = [
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/roi_names.py",
  "_dicom/deidentify/reviewed_roi_names.py",
  "_dicom/deidentify/reviewed_names_command.py",
  "_dicom/deidentify/run_report.py",
]
note = '''
The first supported release includes the Option for ROI names (D-009).
The automatic tier decides, for the ROI names of one structure set, which are written in the spelling of the TG-263 spreadsheet's published edition, whose entries' digest the module records, because they match one of its names once case, spaces, and the separators `_` and `-` are disregarded (a hyphen in a vocabulary name, which TG-263 writes for a subtraction, must be matched by one, and a name starting with `_`, which TG-263 gives a structure not used for dose evaluation, or `-` goes to review), and which go to review, because they match none or several, echo a known patient or other person identifier, or would duplicate a differently spelt name of the same structure set.
A name so written is cleaned, not retained, so it needs no review before the claim.
The reviewed-names list, which the custodian keeps outside output and QC directories and which names no value in its errors or `repr`, records a reviewer's decision to keep, map, or empty each other name, for reuse on later runs.
The reviewed tier applies the list's decisions to the names the automatic tier does not rename; checks what a kept or mapped name would write for echoes and for duplicates, ignoring case, as the automatic tier does; holds every other name, or empties it where the user chooses so explicitly; and collects the distinct held names for review, with counts by reason that carry no name, and counts every name by what is written for it.
The list's keyed digest, an HMAC under the key in a domain of its own, which reveals no name, is an input to the method digest and recorded in the release report (D-024).
In a run, descriptor cleaning applies these decisions to the ROI Names of each instance, holds an instance with a held name for review, or empties the name where the user chooses so and then does not claim the Option for it; gives every other attribute given C its action without the Option, and still claims the Option where that action removes or replaces each, since this Option specifies what is removed, not what is retained; and gives the QC pack what it wrote for each ROI Name, or why it held it; the run's method digest and release report take the keyed digest, under the de-identification key, of the list's decisions as they stood when the run's transform was made, which are the decisions it applies, and the report counts the instances held for review by reason.
A private command records a reviewer's decisions from a CSV file in the list, all or nothing, refusing a decision that differs from the list's unless told to replace it.
The release report counts the ROI Names of the structure sets that descriptor cleaning cleaned, each by its outcome, and the distinct names sent for review by reason, whether then held or emptied unreviewed, without a name.
Remaining: vocabularies converted from an institutional list, every match against which goes to review.
A ROI Name kept or mapped by a reviewer's decision in the reviewed-names list has passed pooled human review, since each distinct name is reviewed once for the collection.
'''

[[requirement]]
id = "PS3.15-E.3.5-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.5.html#para_aa4daf86-3e83-4fb1-bb77-75ca192fa98b"
text = '''
The manner of cleaning shall be described in the Conformance Statement.
'''
status = "partial"
milestone = "M6"
decisions = ["D-009"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_markdown.py",
]
note = '''
The conformance statement describes how ROI Name (3006,0026) is cleaned under Clean Descriptors: automatic renaming against the published TG-263 edition that it names, or none without such a vocabulary, the reasons a name goes to review, the reviewers' decisions, the checks of what a reviewed decision would write, that a run's method digest covers its reviewed list (D-024), and what cleaning writes for each name, including that a held name holds its instance for review.
It lists applying that cleaning in a run as pending, since no run yet does.
Remaining: applying ROI Name cleaning in each run, and the manner of cleaning every other attribute given C, such as the other descriptors and, under Modified Dates, the dates and times (E.3.6).
'''

[[requirement]]
id = "PS3.15-E.3.6-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_389c7767-f03f-4716-970d-72a2766aabfa"
text = '''
When the Retain Longitudinal Temporal Information With Full Dates Option is specified in addition to the Basic Application Level Confidentiality Profile, any dates and times present in the Attributes shall be retained, as described in Table E.1-1. The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "UNMODIFIED".
'''
status = "out-of-scope"
note = '''
The Retain Longitudinal Temporal Information with Full Dates Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.6-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_b71081d0-569f-4426-aa01-b0765ce1ab32"
text = '''
When the Retain Longitudinal Temporal Information With Modified Dates Option is specified in addition to the Basic Application Level Confidentiality Profile, any dates and times present in the Attributes listed in Table E.1-1 shall be modified. The modification of the dates and times shall be performed in a manner that:

- aggregates or transforms dates so as to reduce the possibility of matching for re-identification
- preserves the gross longitudinal temporal relationships between images obtained on different dates to the extent necessary for the application
- preserves the fine temporal relationships between images and real-world events to the extent necessary for analysis of the images for the application
'''
status = "partial"
milestone = "M3"
decisions = ["D-006", "D-007"]
implementation = [
  "_dicom/deidentify/dates.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/profiles.py",
  "_dicom/deidentify/temporal_roles.py",
]
note = '''
Each subject's offset is persisted in its profile, DA and DT values are shifted by whole weeks, keeping intervals, weekdays, and times, and every attribute that Table E.1-1 cleans under Modified Dates has a reviewed role that decides whether it is shifted or replaced by a dummy value.
Time zone offsets become a nominal +0000 once each DT value with its own offset is in the instance's local time, which keeps every interval within the instance.
Under `tps-import`, the eleven device and beam hold dates and times that Retain Device Identity would keep are modified by their role instead.
Remaining: modifying every date and time in a data set (M3).
'''

[[requirement]]
id = "PS3.15-E.3.6-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_eb42e924-3cfc-4d91-aa01-0f153b41b88c"
text = '''
The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "MODIFIED".
'''
status = "partial"
milestone = "M3"
decisions = ["D-012"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/markers.py",
]
note = '''
Every policy that applies Modified Dates, including `tps-import`, sets Longitudinal Temporal Information Modified to MODIFIED in its markers, unless REMOVED is already present from an earlier run, which is kept because the dates that run removed are not restored (D-012).
The run's instance transform adds it to each instance it de-identifies.
Remaining: validating each preset end to end (M4).
'''

[[requirement]]
id = "PS3.15-E.3.6-04"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_cc45149e-ac5e-4b26-bb5f-b8af861cc54d"
text = '''
The manner of date modification shall be described in the Conformance Statement.
'''
status = "planned"
milestone = "M6"
decisions = ["D-006", "D-007"]

[[requirement]]
id = "PS3.15-E.3.7-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.7.html#para_2c0a8a67-3b2e-4aad-9153-8491ced6d071"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, information about age, sex, height and weight and other characteristics present in the Attributes shall be retained, as described in Table E.1-1.
'''
status = "planned"
milestone = "M3"
decisions = ["D-011"]

[[requirement]]
id = "PS3.15-E.3.7-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.7.html#para_324c4b43-2572-4a19-917c-cab57003b769"
text = '''
The manner of cleaning of retained Attributes shall be described in the Conformance Statement.
'''
status = "planned"
milestone = "M6"

[[requirement]]
id = "PS3.15-E.3.8-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.8.html#para_b25bc4b3-fc71-4f14-b464-79b8a6591b62"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, information about the identity of the device in the Attributes shall be retained, as described in Table E.1-1.
'''
status = "planned"
milestone = "M3"
decisions = ["D-003", "D-007", "D-022"]
note = '''
`tps-import` also selects Modified Dates, which conflicts with this Option for device dates, so its output claims neither (D-007).
'''

[[requirement]]
id = "PS3.15-E.3.9-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.9.html#para_d44e046d-c417-4283-9556-695a778ca4f5"
text = '''
When this Option is specified in addition to an Application Level Confidentiality Profile, UIDs shall be retained, as described in Table E.1-1.
'''
status = "out-of-scope"
note = '''
The Retain UIDs Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.10-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_bb1aaf5b-ab3d-4b05-8226-c7282cf98dc9"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, Private Attributes that are known by the de-identifier to be safe from identity leakage shall be retained, together with the Private Creator IDs that are required to fully define the retained Private Attributes; all other Private Attributes shall be removed or processed in the element-specific manner recommended by Deidentification Action (0008,0307), if present within Private Data Element Characteristics Sequence (0008,0300) (see PS3.3 Section C.12.1).
'''
status = "planned"
milestone = "M3"
decisions = ["D-001", "D-028"]
note = '''
Until reviewed rules say which private attributes are safe, a policy that selects the Option is refused (D-028).
'''

[[requirement]]
id = "PS3.15-E.3.10-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_0c838fa8-6930-4559-a492-67c204358848"
text = '''
When this Option is not specified, all Private Attributes shall be removed, as described in Table E.1-1.
'''
status = "partial"
milestone = "M3"
decisions = ["D-028"]
implementation = [
  "_dicom/deidentify/private_attributes.py",
  "_dicom/deidentify/sequences.py",
]
note = '''
Every element of an odd group, including private creators and the elements that PS3.5 does not allow, is removed from a data set, at the top level and in the items of every standard sequence, including one that pydicom reads as UN, and a private sequence is removed with everything in it.
A standard sequence that cannot be decoded exactly, that is stored with a VR other than SQ or UN, or whose items have a Specific Character Set that pydicom does not map as given or that is stored with another VR, is refused by its path; it is removed where a rule removes it or a sequence that holds it, and otherwise its instance is sequestered (D-028).
Remaining: removing them from each instance the engine de-identifies (M3).
'''

[[requirement]]
id = "PS3.15-E.3.10-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_d9eb6fdb-b5c9-44d8-91f9-e0fe71983689"
text = '''
When an entire Sequence (SQ VR) Private Attribute is not known to always only contain safe content, whether that content consists of Standard Attributes or Private Attributes or a combination of both, then when the Retain Safe Private Option is used, any such Sequence Attribute shall be parsed in its entirety and each of the nested Attributes handled on its own merits, rather than removing the Sequence in its entirety without further consideration. Reviewing the content may be a sensible practice to apply even to nominally known safe Private Sequence Attributes.
'''
status = "planned"
milestone = "M3"
decisions = ["D-028"]
note = '''
Without the Option, a private sequence is removed with everything in it, and a policy that selects the Option is refused until reviewed rules say which private attributes are safe (D-028).
'''

[[requirement]]
id = "PS3.15-E.3.10-04"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_74598302-fb52-4831-9a57-fa49e4698746"
text = '''
The safe Private Attributes that are retained shall be described in the Conformance Statement.
'''
status = "planned"
milestone = "M6"

[[requirement]]
id = "PS3.15-E.3.11-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.11.html#para_00ca9c5a-ce04-4906-ae1f-920d2e0c2c40"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, information about the identity of the institution in the Attributes shall be retained, as described in Table E.1-1.
'''
status = "out-of-scope"
note = '''
The Retain Institution Identity Option is not supported.
'''

# MIDI Task Group report, section 1.6, summarised in PyMedPhys's words.

[[requirement]]
id = "MIDI-BP-01"
text = '''
For public sharing, remove or replace all known direct identifiers and relevant indirect identifiers and sensitive information wherever they occur: collection descriptions, supporting data, structured and unstructured text, pixel data, and overlays. Justify retaining any indirect identifier with a collection-specific expert statistical analysis of residual risk against a predetermined threshold, which considers other public information about the subjects and holds only at the time it was done.
'''
status = "partial"
milestone = "M4"
decisions = ["D-001", "D-015", "D-016", "D-017", "D-022", "D-023", "D-027"]
implementation = [
  "_dicom/deidentify/file_layout.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/release_gate.py",
  "_dicom/deidentify/residuals.py",
]
note = '''
The Basic Profile's actions remove or replace identifiers, and reviewed rules act on the text attributes, dates, and times that Table E.1-1 omits (D-022, D-023).
Every byte of a written file, from the preamble to any bytes after its last readable element, can be searched for the source values that had to be removed or replaced, and each one found is reported by its source attribute and its place in the file, never by its value.
A source value, or a form of one, equal to a constant that the engine writes is not searched, and is recorded by its source attribute (D-027).
The release gate runs that search itself, for exactly the values collected across the file's subject, and checks the collection against the values the walker planned to collect.
It withholds any output file that still holds a source person name, UID, date, datetime, or direct identifier, or a source value outside its data set, or whose collection of person names, UIDs, dates, datetimes, direct identifiers, or sequences was incomplete, and sends other text findings and other incomplete collection, including of private values, to confidential review; a search that finds nothing does not on its own release a file (D-027).
`public-release` retains indirect identifiers only after its statistical assessment.
A deterministic synthetic collection plants a conspicuous marker wherever its IODs define an attribute of Table E.1-1, down to a nesting depth of 4 items, and records each deeper place as not planted; Responsible Person and Responsible Organization, whose removal sequesters an instance (D-020), are planted in one instance only, so the others can be released.
The run's instance transform removes and replaces identifiers in each data set and gives the gate its coverage, including each value read as ISO 8859-1, and the run acts on the gate's decision.
An instance out of scope whose IOD the pinned tables define is read only to collect its values for its subject's search, and is never written; an instance whose values could not be collected at all withholds every file of its subject.
Remaining: validating each preset end to end by searching its output of that collection for the markers, the statistical assessment, and pixel and face review (M4).
Pixel data are assessed for risk, not cleaned (D-015).
'''

[[requirement]]
id = "MIDI-BP-02"
text = '''
Define re-use utility for the widest range of conceivable uses, including those beyond the releasing entity's own, and quantify utility where possible when assessing residual risk.
'''
status = "not-applicable"
note = '''
A decision for whoever releases the data.
The engine's Options and presets are the means it offers.
'''

[[requirement]]
id = "MIDI-BP-03"
text = '''
Do not let de-identification compromise conformance with the standards that define the content or reduce functionality. DICOM output should still conform to its original IOD, with dummy values synthesised where needed and replacement values consistent across files within a defined scope, such as replaced UIDs that keep references intact. This covers optional attributes critical to functionality as well as required ones.
'''
status = "partial"
milestone = "M4"
decisions = ["D-001", "D-003", "D-005", "D-008", "D-011", "D-020", "D-021", "D-026"]
implementation = [
  "_dicom/deidentify/compound_actions.py",
  "_dicom/deidentify/dummy_values.py",
  "_dicom/deidentify/elements.py",
  "_dicom/deidentify/file_layout.py",
  "_dicom/deidentify/iods.py",
  "_dicom/deidentify/preserving_writer.py",
  "_dicom/deidentify/qc_pack.py",
  "_dicom/deidentify/reference_graph.py",
  "_dicom/deidentify/references.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/run.py",
  "_dicom/deidentify/run_qc.py",
  "_dicom/deidentify/run_report.py",
  "_dicom/deidentify/run_results.py",
  "_dicom/deidentify/sequences.py",
  "_dicom/deidentify/sop_classes.py",
  "_dicom/deidentify/values.py",
  "_dicom/deidentify/written_references.py",
]
note = '''
The Type of each attribute of the first supported release's IODs, and of every other composite IOD but the three real-time ones, in each module and sequence, including within each of an IOD's Functional Group Macros, is generated from PS3.3, so the engine can tell where an IOD requires a value; PS3.4 Table B.5-1 gives the IOD of an instance from its SOP Class UID; and a value can be checked against its VR and VM before it is written.
Compound actions resolve from the strictest of these Types, so in those IODs they never remove an attribute where it is Type 1, 1C, 2, or 2C, or empty one where it is Type 1 or 1C, and a plain Z on a Type 1 or 1C attribute gives D's dummy value too.
A plain X on an attribute that the IOD requires at its place removes with it the innermost enclosing sequence that the IOD makes Type 3 at its own place, or sequesters the instance where none encloses it, so it never leaves the output without an attribute that the IOD requires; Overlay Data takes its whole repeating group, whose module is user-optional in the CT Image IOD, and ROI Interpreter Sequence, whose condition lapses once ROI Creator Sequence is removed, goes alone (D-020).
Every dummy value is valid for its VR and for the VM of each attribute of Table E.1-1 that can take it, as is each element of the dummy item of Person Identification Code Sequence, and an attribute whose VR has no generic dummy value and no reviewed rule is refused rather than given an invalid value.
Before anything is written, a first pass over a collection follows the reference attributes that PS3.3 defines inside a sequence of each instance's IOD, and reports each reference that names no instance, series, or study in the collection, and each instance without its SOP Instance, Series Instance, or Study Instance UID.
It also reports instances that share a SOP Instance UID, as identical copies only where their source bytes, the transfer syntax and the data set as the file encodes it, are shown to be the same, and as conflicting copies otherwise; a series whose instances name several studies; and a study whose instances name several patients, each a Patient ID with its issuer, with the instances without a Patient ID as one more.
An element to be written is built with a VR that the pinned dictionary gives it, of alternatives the one that applies in its data set, only once its values have been checked against that VR and the attribute's VM, against the data set's character set, and, for a person name, against the repertoire of its first component group, and it reads back unchanged from Implicit and Explicit VR Little Endian.
A data set is written from its source's bytes, so a kept element keeps the VR its source gives it, such as SS for the VOI LUT Descriptor of a CT image in Hounsfield Units, where pydicom's writer can resolve it again as US.
A sequence kept as UN keeps its items in implicit VR, and a replacement in implicit VR is written only where the pinned dictionary gives its VR alone, since a reader takes the VR from its dictionary.
A run acts on those findings before it writes anything: a study with several patients stops it, every conflicting copy, every instance of a series in several studies, and every instance without one of those UIDs is sequestered, an identical duplicate is written once, and a dangling reference is only reported.
The release report counts the instances with each kind of finding that the run reports only, and the QC pack lists each such finding at each instance it names, with the attribute's tags and its count.
A second pass checks what was written against the first: that each written instance's SOP Instance, Series Instance, and Study Instance UIDs, and each value at its reference sites, are the keyed replacements of its input's, never a source UID; that each reference that named an input before writing names a written instance, series, or study after it; that no two source UIDs share a replacement; and that no two written instances share a SOP Instance UID.
Remaining: writing the dummy values that the resolved compound actions call for (M3); and checking frames of reference in the first pass, validating output against its IOD, and running the second pass on each run's output (M4).
'''

[[requirement]]
id = "MIDI-BP-04"
text = '''
Preserve as much information about image acquisition as possible, including machine identity, characteristics, and settings, unless it is shown to raise residual risk above the predetermined threshold.
'''
status = "planned"
milestone = "M3"
decisions = ["D-007", "D-022"]
note = '''
`tps-import` retains device identity.
`public-release` omits it, because device serial numbers and machine names can identify an institution and, with dates, individual treatments.
'''

[[requirement]]
id = "MIDI-BP-05"
text = '''
Remove or replace the identities of other persons, departments, institutions, and organisations, except where they are needed for utility and a residual risk assessment supports keeping them.
'''
status = "partial"
milestone = "M3"
decisions = ["D-001", "D-022"]
implementation = [
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/supplementary_actions.py",
]
note = '''
Every person name in the pinned dictionary has an action that removes or replaces it under the Basic Profile, from Table E.1-1 or from a reviewed supplementary action.
Every text attribute that a supported IOD uses is removed or replaced too, other than coded and technical values and De-identification Method, which the engine adds to; the names and identifiers of people, organisations, records, and networks, and identifiers that a device reads, among those that Table E.1-1 omits are removed under every option, and accessory and equipment identifiers are kept only under Retain Device Identity (D-022).
URN Code Value and Coding Scheme URL, which name coding concepts and schemes, are kept.
Every other URI and URL attribute that Table E.1-1 omits is removed by Type under every option, as are seven sequences that it omits whose content can identify an institution or other patients or say something about the patient, such as Requesting Service Code Sequence (0032,1034), Issuer of Patient ID Qualifiers Sequence (0010,0024), and Group of Patients Identification Sequence (0010,0027), and three measures of the patient's body, Patient's Body Mass Index (0010,1022), Measured AP Dimension (0010,1023), and Measured Lateral Dimension (0010,1024) (D-022).
Remaining, and undecided (D-022): whether the kept codes of local coding schemes, and in-house private creators, which can carry an institution's name or abbreviation, need a reviewed rule.
Also remaining: applying the actions to each data set (M3).
The Retain Institution Identity Option is not supported.
'''

[[requirement]]
id = "MIDI-BP-06"
text = '''
Use the release of PS3.15 current at the time of de-identification as the reference for which data elements to de-identify, augmented by knowledge of other unsafe attributes, including private ones. Categorise retained elements by the PS3.15 Options, and apply the approach to any DICOM object, whether or not its IOD is recognised.
'''
status = "partial"
milestone = "M4"
decisions = ["D-001", "D-010", "D-022", "D-023"]
implementation = [
  "_dev/deid_tables/annex_e.py",
  "_dev/deid_tables/edition_check.py",
  "_dev/deid_tables/generate.py",
  "_dev/deid_tables/ps3_4.py",
  "_dev/deid_tables/ps3_6.py",
  "_dicom/deidentify/actions.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/private_attributes.py",
  "_dicom/deidentify/scope.py",
  "_dicom/deidentify/sop_classes.py",
  "_dicom/deidentify/standard.py",
  "_dicom/deidentify/supplementary_actions.py",
]
note = '''
The rule tables and the PS3.6 data dictionary are generated from the pinned edition, PS3.4 Table B.5-1 tells an instance of a supported IOD from one of any other SOP Class, so that each instance is classified as de-identified or sequestered with the reason, and reviewed supplementary actions cover the person names, dates, and times that Table E.1-1 omits and every text attribute that it omits and a supported IOD uses.
Each such attribute that an option retains or cleans is categorised by that option, as Table E.1-1 does: operator-typed text is cleaned under Clean Descriptors, and accessory and equipment identifiers are kept under Retain Device Identity (D-022); the dates and times are kept under Retain Longitudinal Temporal Information with Full Dates and cleaned under Modified Dates (D-023).
Without Retain Safe Private, every private attribute is removed from a data set, at every level (D-028).
Every element, whether or not the pinned dictionary lists its attribute, has one rule, and every URI and URL attribute that the table omits has a reviewed one; no person name, date, time, datetime, or UID is left to the default for attributes that no rule covers, which keeps codes, tags, and numbers, keeps a sequence or a binary value only where the IOD defines it, and removes anything else (D-022).
`pymedphys dev deid-tables --check-current` reports when NEMA's current edition would change a generated table or cannot be read, and `.github/workflows/deid-edition-check.yml` runs it monthly.
Remaining: removing private attributes from, and applying each element's rule to, each instance the engine de-identifies (M3); and sequestering the instances so classified, and reporting them (M4).
Sequestering those objects rather than processing them is a deliberate restriction (D-010).
'''

[[requirement]]
id = "MIDI-BP-07"
text = '''
If any patient characteristic or other indirect identifier is retained, perform a collection-specific expert statistical analysis of residual risk, whether elements are kept by an allow-list or removed by a deny-list, and consider characteristics that can be derived from the pixel data.
'''
status = "planned"
milestone = "M4"
decisions = ["D-017"]
note = '''
`tps-import` retains patient characteristics for non-clinical databases, not for public sharing.
'''

[[requirement]]
id = "MIDI-BP-08"
text = '''
For non-DICOM images, apply the principles of PS3.15 E.1 where no better reference exists; for clinical data elements, apply the PhUSE De-Identification Standard for CDISC SDTM.
'''
status = "not-applicable"
note = '''
The engine processes DICOM only.
'''

[[requirement]]
id = "MIDI-BP-09"
text = '''
De-identify all data linked to the images by a common key, including accompanying spreadsheets and publications, and include them in the risk analysis, together with linked public data about the same subjects that the de-identifier knows of.
'''
status = "out-of-scope"
decisions = ["D-017"]
note = '''
Pseudonymising accompanying spreadsheets with the same key is later work.
The statistical assessment already accounts for earlier linked releases (D-017).
'''

[[requirement]]
id = "MIDI-BP-10"
text = '''
Assess, for every image type, the risk from burned-in text, objects bearing text, and other identifying features in the pixel data. Where the risk exceeds the threshold, scan and redact, with human review, or discard the image. Do not limit checks to a subset of image types chosen from other data elements.
'''
status = "partial"
milestone = "M4"
decisions = ["D-015", "D-017"]
implementation = ["_dicom/deidentify/pixel_risk.py"]
note = '''
Every instance's attributes are read for indicators of burned-in text, whatever its IOD: Burned In Annotation of YES, a secondary or converted image, and an overlay without Overlay Data, which may lie in the pixel data; an attribute that cannot be read is itself reported, and a received NO counts for nothing.
The pixel data are never inspected or changed (D-015).
Remaining: reporting the indicators, the QC pack, and pixel review before `public-release` (M4).
'''

[[requirement]]
id = "MIDI-BP-11"
text = '''
Remove or replace all unstructured text, whether in data elements, pixel data, or overlays, or, where it is needed for utility, scan it for identifiers and sensitive information, manually or automatically with human review.
'''
status = "partial"
milestone = "M4"
decisions = ["D-009", "D-017", "D-022", "D-027"]
implementation = [
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/reviewed_roi_names.py",
  "_dicom/deidentify/roi_names.py",
  "_dicom/deidentify/supplementary_actions.py",
]
note = '''
Under the Basic Profile, every text attribute that a supported IOD uses is removed or replaced, by Table E.1-1 or a reviewed supplementary rule, except coded and technical values and De-identification Method, which the engine adds to (D-022).
Under Clean Descriptors, a ROI name is written in the spelling of a TG-263 vocabulary only where it matches one of its names and echoes no known patient or other person identifier, and goes to review otherwise; a reviewer's decision to keep or map a name is applied only where what it would write echoes no such identifier (D-009).
The run's instance transform applies the actions to each data set, and descriptor cleaning holds for review a ROI name whose decision would echo an identifier.
Remaining: the review of descriptors with pooled human review, the residual search, and reporting indicators of burned-in text, since the engine does not change pixel data (M4).
'''

[[requirement]]
id = "MIDI-BP-12"
text = '''
Replace absolute dates and times while preserving relative temporal relationships across studies, within a useful tolerance, for short-term analyses such as dynamic contrast and nuclide decay and long-term ones such as therapy assessment.
'''
status = "partial"
milestone = "M3"
decisions = ["D-006", "D-007"]
implementation = [
  "_dicom/deidentify/dates.py",
  "_dicom/deidentify/profiles.py",
]
note = '''
Offsets are whole weeks, identical across a subject's studies and runs, so intervals and times are preserved exactly, and every date, time, and datetime attribute has a reviewed role that decides whether it moves with the subject.
Remaining: their modification in data sets (M3).
'''

[[requirement]]
id = "MIDI-BP-13"
text = '''
Retain private data elements only after evaluating their risk against a reliable source of elements known to be safe, such as PS3.15 E.3.10 or manufacturers' documentation; otherwise remove them selectively or entirely.
'''
status = "partial"
milestone = "M3"
decisions = ["D-001", "D-028"]
implementation = ["_dicom/deidentify/private_attributes.py"]
note = '''
Without Retain Safe Private, every private data element and private creator is removed from a data set, at every level, and a policy that selects the Option, which retains those known to be safe, is refused until reviewed rules say which are (D-028).
Remaining: removing them from each instance the engine de-identifies, and the reviewed rules that `public-release` needs (M3).
'''

[[requirement]]
id = "MIDI-BP-14"
text = '''
Consider identifying information embedded in compressed bitstreams, such as JPEG APP1 (EXIF) and APP11 (JUMBF) segments or ICC profiles. Either decompress losslessly compressed data and discard the embedded elements or, where the bitstream is kept, scan it and remove or replace the elements at risk.
'''
status = "partial"
milestone = "M3"
decisions = ["D-022"]
implementation = [
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/supplementary_actions.py",
]
note = '''
ICC Profile (0028,2000), an embedded file whose contents the engine does not parse, is removed by Type under every option, which removes it wherever the first supported release's IODs define it (D-022).
Remaining: removing metadata in compressed pixel data without recompression (M3).
'''

[[requirement]]
id = "MIDI-BP-15"
text = '''
Quantify the re-identification risk from potentially reconstructable facial information in head and neck cross-sectional images with a collection-specific expert statistical analysis. Above the threshold, remove or modify the facial features, or do not share the images publicly.
'''
status = "partial"
milestone = "M4"
decisions = ["D-015", "D-017"]
implementation = [
  "_dicom/deidentify/pixel_risk.py",
  "_dicom/deidentify/head_and_neck_regions.toml",
]
note = '''
Recognizable Visual Features of YES, an RT Structure Set's contours of an ROI whose interpreted type or name is EXTERNAL, BODY, or SKIN, the patient's outline, and every CT volume, whatever its slice spacing, are reported as indicators of a reconstructable face, and a volume that names a region of the head or neck as showing it.
Remaining: reporting them, and the `public-release` assessment and face review (M4).
'''

[[requirement]]
id = "MIDI-BP-16"
text = '''
Redact faces in photographic images so as to defeat recognition by people and software, with the residual risk quantified; above the threshold, do not share the images publicly.
'''
status = "out-of-scope"
decisions = ["D-010"]
note = '''
Photographic images are outside the supported objects and are sequestered (D-010).
'''

[[requirement]]
id = "MIDI-BP-17"
text = '''
Use human quality control to confirm that de-identification both removed what it should and preserved utility. Guide the proportion and type of records inspected by a documented risk assessment that sets the threshold of residual risk before and after quality control, taking account of what is removed or replaced and how reliably. Cover structured and unstructured text, pixel data, overlays, and metadata embedded in compressed bitstreams.
'''
status = "partial"
milestone = "M4"
decisions = ["D-016", "D-017", "D-026", "D-027"]
implementation = [
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/qc_attestation.py",
  "_dicom/deidentify/qc_pack.py",
  "_dicom/deidentify/qc_previews.py",
  "_dicom/deidentify/qc_retained.py",
  "_dicom/deidentify/qc_store.py",
  "_dicom/deidentify/run.py",
  "_dicom/deidentify/run_qc.py",
  "_dicom/deidentify/run_results.py",
]
note = '''
D-016 provides the confidential QC pack, to which the release gate sends the residual search's text findings inside the data set, and files whose collection for the search was incomplete for other text or for private values or values to which the pinned dictionary gives no VR (D-027), and D-017 sets the review coverage (every distinct retained string, every series, and every instance in high-risk categories) and the attestation.
The design does not yet say how quality control confirms that utility is preserved, or how the residual-risk threshold before and after it is recorded.
The QC pack is built and written: each instance by run position and source path, with its output path or opaque label (D-026); each residual with a contextual excerpt, and each drop and form not searched, by instance and place (D-027); each distinct retained string with its places (D-017); and what descriptor cleaning wrote for each ROI Name, or why it held it for review (D-009).
It is written only to a designated, owner-only location outside the source, release, and staging directories, and is marked so that no release includes it (D-016).
A reviewer attests to a pack once, stating whether they reviewed every distinct retained string, every series, and every instance in high-risk categories, and an outcome of attested needs all three; the attestation is bound to the pack by its digest, and gives the release report only the pack's opaque reference and the outcome (D-016, D-017).
Each run writes its pack before it publishes the release, to a QC destination that the caller must name and that is checked before anything is created; a pack that cannot be written publishes nothing, and the pack of a release that cannot be published is removed, or named if it cannot be.
The run's instance transform and release gate adapter give it this material.
The pack lists every input from its outcome, each sequestered one by the random label that the run gives it, and the transform's and gate's material by run position: each residual search with its excerpts, each source value they left out of the search with its reason, what descriptor cleaning wrote for each ROI Name, and each retained string with its places.
The retained strings of an instance are the values that its plan keeps as they are, in elements with a text VR other than UI, outside any removed sequence, and other than Specific Character Set, and a value that was not read for review, or could not be decoded, is refused rather than left out, and the run's transform sequesters an instance with such a value.
The pack previews each series released or held for review, by a cine strip and, for a volume, a frontal maximum intensity projection, and each instance whose source shows an indicator of risk in its pixel data at full resolution, with those indicators; it lists each instance it could not preview, with why, and records each preview's SHA-256, so that an attestation covers the previews too (D-017).
Remaining: the attestation's record in the release report (M4).
This practice is not implemented until M4 also covers both open points, or the design assigns them to whoever releases the data.
'''

[[requirement]]
id = "MIDI-BP-18"
text = '''
Document the de-identification process in detail, including the release of PS3.15 and the Options used, and publish the documentation, or a reference to it, with the collection.
'''
status = "partial"
milestone = "M4"
decisions = ["D-009", "D-011", "D-012", "D-016", "D-024", "D-026", "D-027", "D-029"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_values.py",
  "_dicom/deidentify/markers.py",
  "_dicom/deidentify/method_digest.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/release_report_markdown.py",
  "_dicom/deidentify/run_report.py",
  "_dicom/deidentify/runtime.py",
]
note = '''
Each instance's markers record the process in the instance itself: De-identification Method names PyMedPhys, its version, the PS3.15 edition, and the preset, and gives the method digest; the CID 7050 codes name the profile and each Option the instance satisfies; and a Contributing Equipment Sequence item names PyMedPhys as the de-identifying equipment, and gives in Software Versions its version and the runtime environment that ran, which the method digest does not cover (D-012, D-024).
The validated policy records the edition, preset, and options.
The conformance statement generated from a policy names the PyMedPhys version, the PS3.15 edition, the preset, its Options with their CID 7050 codes, and its method digest with the vocabulary it covers and without a reviewed-names list, and the markers that each instance gains, and the same policy and engine always give the same text.
The release report's record of the policy (its edition, preset, and options), of the method digest with the components it is computed from (D-024), and of the runtime environment that ran, with the values that Software Versions records (D-029), is built and written as JSON, and refuses any field that could hold a source value or a path outside the engine's package (D-016).
Its sections on a run give the QC pack's opaque reference with its attestation's outcome (D-016), list each released instance by its output name, name each sequestered instance by a random label for the run, with each reason's stage and code, and the attribute, action, and VR where the walker sequestered it, or the attribute where the release gate's reason names one (D-026); count the instances held for review by stage and reason, naming none (D-009); count the ROI Names that descriptor cleaning cleaned by outcome, and the distinct names sent for review by reason, naming none (D-009); count the instances with each kind of reference finding that the run reports without acting on it, naming none (D-026); and count the source values that the residual search did not search, in full or in part, by attribute and reason (D-027); the conformance statement describes them, generated from the report's format, labels, and reason codes.
A run given a reporter writes the report as `release-report.json` at the root of the release before it publishes it, with its QC pack by reference, not yet attested, its released instances by output name, its sequestered instances by label, its held instances by reason, an identical copy counting as the instance it copies, and the values that the residual searches did not search, each counted once at the instance that holds it, and a report that cannot be built publishes nothing and leaves no QC pack; an input whose reasons the report cannot give is sequestered for an invalid reason instead, which the report gives alone and the QC pack lists before its own reasons, so that it never stops the release.
Beside the report, the run writes its human-readable form as `release-report.md`: CommonMark, with GitHub Flavored Markdown tables, generated from the JSON text alone, which shows every value of the document, and each file name that keys a digest, as a code span as often as the document holds it, and draws nothing else from the report; the same text always gives the same form, and a report whose form cannot be generated publishes nothing.
Every reason that sequesters or holds an instance in a run, from the run's own checks, the transform, the writer, the preservation check, and the release gate, has a stage and code in the report, and the codes within each stage are distinct.
Each run given a release reporter publishes the conformance statement of its policy with its release, beside the release report.
Remaining: its residual search findings and writing it in every run (M4).
'''

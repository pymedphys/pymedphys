  "_dicom/deidentify/policy.py",
]
note = '''
The attributes that the Option gives K are kept, and the eleven AE titles that it gives C are each replaced by a keyed token, the same for the same application entity throughout a run (D-034).
A removed AE title or private value found in a text attribute that the Option keeps, such as an AE title equal to the Station Name, does not send the file to review (D-042).
`tps-import` also selects Modified Dates, which conflicts with this Option for device dates, so its output claims neither (D-007).
'''

[[requirement]]
id = "PS3.15-E.3.9-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.9.html#para_d44e046d-c417-4283-9556-695a778ca4f5"
text = '''
When this Option is specified in addition to an Application Level Confidentiality Profile, UIDs shall be retained, as described in Table E.1-1.
'''
status = "implemented"
decisions = ["D-003", "D-040"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/retained_uids.py",
  "_dicom/deidentify/written_references.py",
]
note = '''
The 55 UIDs that Table E.1-1 gives K under the Option are kept wherever they occur, and its five reference sequences are kept as containers whose items' elements take their own rules; every other UID is replaced with the run's key, including those the table omits, such as Multi-frame Source SOP Instance UID (D-040).
Media Storage SOP Instance UID is the kept SOP Instance UID, output files are named by the kept UIDs' keyed replacements, the reference graph's second pass expects the kept UIDs, and the residual search leaves a kept UID out where its enclosing sequence is removed.
No preset selects the Option.
'''

[[requirement]]
id = "PS3.15-E.3.10-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_bb1aaf5b-ab3d-4b05-8226-c7282cf98dc9"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, Private Attributes that are known by the de-identifier to be safe from identity leakage shall be retained, together with the Private Creator IDs that are required to fully define the retained Private Attributes; all other Private Attributes shall be removed or processed in the element-specific manner recommended by Deidentification Action (0008,0307), if present within Private Data Element Characteristics Sequence (0008,0300) (see PS3.3 Section C.12.1).
'''
status = "implemented"
decisions = ["D-001", "D-028", "D-035"]
implementation = [
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/retained_private.py",
  "_dicom/deidentify/reviewed_descriptors.py",
  "_dicom/deidentify/safe_private.py",
  "_dicom/deidentify/tcia_private_tags.py",
  "_dicom/deidentify/walker.py",
]
note = '''
Reviewed rules give every row of Table E.3.10-1 a handling, keyed by private creator and element within the block: numbers and code strings are checked and kept, UIDs replaced, text cleaned as descriptors under Clean Descriptors and otherwise removed, private sequences parsed, and bulk binary data and three timestamps removed (D-035).
Under the Option, the engine settles each private attribute by its rule, at the top level and in the items of every sequence that is kept, matching creators only in printable ISO 646 and checking each kept value against its VR and VM; it keeps a private creator only where its block keeps something, and removes every other private attribute, which E.3.10 allows in place of following Deidentification Action (0008,0307) (D-035).
Under Clean Descriptors too, text that a rule retains, written with its VR and within its VM, is cleaned by the reviewed descriptors list's decisions on its private creator, group, element within the block, and VR, and removed where they do not clean it, where it cannot be decoded, or where it is written without its VR (D-009, D-035).
An attribute that the instance's Private Data Element Characteristics Sequence (0008,0300) declares safe, in a block whose Block Identifying Information Status is SAFE or in Nonidentifying Private Elements, and that no rule lists, takes the handling of its VR, as written or as the sequence defines it; one that the sequence declares may identify is removed, even where a rule would keep it (D-035).
TCIA's Private Tag Dictionary ships unchanged, pinned by its length and SHA-256 and compared with TCIA's file by a monthly edition check, as a second list that a run may choose in place of the reviewed rules; its keep is a basis for retention, its rules are chosen by the VR that reads each value, and kept values still pass the handling of their VR, with a single value unless a reviewed rule gives the VM; the method digest, the release report, and the conformance statement record which list a run used (D-024, D-035).
'''

[[requirement]]
id = "PS3.15-E.3.10-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_0c838fa8-6930-4559-a492-67c204358848"
text = '''
When this Option is not specified, all Private Attributes shall be removed, as described in Table E.1-1.
'''
status = "implemented"
decisions = ["D-028"]
implementation = [
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/file_layout.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/sequences.py",
  "_dicom/deidentify/source.py",
  "_dicom/deidentify/walker.py",
]
note = '''
Every element of an odd group, including private creators and the elements that PS3.5 does not allow, has a rule that removes it, at the top level and in the items of every standard sequence, including one written as UN or without a VR, whose items are read where the pinned data dictionary gives its attribute VR SQ, and a private sequence is removed with everything in it.
A source file in which such a value does not hold only items is refused, wherever the value is, and a kept standard sequence written with a VR that the dictionary does not give it, such as OB, sequesters its instance (D-028).
A policy that gives Private Attributes another action than X without the Retain Safe Private Option is refused.
The run's instance transform removes them from each instance it writes.
'''

[[requirement]]
id = "PS3.15-E.3.10-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_d9eb6fdb-b5c9-44d8-91f9-e0fe71983689"
text = '''
When an entire Sequence (SQ VR) Private Attribute is not known to always only contain safe content, whether that content consists of Standard Attributes or Private Attributes or a combination of both, then when the Retain Safe Private Option is used, any such Sequence Attribute shall be parsed in its entirety and each of the nested Attributes handled on its own merits, rather than removing the Sequence in its entirety without further consideration. Reviewing the content may be a sensible practice to apply even to nominally known safe Private Sequence Attributes.
'''
status = "implemented"
decisions = ["D-028", "D-035"]
implementation = [
  "_dicom/deidentify/retained_private.py",
  "_dicom/deidentify/walker.py",
]
note = '''
Under the Option, every private sequence in a block whose private creator is compared is parsed, whether or not a reviewed rule lists it, and each attribute in its items, standard or private, takes its own rule, at every depth (D-035).
A private sequence that no rule lists is kept, with its creator, only where an attribute in its items other than a private creator is kept, replaced, or cleaned, and is otherwise removed with everything in it; a kept creator is among the retained strings that the QC pack lists for review (D-017, D-035).
Without the Option, every private sequence is removed with everything in it (D-028).
'''

[[requirement]]
id = "PS3.15-E.3.10-04"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_74598302-fb52-4831-9a57-fa49e4698746"
text = '''
The safe Private Attributes that are retained shall be described in the Conformance Statement.
'''
status = "implemented"
decisions = ["D-035"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_safe_private.py",
]
note = '''
Under the Option, the conformance statement describes how the reviewed rules are matched and how each handling settles an attribute, and lists every rule that can retain one, with its private creator, tag, VR, VM, and handling, and the meaning that Table E.3.10-1 gives it or the source of a reviewed addition; the rules for text are among them only under Clean Descriptors, which cleans private text (D-035).
'''

[[requirement]]
id = "PS3.15-E.3.11-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.11.html#para_00ca9c5a-ce04-4906-ae1f-920d2e0c2c40"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, information about the identity of the institution in the Attributes shall be retained, as described in Table E.1-1.
'''
status = "implemented"

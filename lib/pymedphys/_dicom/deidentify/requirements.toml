# MIDI Task Group report, section 1.6, summarised in PyMedPhys's words.

[[requirement]]
id = "MIDI-BP-01"
text = '''
For public sharing, remove or replace all known direct identifiers and relevant indirect identifiers and sensitive information wherever they occur: collection descriptions, supporting data, structured and unstructured text, pixel data, and overlays. Justify retaining any indirect identifier with a collection-specific expert statistical analysis of residual risk against a predetermined threshold, which considers other public information about the subjects and holds only at the time it was done.
'''
status = "implemented"
decisions = ["D-001", "D-015", "D-016", "D-017", "D-022", "D-023", "D-027", "D-032", "D-042", "D-053"]
implementation = [
  "_dicom/deidentify/file_layout.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/option_kept.py",
  "_dicom/deidentify/readiness.py",
  "_dicom/deidentify/release_gate.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/residual_exemptions.py",
  "_dicom/deidentify/residuals.py",
  "_dicom/deidentify/risk_assessment.py",
  "_dicom/deidentify/run_report.py",
]
note = '''
The Basic Profile's actions remove or replace identifiers, and reviewed rules act on the text attributes, dates, and times that Table E.1-1 omits (D-022, D-023).
Every byte of a written file, from the preamble to any bytes after its last readable element, can be searched for the source values that had to be removed or replaced, and each one found is reported by its source attribute and its place in the file, never by its value.
A source value, or a form of one, equal to a constant that the engine writes is not searched, and is recorded by its source attribute (D-027).
The release gate runs that search itself, for exactly the values collected across the file's subject, and checks the collection against the values the walker planned to collect.
It withholds any output file that still holds a source person name, UID, date, datetime, or direct identifier, or a source value outside its data set, or whose collection of person names, UIDs, dates, datetimes, direct identifiers, or sequences was incomplete, and sends other text findings and other incomplete collection, including of private values, to confidential review; a search that finds nothing does not on its own release a file (D-027).
A text finding is not sent to review where it is in a kept CS value made only of its attribute's terms in the pinned PS3.3 (for Body Part Examined, PS3.16 Annex L), in a code item of a scheme that PS3.16 Table 8-1 lists, or in Manufacturer, Manufacturer's Model Name, or Software Versions with a private or equipment source, or where its source is a private creator that PS3.15 Table E.3.10-1 lists, and the QC pack still lists it (D-032).
Nor is a finding inside a value that a selected option keeps, where its source is a private data element or an attribute of that option, or where it equals a whole kept date or time, and in that case a date finding does not withhold the file either (D-042).
The release report counts the released instances with each finding that these exemptions keep from review, by exemption, source attribute, and the attribute it was found in, naming no value (D-032).
An external statistical assessment of a run's collection is recorded beside its QC pack, bound to the pack, to the source files it records, to the policy, and to the reviewed lists and region rules that the run applied, by the salted digest that the run records in its pack, and the statistical gate passes only for the same files, policy, lists, and rules, the run's number of distinct subjects, and a maximum per-subject re-identification probability within the threshold of 0.09 or 0.05 that the assessment states (D-017, D-053).
A deterministic synthetic collection, with an instance of each IOD of the first supported release, plants a conspicuous marker wherever its IODs define an attribute of Table E.1-1, down to a nesting depth of 4 items, and records each deeper place as not planted; Responsible Person and Responsible Organization, whose removal sequesters an instance (D-020), are planted in one instance only, so the others can be released, and the Enhanced PET Image's Radiopharmaceutical Start DateTime, whose removal sequesters it, the RT Beams Treatment Record's Institution Code Sequence in the item of an interlock's resolution user, whose dummy value has no reviewed rule (D-021), in none; the dose reports are VERIFIED, and their Verifying Observer Sequence, which a reviewed rule keeps with dummy values (D-021), and Requested Procedure ID in their Referenced Request Sequence, which a plain X empties there (D-020), are planted in each report; each dose report's content tree is built by its template, with a marker in the value of each content item that can identify a person, a device, or a time.
The run's instance transform removes and replaces identifiers in each data set and gives the gate its coverage, including each value read as ISO 8859-1, and the run acts on the gate's decision.
An instance out of scope whose IOD the pinned tables define is read only to collect its values for its subject's search, and is never written; an instance whose values could not be collected at all withholds every file of its subject.
The Basic Profile removes Patient's Weight but keeps PET values scaled to an SUV and mappings of values to one, which, with the Radionuclide Total Dose it also keeps, may disclose the weight, depending on the SUV normalisation, activity calibration, and compatible dose timing; each instance with either is reported as an indicator of a possibly disclosed body weight, in the QC pack and as counts in the release report (D-015).
An end-to-end test runs `basic` and `basic-clean-descriptors` over that collection and searches every published file for its markers, independently of the gate.
A `public-release` run's release report says whether it is ready for release, which it is only where the statistical gate, the pixel and face review gate, and the attestation gate all pass, each decided from the run's own QC pack against an earlier run's attested pack of the same files and policy, and each failing on its own with a reason code (D-017).
The pixel and face review gate needs every released instance at high risk to have been reviewed as one, and every released instance that can show a face to have a verdict that it shows none, on the pixel data and contours that the run writes, or a passing assessment that covers facial reconstruction; the attestation gate needs the releaser's acceptance of the residual risk, and every released instance and every string that it retains to have been in the reviewed pack (D-017).
Collection descriptions and supporting data outside the DICOM files are not written by the engine, and whoever releases the data reviews them.
Pixel data are assessed for risk, not cleaned (D-015).
'''

[[requirement]]
id = "MIDI-BP-02"
text = '''
Define re-use utility for the widest range of conceivable uses, including those beyond the releasing entity's own, and quantify utility where possible when assessing residual risk.
'''
status = "not-applicable"
note = '''
A decision for whoever releases the data.
The engine's Options and presets are the means it offers.
'''

[[requirement]]
id = "MIDI-BP-03"
text = '''
Do not let de-identification compromise conformance with the standards that define the content or reduce functionality. DICOM output should still conform to its original IOD, with dummy values synthesised where needed and replacement values consistent across files within a defined scope, such as replaced UIDs that keep references intact. This covers optional attributes critical to functionality as well as required ones.
'''
status = "implemented"
decisions = ["D-001", "D-003", "D-005", "D-008", "D-011", "D-020", "D-021", "D-022", "D-026", "D-031"]
implementation = [
  "_dicom/deidentify/birth_dates.py",
  "_dicom/deidentify/common_instance_reference.py",
  "_dicom/deidentify/compound_actions.py",
  "_dicom/deidentify/dummy_values.py",
  "_dicom/deidentify/edits.py",
  "_dicom/deidentify/elements.py",
  "_dicom/deidentify/file_layout.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/iod_conformance.py",
  "_dicom/deidentify/iods.py",
  "_dicom/deidentify/preserving_writer.py",
  "_dicom/deidentify/profiles.py",
  "_dicom/deidentify/qc_pack.py",
  "_dicom/deidentify/reference_graph.py",
  "_dicom/deidentify/references.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/run.py",
  "_dicom/deidentify/run_qc.py",
  "_dicom/deidentify/run_report.py",
  "_dicom/deidentify/run_results.py",
  "_dicom/deidentify/run_written.py",
  "_dicom/deidentify/sequences.py",
  "_dicom/deidentify/sop_classes.py",
  "_dicom/deidentify/values.py",
  "_dicom/deidentify/walker.py",
  "_dicom/deidentify/written_references.py",
]
note = '''
The Type of each attribute of the first supported release's IODs, and of every other composite IOD but the three real-time ones, in each module and sequence, including within each of an IOD's Functional Group Macros, is generated from PS3.3, so the engine can tell where an IOD requires a value; PS3.4 Table B.5-1 gives the IOD of an instance from its SOP Class UID; and a value can be checked against its VR and VM before it is written.
Compound actions resolve from the strictest of these Types, so in those IODs they never remove an attribute where it is Type 1, 1C, 2, or 2C, or empty one where it is Type 1 or 1C, and a plain Z on a Type 1 or 1C attribute gives D's dummy value too.
A plain X on an attribute that the IOD requires at its place removes with it the innermost enclosing sequence that the IOD makes Type 3 at its own place, or sequesters the instance where none encloses it, so it never leaves the output without an attribute that the IOD requires; Overlay Data takes its whole repeating group, whose module is user-optional in the CT Image, MR Image, and Positron Emission Tomography Image IODs, and ROI Interpreter Sequence, whose condition lapses once ROI Creator Sequence is removed, goes alone, as does Clinical Trial Protocol Ethics Committee Name, whose condition lapses once its approval number is removed and which PS3.5 Section 7.4.2 then does not allow (D-020). Requested Procedure ID, Type 2 in a Structured Report's Referenced Request Sequence, is emptied there rather than removed, so the report keeps it (D-020).
Every dummy value is valid for its VR and for the VM of each attribute of Table E.1-1 that can take it, as is each element of the dummy item of Person Identification Code Sequence, and an attribute whose VR has no generic dummy value and no reviewed rule is refused rather than given an invalid value.
Under `tps-import`, which planning systems import, Patient's Birth Date takes each subject's synthetic birth date rather than an empty value: the earliest study with a consistent Study Date and Patient's Age in years gives it, the subject profile keeps it for every instance and later run, an empty value is written and kept where the ages are missing or inconsistent, and a later run that contradicts the reference study stops the subject for review (D-008).
Before anything is written, a first pass over a collection follows the reference attributes that PS3.3 defines inside a sequence of each instance's IOD, and reports each reference that names no instance, series, or study in the collection, and each instance without its SOP Instance, Series Instance, or Study Instance UID.
It also reports instances that share a SOP Instance UID, as identical copies only where their source bytes, the transfer syntax and the data set as the file encodes it, are shown to be the same, and as conflicting copies otherwise; a series whose instances name several studies; and a study whose instances name several patients, each a Patient ID with its issuer, with the instances without a Patient ID as one more.
It reports each frame of reference mismatch too: a series whose instances name several Frame of Reference UIDs, an RT Structure Set ROI whose frame of reference the structure set does not list once and only once, and an image that a structure set lists under a frame of reference other than the image's own.
An element to be written is built with a VR that the pinned dictionary gives it, of alternatives the one that applies in its data set, only once its values have been checked against that VR and the attribute's VM, against the data set's character set, and, for a person name, against the repertoire of its first component group, and it reads back unchanged from Implicit and Explicit VR Little Endian.
A data set is written from its source's bytes, so a kept element keeps the VR its source gives it, such as SS for the VOI LUT Descriptor of a CT image in Hounsfield Units, where pydicom's writer can resolve it again as US.
A sequence kept as UN keeps its items in implicit VR, and a replacement in implicit VR is written only where the pinned dictionary gives its VR alone, since a reader takes the VR from its dictionary.
A run acts on those findings before it writes anything: a study with several patients stops it, every conflicting copy, every instance of a series in several studies, and every instance without one of those UIDs is sequestered, an identical duplicate is written once, and a dangling reference or a frame of reference mismatch is only reported.
The release report counts the instances with each kind of finding that the run reports only, and the QC pack lists each such finding at each instance it names, with the attribute's tags and its count.
A second pass checks what was written against the first: that each written instance's SOP Instance, Series Instance, and Study Instance UIDs, and each value at its reference sites, are the keyed replacements of its input's, never a source UID; that each reference that named an input before writing names a written instance, series, or study after it; that no two source UIDs share a replacement; and that no two written instances share a SOP Instance UID.
A run makes that check of every file that its gate releases, before anything is published: each instance that a finding names is sequestered, and what is left is checked again, a reference to an instance that was withheld being reported only, while a check that fails, or a finding that no sequestration can isolate, publishes nothing.
Each written instance is checked against its IOD before it can be released: every attribute that its source holds where the IOD requires it, by the same strictest Type, must still be there where the item that held it is, and a Type 1 or 1C one must not have been emptied, or the instance is sequestered, since the engine caused it; the removals that a plain X allows on their own are not findings, and what the source already lacks is not acted on.
Instead, each attribute that the IOD unconditionally requires, a Type 1 or 2 attribute of a mandatory module at the top level or of an item that the source holds, and that the source lacks, is reported: the release report counts the instances by attribute and Type, and the QC pack lists each by instance and place.
The Common Instance Reference Module's Type 1C sequences, Referenced Series Sequence and Studies Containing Other Referenced Instances Sequence, are removed with their items where the instance keeps no other reference to an instance, since their conditions then do not hold, and the check against the IOD allows their removal only where the output holds no such reference (D-022).
A gap is never filled with a made-up value, so a released instance fails a MIDI-B check that an attribute its IOD requires is present, or has a value, only where its source lacks it (D-031).
A kept value keeps its bytes, so a released instance fails a MIDI-B check that a kept value is unchanged only where its source fails it too, as where Smallest Image Pixel Value is written as US although Pixel Representation makes it SS (D-031).
The walker gives D's dummy value wherever a compound action, or a plain Z, resolves to it on a Type 1 or 1C attribute, and the run's instance transform writes it, so a written instance keeps a valid value wherever its IOD requires one (D-020, D-021).
Independently of the engine, dciodvfy, dcentvfy, and dicom-validator check each instance that a run over the synthetic corpus releases, and its input, under each preset in continuous integration, and every finding that an output introduces must be explained by a reviewed known difference (D-030).
'''

[[requirement]]
id = "MIDI-BP-04"
text = '''
Preserve as much information about image acquisition as possible, including machine identity, characteristics, and settings, unless it is shown to raise residual risk above the predetermined threshold.
'''
status = "partial"
milestone = "M4"
decisions = ["D-007", "D-017", "D-022", "D-034", "D-036", "D-042", "D-053"]
implementation = [
  "_dicom/deidentify/ae_titles.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/option_kept.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/readiness.py",
  "_dicom/deidentify/risk_assessment.py",
  "_dicom/deidentify/technique_descriptors.py",
]
note = '''
Under every option, an attribute that no rule covers is kept where its VR is CS, AT, or numeric, so acquisition settings and characteristics, such as KVP, Image Type, and Acquisition Number, are kept as read (design Architecture).
Under Clean Descriptors, a technique descriptor such as Protocol Name or Series Description is kept where every word of it is in the reviewed technique vocabulary and it echoes no identifier (D-036).
The Retain Device Identity Option keeps machine identity, such as Station Name and Device Serial Number, as Table E.1-1 gives it, replacing each AE title by a keyed token (D-034), and a removed AE title or private value found in a text attribute that the Option keeps, such as an AE title equal to the Station Name, does not send the file to review (D-042).
`tps-import` retains device identity, and modifies the device dates and times that the Option would keep by their role under Modified Dates (D-007).
`public-release` omits it whatever an assessment of the collection finds, as the maintainer decided on 24 October 2026, because device serial numbers and machine names can identify an institution and, with dates, individual treatments (D-017).
A `public-release` run is ready for release only where its statistical gate passes with a recorded external assessment of the collection, and the record cannot be made without a statement of whether keeping machine identity, such as Station Name and Device Serial Number, would raise the risk above the threshold (D-017, D-053); the engine records that statement and does not interpret it, so whoever reviews the record sees whether the omission was needed.
Remaining: a policy that keeps machine identity in a public release, released only where an assessment of its own output, with machine identity among the matching variables, finds the risk within the threshold, which `public-release` deliberately is not (D-017) (M4).
'''

[[requirement]]
id = "MIDI-BP-05"
text = '''
Remove or replace the identities of other persons, departments, institutions, and organisations, except where they are needed for utility and a residual risk assessment supports keeping them.
'''
status = "implemented"
decisions = ["D-001", "D-016", "D-017", "D-022", "D-053"]
implementation = [
  "_dicom/deidentify/conformance_markdown.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/readiness.py",
  "_dicom/deidentify/risk_assessment.py",
  "_dicom/deidentify/supplementary_actions.py",
]
note = '''
Every person name in the pinned dictionary has an action that removes or replaces it under the Basic Profile, from Table E.1-1 or from a reviewed supplementary action.
Every text attribute that a supported IOD uses is removed or replaced too, other than coded and technical values and De-identification Method, which the engine adds to; the names and identifiers of people, organisations, records, and networks, and identifiers that a device reads, among those that Table E.1-1 omits are removed under every option, and accessory and equipment identifiers are kept only under Retain Device Identity (D-022).
URN Code Value and Coding Scheme URL, which name coding concepts and schemes, are kept.
Every other URI and URL attribute that Table E.1-1 omits is removed by Type under every option, as are seven sequences that it omits whose content can identify an institution or other patients or say something about the patient, such as Requesting Service Code Sequence (0032,1034), Issuer of Patient ID Qualifiers Sequence (0010,0024), and Group of Patients Identification Sequence (0010,0027), and three measures of the patient's body, Patient's Body Mass Index (0010,1022), Measured AP Dimension (0010,1023), and Measured Lateral Dimension (0010,1024) (D-022).
Private Data Element Characteristics Sequence (0008,0300) is removed by Type under every option: without Retain Safe Private no private attribute is kept, so the private creators of removed private blocks do not survive in its items (D-028), and under the Option it is read to find the private attributes that the instance declares safe, and then removed, since its descriptions and the creators of blocks that are not kept can name the institution's software (D-035).
The conformance statement says that the kept codes of local coding schemes can carry an institution's name or abbreviation, a local scheme's Coding Scheme URL its host, and an in-house device's Manufacturer its name, and that each kept value is listed among the QC pack's retained strings.
It also says that the engine does not itself assess the residual risk of these values; that `public-release` has a person review each of them, and is ready for release only where an external risk assessment of the collection states how the institutional identity that the policy keeps was assessed and whether the assessment supports keeping it; and that for the first release the design assigns to whoever releases the data the confirmation that the output's residual risk, these values included, is acceptable, which the QC pack's attestation records when they give it (D-016).
The maintainer decided on 6 October 2026 that the kept codes of local coding schemes need no further rule beyond that disclosure (D-022).
Manufacturer, Manufacturer's Model Name, and Software Versions are kept because they identify products, not devices; an in-house device can carry the hospital as its Manufacturer, a residual risk that D-022 accepts because the value names an institution, not a patient.
The run's instance transform applies these actions to each instance it de-identifies.
As for MIDI-BP-01, an end-to-end test of `basic` and `basic-clean-descriptors` over the synthetic collection, which plants markers in the names of other persons, institutions, departments, and stations, finds none of them in the published files; the removals of D-022's other attributes, such as Requesting Service Code Sequence, rest on the tests of the element and supplementary rules.
A `public-release` run, which keeps that institutional identity in an in-house device's Manufacturer and in the codes and Coding Scheme URLs of local coding schemes, is ready for release only where its statistical gate passes with the record of an external assessment of the collection, which cannot be made without the assessor's statement of how the residual risk of the institutional identity that the policy keeps was assessed and whether the assessment supports keeping it (D-053); where its attested QC pack lists each string that the run retains in a released instance, so that the reviewer reviewed it; and where the releaser confirmed in the attestation that the output's residual risk is acceptable (MIDI-BP-17); otherwise a gate fails (D-017).
The engine records the assessor's statement without interpreting it, as it records every statement of the assessment, so whoever reviews the record reads whether the assessment supports keeping these values; the maintainer decided on 26 October 2026 that this, rather than a gate on the statement's answer, meets the practice for `public-release` (D-017).
The other presets keep these values without review or assessment, as their conformance statements say, and their output is not thereby ready to share (D-017).
Retain Institution Identity, which no preset selects, keeps the institution's own attributes as Table E.1-1 gives them (D-044).
'''

[[requirement]]
id = "MIDI-BP-06"
text = '''
Use the release of PS3.15 current at the time of de-identification as the reference for which data elements to de-identify, augmented by knowledge of other unsafe attributes, including private ones. Categorise retained elements by the PS3.15 Options, and apply the approach to any DICOM object, whether or not its IOD is recognised.
'''
status = "implemented"
decisions = ["D-001", "D-010", "D-022", "D-023"]
implementation = [
  "_dev/deid_tables/annex_e.py",
  "_dev/deid_tables/edition_check.py",
  "_dev/deid_tables/generate.py",
  "_dev/deid_tables/ps3_4.py",
  "_dev/deid_tables/ps3_6.py",
  "_dicom/deidentify/actions.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/release_report_markdown.py",
  "_dicom/deidentify/run.py",
  "_dicom/deidentify/scope.py",
  "_dicom/deidentify/sop_classes.py",
  "_dicom/deidentify/standard.py",
  "_dicom/deidentify/supplementary_actions.py",
]
note = '''
The rule tables and the PS3.6 data dictionary are generated from the pinned edition, PS3.4 Table B.5-1 tells an instance of a supported IOD from one of any other SOP Class, so that each instance is classified as de-identified or sequestered with the reason, and reviewed supplementary actions cover the person names, dates, and times that Table E.1-1 omits and every text attribute that it omits and a supported IOD uses.
Each such attribute that an option retains or cleans is categorised by that option, as Table E.1-1 does: operator-typed text is cleaned under Clean Descriptors, and accessory and equipment identifiers are kept under Retain Device Identity (D-022); the dates and times are kept under Retain Longitudinal Temporal Information with Full Dates and cleaned under Modified Dates (D-023).
Without Retain Safe Private, every private attribute is removed from a data set, at every level (D-028).
Every element, whether or not the pinned dictionary lists its attribute, has one rule, and every URI and URL attribute that the table omits has a reviewed one; no person name, date, time, datetime, or UID is left to the default for attributes that no rule covers, which keeps codes, tags, and numbers, keeps a sequence or a binary value only where the IOD defines it, and removes anything else (D-022).
`pymedphys dev deid-tables --check-current` reports when NEMA's current edition would change a generated table or cannot be read, and `.github/workflows/deid-edition-check.yml` runs it monthly.
The run's instance transform removes private attributes from, and applies each element's rule to, each instance it de-identifies, and the run sequesters the instances so classified and lists them in the release report with their reasons.
An object of any other SOP Class is handled by classifying and sequestering it, not by de-identifying it.
The release report names the IOD of each instance of an unsupported IOD, as PS3.4 Table B.5-1 names it, never from a value of the instance (D-010).
Sequestering those objects rather than processing them is a deliberate restriction (D-010).
'''

[[requirement]]
id = "MIDI-BP-07"
text = '''
If any patient characteristic or other indirect identifier is retained, perform a collection-specific expert statistical analysis of residual risk, whether elements are kept by an allow-list or removed by a deny-list, and consider characteristics that can be derived from the pixel data.
'''
status = "implemented"
decisions = ["D-017", "D-053"]
implementation = [
  "_dicom/deidentify/readiness.py",
  "_dicom/deidentify/risk_assessment.py",
]
note = '''
`tps-import` retains patient characteristics for non-clinical databases, not for public sharing, and `public-release` does not select Retain Patient Characteristics (D-038).
`public-release` keeps other indirect identifiers, such as modified dates, coded values, and characteristics that can be derived from the pixel data.
The record of an external statistical assessment of a collection lists its matching variables and how characteristics derivable from the pixel data were considered, with every other statement that D-017 requires, each required, and the statistical gate checks it against the run, counting distinct subjects rather than images, frames, or visits (D-053).
A `public-release` run is ready for release only where that gate passes for the distinct subjects of the instances that it releases and the reviewed lists and region rules that it applied; a run without a record fails it (D-017).
'''

[[requirement]]
id = "MIDI-BP-08"
text = '''
For non-DICOM images, apply the principles of PS3.15 E.1 where no better reference exists; for clinical data elements, apply the PhUSE De-Identification Standard for CDISC SDTM.
'''
status = "not-applicable"
note = '''
The engine processes DICOM only.
'''

[[requirement]]
id = "MIDI-BP-09"
text = '''
De-identify all data linked to the images by a common key, including accompanying spreadsheets and publications, and include them in the risk analysis, together with linked public data about the same subjects that the de-identifier knows of.
'''
status = "out-of-scope"
decisions = ["D-017"]
note = '''
Pseudonymising accompanying spreadsheets with the same key is later work.
The statistical assessment already accounts for earlier linked releases (D-017).
'''

[[requirement]]
id = "MIDI-BP-10"
text = '''
Assess, for every image type, the risk from burned-in text, objects bearing text, and other identifying features in the pixel data. Where the risk exceeds the threshold, scan and redact, with human review, or discard the image. Do not limit checks to a subset of image types chosen from other data elements.
'''
status = "implemented"
decisions = ["D-015", "D-017"]
implementation = [
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/pixel_risk.py",
  "_dicom/deidentify/qc_pack.py",
  "_dicom/deidentify/readiness.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/run_qc.py",
  "_dicom/deidentify/run_report.py",
]
note = '''
Every instance's attributes are read for indicators of burned-in text, whatever its IOD: Burned In Annotation of YES, a secondary or converted image, and an overlay without Overlay Data, which may lie in the pixel data; an attribute that cannot be read is itself reported, and a received NO counts for nothing.
The indicators are read from attributes, never from the pixel data (D-015), which only the Clean Pixel Data Option changes (D-037).
Each run gives the indicators of each source it can decode to the confidential QC pack, which lists the instances at high risk and previews those released or held.
The release report counts the released and held instances with each risk and each indicator, naming none, as the QC pack lists them (D-015).
A `public-release` run is ready for release only where each instance at high risk that it releases was listed as high-risk in an attested QC pack of an earlier run of the same files and policy, whose attestation covers every high-risk instance; otherwise its pixel and face review gate fails. A reviewer who finds burned-in text rejects the pack, and the run is then not ready (D-017).
'''

[[requirement]]
id = "MIDI-BP-11"
text = '''
Remove or replace all unstructured text, whether in data elements, pixel data, or overlays, or, where it is needed for utility, scan it for identifiers and sensitive information, manually or automatically with human review.
'''
status = "implemented"
decisions = ["D-009", "D-017", "D-022", "D-027"]
implementation = [
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/pixel_risk.py",
  "_dicom/deidentify/readiness.py",
  "_dicom/deidentify/release_gate.py",
  "_dicom/deidentify/residuals.py",
  "_dicom/deidentify/reviewed_roi_names.py",
  "_dicom/deidentify/roi_names.py",
  "_dicom/deidentify/run_qc.py",
  "_dicom/deidentify/supplementary_actions.py",
]
note = '''
Under the Basic Profile, every text attribute that a supported IOD uses is removed or replaced, by Table E.1-1 or a reviewed supplementary rule, except coded and technical values and De-identification Method, which the engine adds to (D-022).
Under Clean Descriptors, a ROI name is written in the spelling of a TG-263 vocabulary only where it matches one of its names and echoes no known patient or other person identifier, and goes to review otherwise; a reviewer's decision to keep or map a name is applied only where what it would write echoes no such identifier (D-009).
The run's instance transform applies the actions to each data set, and descriptor cleaning holds for review a ROI name whose decision would echo an identifier.
A reviewer's decision on a ROI name applies to every ROI Name of that spelling, in the collection and in later runs, and each run searches every written file for the source values that had to be removed or replaced (MIDI-BP-01).
Indicators of burned-in text are reported in the confidential QC pack (D-015); only under the Clean Pixel Data Option does the engine black out text, and it then holds the instance for review (D-037).
A `public-release` run is ready for release only where an attested review of an earlier run of the same files and policy reviewed each instance at high risk that it releases, as MIDI-BP-10 says, and each string that it retains in a released instance, which the attestation's coverage confirms; otherwise its pixel and face review gate or its attestation gate fails (D-017).
'''

[[requirement]]
id = "MIDI-BP-12"
text = '''
Replace absolute dates and times while preserving relative temporal relationships across studies, within a useful tolerance, for short-term analyses such as dynamic contrast and nuclide decay and long-term ones such as therapy assessment.
'''
status = "partial"
milestone = "M4"
decisions = ["D-004", "D-006", "D-007", "D-039"]
implementation = [
  "_dicom/deidentify/api.py",
  "_dicom/deidentify/cleaners.py",
  "_dicom/deidentify/command.py",
  "_dicom/deidentify/dates.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/key_command.py",
  "_dicom/deidentify/keys.py",
  "_dicom/deidentify/modified_dates.py",
  "_dicom/deidentify/profiles.py",
  "_dicom/deidentify/temporal_roles.py",
]
note = '''
Offsets are whole weeks, derived from the key and the subject's identity, and every date, time, and datetime attribute has a reviewed role that decides whether it moves with the subject.
Under Retain Longitudinal Temporal Information with Modified Dates, a cleaner of the whole instance moves every subject-event and radiation-source date back by the subject's offset, the same in every instance of the subject in a run, so date-only intervals, weekdays, local times of day, and decay intervals at a common UTC offset are preserved, and replaces device and other dates with dummy values (D-039, PS3.15-E.3.6-02).
Intervals between instances with different UTC offsets change by the difference between those offsets (D-007).
Times of day are kept, not replaced, since whole weeks keep them and a time alone identifies no one (D-006); only the date of a datetime moves.
Each subject's offset is the one its profile records (D-004). Under a run-scoped key, the profile is the derivation, so offsets are consistent across a subject's studies within a run but not between separate runs.
Under a project key, the subject profile store records the offset at first export and every later run reads it back, so studies de-identified in separate runs keep their intervals; the store is saved before the release is published, so a store that cannot be saved publishes nothing.
Project keys are refused until `PROJECT_KEYS_ENABLED` is set, so no run can use them yet, since the first supported release uses a run-scoped key.
Remaining: enable project keys (`PROJECT_KEYS_ENABLED`) in the release PR (M4).
'''

[[requirement]]
id = "MIDI-BP-13"
text = '''
Retain private data elements only after evaluating their risk against a reliable source of elements known to be safe, such as PS3.15 E.3.10 or manufacturers' documentation; otherwise remove them selectively or entirely.
'''
status = "implemented"
decisions = ["D-001", "D-028", "D-035"]
implementation = [
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/retained_private.py",
  "_dicom/deidentify/safe_private.py",
  "_dicom/deidentify/tcia_private_tags.py",
]
note = '''
Without Retain Safe Private, every private data element and private creator is removed from a data set, at every level (D-028).
The run's instance transform removes them from each instance it writes.
The reviewed rules evaluate every row of PS3.15 Table E.3.10-1, and retain only values that can be checked; under the Option, the engine applies them, and the instance's own declarations of safe private attributes in Private Data Element Characteristics Sequence, with the same checks, and removes every private attribute that neither retains, or that the instance declares may identify (D-035).
TCIA's Private Tag Dictionary, shipped unchanged and pinned by its SHA-256, is a second source that a run may choose in place of the reviewed rules, and its kept values pass the same checks (D-035).
'''

[[requirement]]
id = "MIDI-BP-14"
text = '''
Consider identifying information embedded in compressed bitstreams, such as JPEG APP1 (EXIF) and APP11 (JUMBF) segments or ICC profiles. Either decompress losslessly compressed data and discard the embedded elements or, where the bitstream is kept, scan it and remove or replace the elements at risk.
'''
status = "implemented"
decisions = ["D-010", "D-021", "D-022", "D-027"]
implementation = [
  "_dicom/deidentify/codestreams.py",
  "_dicom/deidentify/dummy_values.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/icc_profiles.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/residuals.py",
  "_dicom/deidentify/scope.py",
  "_dicom/deidentify/supplementary_actions.py",
]
note = '''
ICC Profile (0028,2000), an embedded file whose contents the engine does not parse, is removed by Type under every option, which removes it wherever the first supported release's IODs make it Type 3 (D-022); at the top level of an Enhanced CT Image, Enhanced MR Image, or Enhanced MR Color Image instance, where it is Type 1, D replaces an RGB profile with a fixed sRGB profile, which nothing of the source profile is written to, and sequesters an instance whose profile is of any other colour space, since PS3.3 Section C.11.15.1.1 requires RGB (D-021).
Where the bitstream is kept, the engine parses each frame's codestream of encapsulated Pixel Data, accounting for every byte, and cuts its comment and application segments without recompression, keeping only JFIF, Adobe, and JPEG-LS colour segments of fixed format; it shows that every frame then decodes to the same pixels, and sequesters an instance whose codestreams do not parse, hold bytes outside them, or hold a segment it cannot cut (design Architecture item 7).
The residual search searches the marker segments of those codestreams for every form, and their entropy-coded data, which can end with bytes that no decoder reads, for forms of at least 6 bytes, but RLE Lossless frames, which hold only samples and offsets, as values that hold numbers (D-027).
The first supported release de-identifies instances in each transfer syntax that encapsulates Pixel Data that pydicom's decoding plugins decode, and writes each with its transfer syntax and coded pixel data kept, its metadata segments cut (D-010).
'''

[[requirement]]
id = "MIDI-BP-15"
text = '''
Quantify the re-identification risk from potentially reconstructable facial information in head and neck cross-sectional images with a collection-specific expert statistical analysis. Above the threshold, remove or modify the facial features, or do not share the images publicly.
'''
status = "partial"
milestone = "M4"
decisions = ["D-015", "D-017", "D-046", "D-050", "D-053"]
implementation = [
  "_dicom/deidentify/pixel_risk.py",
  "_dicom/deidentify/head_and_neck_regions.toml",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/readiness.py",
  "_dicom/deidentify/run_qc.py",
  "_dicom/deidentify/qc_contours.py",
  "_dicom/deidentify/qc_pack.py",
  "_dicom/deidentify/qc_previews.py",
  "_dicom/deidentify/qc_segments.py",
  "_dicom/deidentify/qc_surfaces.py",
]
note = '''
Recognizable Visual Features of YES, an RT Structure Set's contours of an ROI whose interpreted type or name is EXTERNAL, BODY, or SKIN, the patient's outline, or BOLUS or FIXATION, which lie on it, every CT, MR, PET, and RT Dose volume, single-frame or enhanced, whatever its slice spacing, every CT, MR, and PET localizer and every RT Image, whatever its gantry angle, which can show the face in profile, and every Segmentation, whose skin or body segment traces the face, are reported as indicators of a reconstructable face, and a volume, localizer, RT Image, or Segmentation that names a region of the head or neck, the last also by a segment's anatomy or property type, as showing it.
Each run lists each instance's indicators and each series' indicators, assessed over its released and held instances, in its QC pack for review.
The QC pack renders the skin surface of each volume that it projects, and the 5% isodose surface of each RT Dose grid of two or more frames, from the front, both obliques, both profiles, and behind, on voxels of 2 mm or its own spacing however long it is, so that the reviewer sees the face that a recognition system would; a volume more than 2,000 mm long or 1,000 mm across is not rendered, and is held beyond its cine strip. Every preview draws padding as one black, or as no patient, so an instance with a frame whose padding holds more than one stored value is held. A dose render that shows no face is inconclusive, since lower doses can keep an outline that the 5% isodose misses.
It renders each RT Structure Set's contours as written from the same directions, each frame's ROIs united and each ROI alone, drawn with the surface of a volume in their frame, so that the reviewer sees a face that an outline traces, and each BINARY or LABELMAP Segmentation's segments as written likewise, each frame placed by its functional groups; a FRACTIONAL Segmentation, or one that a sheet cannot place or show, is held (D-017).
A `public-release` run is ready for release only where every instance that it releases that can show a face, one with pixel data or contours, is in a series that the reviewer marked as showing no face, on the pixel data and contours that the run writes, or where its statistical gate passes with an external assessment that covered faces reconstructed from the images, which D-017 accepts as the risk assessment reference that unblocks facial information; otherwise its pixel and face review gate fails (D-017, D-053).
The `public-release` preset selects the Clean Recognizable Visual Features Option, so its run removes the face block from each CT series in which it finds one, the remedy that the recommendation names, and holds every instance that can show a face unless a reviewer marked its series as showing none, on the pixel data and contours that the run writes; under the preset, an assessment of facial risk releases no face (D-017, D-046, D-050).
A reviewer's verdict that the renders show no face stands in for a quantified facial risk, as D-017 decides; the engine computes no facial re-identification probability itself.
Remaining: a collection-specific quantified analysis of the facial re-identification risk wherever a series can show a face, which a reviewer's verdict does not supply (M4).
'''

[[requirement]]
id = "MIDI-BP-16"
text = '''
Redact faces in photographic images so as to defeat recognition by people and software, with the residual risk quantified; above the threshold, do not share the images publicly.
'''
status = "out-of-scope"
decisions = ["D-010"]
note = '''
Photographic images are outside the supported objects and are sequestered (D-010).
'''

[[requirement]]
id = "MIDI-BP-17"
text = '''
Use human quality control to confirm that de-identification both removed what it should and preserved utility. Guide the proportion and type of records inspected by a documented risk assessment that sets the threshold of residual risk before and after quality control, taking account of what is removed or replaced and how reliably. Cover structured and unstructured text, pixel data, overlays, and metadata embedded in compressed bitstreams.
'''
status = "implemented"
decisions = ["D-016", "D-017", "D-026", "D-027"]
implementation = [
  "_dicom/deidentify/attestation_command.py",
  "_dicom/deidentify/descriptor_cleaning.py",
  "_dicom/deidentify/instance_transform.py",
  "_dicom/deidentify/qc_attestation.py",
  "_dicom/deidentify/qc_contours.py",
  "_dicom/deidentify/qc_pack.py",
  "_dicom/deidentify/qc_previews.py",
  "_dicom/deidentify/qc_retained.py",
  "_dicom/deidentify/qc_store.py",
  "_dicom/deidentify/qc_surfaces.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/release_report_markdown.py",
  "_dicom/deidentify/run.py",
  "_dicom/deidentify/run_qc.py",
  "_dicom/deidentify/run_report.py",
  "_dicom/deidentify/run_results.py",
]
note = '''
D-016 provides the confidential QC pack, to which the release gate sends the residual search's text findings inside the data set, and files whose collection for the search was incomplete for other text or for private values or values to which the pinned dictionary gives no VR (D-027), and D-017 sets the review coverage (every distinct retained string, every series, and every instance in high-risk categories) and the attestation.
For the first release, the design assigns to whoever releases the data the confirmation that utility is preserved and that the residual risk is acceptable (decided 6 October 2026).
The QC pack is built and written: each instance by run position and source path, with its source file's SHA-256 and its output path or opaque label (D-026); each residual with a contextual excerpt, and each drop and form not searched, by instance and place (D-027); each distinct retained string with its places (D-017); and what descriptor cleaning wrote for each ROI Name, or why it held it for review (D-009).
It is written only to a designated, owner-only location outside the source, release, and staging directories, and is marked so that no release includes it (D-016).
A reviewer attests to a pack once, stating whether they reviewed every distinct retained string, every series, and every instance in high-risk categories, and an outcome of attested needs all three; the attestation is bound to the pack by its digest, and gives the release report only the pack's opaque reference and the outcome (D-016, D-017).
The pack lists each series of released or held instances, and the attestation may give any of them, by its first run position, a face verdict, absent or present, from its previews; the pack's source digests, and the digests of the pixel data written of them, bind the verdict to the files the reviewer saw and to what the run wrote of them, and the release report does not record it (D-016, D-017, D-046).
Each run writes its pack before it publishes the release, to a QC destination that the caller must name and that is checked before anything is created; a pack that cannot be written publishes nothing, and the pack of a release that cannot be published is removed, or named if it cannot be.
The run's instance transform and release gate adapter give it this material.
The pack lists every input from its outcome, each sequestered one by the random label that the run gives it, and the transform's and gate's material by run position: each residual search with its excerpts, each source value they left out of the search with its reason, what descriptor cleaning wrote for each ROI Name, and each retained string with its places.
The retained strings of an instance are the values that its plan keeps as they are, in elements with a text VR other than UI, outside any removed sequence, and other than Specific Character Set, and a value that was not read for review, or could not be decoded, is refused rather than left out, and the run's transform sequesters an instance with such a value.
The pack previews each series released or held for review, by a cine strip and, for a volume, a frontal maximum intensity projection and renders of its skin surface from six directions; renders the skin surface of each RT Dose grid of two or more frames; previews each instance whose source shows an indicator of risk in its pixel data at full resolution, with those indicators; renders each RT Structure Set's contours as written on a contour sheet, each frame's ROIs united and drawn on a volume of that frame where the run wrote one, and each ROI alone, listing a set that a sheet cannot show; and lists each series whose released and held instances are a CT, MR, PET, or RT Dose volume, are localizers, or name the head or neck, with the instances that show each; it decodes compressed pixel data by the plugin pinned to its transfer syntax; it lists each instance it could not preview, with why, and records each preview's SHA-256, so that an attestation covers the previews too (D-017).
A reviewer records an attestation of a pack with a command, which refuses a directory that holds no QC pack and quotes neither the reviewer nor a path; the release report published with the run keeps the record it was written with.
The person releasing the data may confirm in the attestation, yes or no, that the output was checked for its intended use and that its residual risk was accepted under the institution's governance, and the record that a release report takes carries those outcomes alone; the report's QC review gives each as true, false, or not stated, and refuses one without an attestation.
Each run's release report summarises the engine's structural checks of its output, the first pass's references, the IOD requirements, and the written references: for each, how many instances it sequestered and how many it reported without acting on them, naming none, so that a recipient sees the output is consistent, though not that it suits a use (decided 6 October 2026).
'''

[[requirement]]
id = "MIDI-BP-18"
text = '''
Document the de-identification process in detail, including the release of PS3.15 and the Options used, and publish the documentation, or a reference to it, with the collection.
'''
status = "implemented"
decisions = ["D-009", "D-011", "D-012", "D-016", "D-024", "D-026", "D-027", "D-029"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/conformance_values.py",
  "_dicom/deidentify/markers.py",
  "_dicom/deidentify/method_digest.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/release_report_markdown.py",
  "_dicom/deidentify/run_report.py",
  "_dicom/deidentify/runtime.py",
]
note = '''
Each instance's markers record the process in the instance itself: De-identification Method names PyMedPhys, its version, the PS3.15 edition, and the preset, and gives the method digest; the CID 7050 codes name the profile and each Option the instance satisfies; and a Contributing Equipment Sequence item names PyMedPhys as the de-identifying equipment, and gives in Software Versions its version and the runtime environment that ran, which the method digest does not cover (D-012, D-024).
The validated policy records the edition, preset, and options.
The conformance statement generated from a policy names the PyMedPhys version, the PS3.15 edition, the preset, its Options with their CID 7050 codes, and its method digest with the vocabulary it covers, without the technique vocabulary, and without a reviewed-names or reviewed descriptors list, and the markers that each instance gains, and the same policy and engine always give the same text.
The release report's record of the policy (its edition, preset, and options), of the method digest with the components it is computed from (D-024), and of the runtime environment that ran, with the values that Software Versions records (D-029), is built and written as JSON, and refuses any field that could hold a source value or a path outside the engine's package (D-016).
Its sections on a run give the QC pack's opaque reference with its attestation's outcome (D-016), list each released instance by its output name, name each sequestered instance by a random label for the run, with each reason's stage and code, and the attribute, action, and VR where the walker sequestered it, or the attribute where the release gate's reason names one (D-026); count the instances held for review by stage and reason, naming none (D-009); count the ROI Names that descriptor cleaning cleaned by outcome, and the distinct names sent for review by reason, naming none (D-009); count the instances with each kind of reference finding that the run reports without acting on it, naming none (D-026); count the released and held instances that show each risk in their pixel data, and each indicator of it, naming none (D-015); count the source values that the residual search did not search, in full or in part, by attribute and reason (D-027); and summarise the engine's structural checks, each with how many instances it sequestered and how many it reported, naming none; the conformance statement describes them, generated from the report's format, labels, and reason codes.
A run given a reporter writes the report as `release-report.json` at the root of the release before it publishes it, with its QC pack by reference, not yet attested, its released instances by output name, its sequestered instances by label, its held instances by reason, an identical copy counting as the instance it copies, and the values that the residual searches did not search, each counted once at the instance that holds it, and a report that cannot be built publishes nothing and leaves no QC pack; an input whose reasons the report cannot give is sequestered for an invalid reason instead, which the report gives alone and the QC pack lists before its own reasons, so that it never stops the release.
Beside the report, the run writes its human-readable form as `release-report.md`: CommonMark, with GitHub Flavored Markdown tables, generated from the JSON text alone, which shows every value of the document, and each file name that keys a digest, as a code span as often as the document holds it, and draws nothing else from the report; the same text always gives the same form, and a report whose form cannot be generated publishes nothing.
Every reason that sequesters or holds an instance in a run, from the run's own checks, the transform, the writer, the preservation check, and the release gate, has a stage and code in the report, and the codes within each stage are distinct.
Each run given a release reporter publishes the conformance statement of its policy with its release, beside the release report.
Both supported entry points, `pymedphys._dicom.deidentify.api.deidentify` and the command's `main`, always give the run a reporter, unless a test supplies the command's transform, so every run they start publishes the release report and the conformance statement; `run.run` and `command.deidentify_directory`, which are private, write them only when given one.
'''

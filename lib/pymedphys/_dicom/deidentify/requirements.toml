[[requirement]]
id = "MIDI-BP-11"
text = '''
Remove or replace all unstructured text, whether in data elements, pixel data, or overlays, or, where it is needed for utility, scan it for identifiers and sensitive information, manually or automatically with human review.
'''
status = "partial"
milestone = "M4"
decisions = ["D-009", "D-017", "D-022", "D-027"]
implementation = [
  "_dicom/deidentify/roi_names.py",
  "_dicom/deidentify/supplementary_actions.py",
]
tests = [
  "tests/dicom/test_deidentify_roi_names.py::test_a_name_that_echoes_a_known_identifier_goes_to_review",
  "tests/dicom/test_deidentify_supplementary_actions.py::test_every_text_attribute_a_supported_iod_uses_and_table_e1_1_omits_has_a_rule",
  "tests/dicom/test_deidentify_supplementary_actions.py::test_the_basic_profile_keeps_only_the_reviewed_coded_and_technical_text",
]
note = '''
Under the Basic Profile, every text attribute that a supported IOD uses is removed or replaced, by Table E.1-1 or a reviewed supplementary rule, except coded and technical values and De-identification Method, which the engine adds to (D-022). Under Clean Descriptors, a ROI name is written in the spelling of a TG-263 vocabulary only where it matches one of its names and echoes no known patient or other person identifier, and goes to review otherwise (D-009). Remaining: applying the actions to each data set (M3); and the review of descriptors with pooled human review, the residual search, and reporting indicators of burned-in text, since the engine does not change pixel data (M4).
'''

[[requirement]]
id = "MIDI-BP-12"
text = '''
Replace absolute dates and times while preserving relative temporal relationships across studies, within a useful tolerance, for short-term analyses such as dynamic contrast and nuclide decay and long-term ones such as therapy assessment.
'''
status = "partial"
milestone = "M3"
decisions = ["D-006", "D-007"]
implementation = [
  "_dicom/deidentify/dates.py",
  "_dicom/deidentify/profiles.py",
]
tests = [
  "tests/dicom/test_deidentify_dates.py::test_an_offset_is_52_to_520_whole_weeks_and_never_zero",
  "tests/dicom/test_deidentify_dates.py::test_shifting_preserves_intervals_and_weekdays",
  "tests/dicom/test_deidentify_dates.py::test_a_datetime_moves_its_date_and_keeps_its_time_and_utc_offset",
  "tests/dicom/test_deidentify_profiles.py::test_profiles_persist_across_runs",
  "tests/dicom/test_deidentify_profiles.py::test_a_stored_offset_wins_over_a_changed_derivation",
  "tests/dicom/test_deidentify_temporal_roles.py::test_modified_dates_shifts_subject_events_and_normalises_time_zones",
]
note = '''
Offsets are whole weeks, identical across a subject's studies and runs, so intervals and times are preserved exactly, and every date, time, and datetime attribute has a reviewed role that decides whether it moves with the subject. Remaining: their modification in data sets (M3).
'''

[[requirement]]
id = "MIDI-BP-13"
text = '''
Retain private data elements only after evaluating their risk against a reliable source of elements known to be safe, such as PS3.15 E.3.10 or manufacturers' documentation; otherwise remove them selectively or entirely.
'''
status = "partial"
milestone = "M3"
decisions = ["D-001", "D-028"]
implementation = ["_dicom/deidentify/private_attributes.py"]
tests = [
  "tests/dicom/test_deidentify_private_attributes.py::test_the_basic_profile_removes_every_private_attribute",
  "tests/dicom/test_deidentify_private_attributes.py::test_every_odd_group_element_is_removed",
  "tests/dicom/test_deidentify_private_attributes.py::test_retain_safe_private_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_a_policy_that_does_not_remove_private_attributes_is_refused",
]
note = '''
Without Retain Safe Private, every private data element and private creator is removed from a data set, at every level, and a policy that selects the Option, which retains those known to be safe, is refused until reviewed rules say which are (D-028). Remaining: removing them from each instance the engine de-identifies, and the reviewed rules that `public-release` needs (M3).
'''

[[requirement]]
id = "MIDI-BP-14"
text = '''
Consider identifying information embedded in compressed bitstreams, such as JPEG APP1 (EXIF) and APP11 (JUMBF) segments or ICC profiles. Either decompress losslessly compressed data and discard the embedded elements or, where the bitstream is kept, scan it and remove or replace the elements at risk.
'''
status = "partial"
milestone = "M3"
decisions = ["D-022"]
implementation = [
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/supplementary_actions.py",
]
tests = [
  "tests/dicom/test_deidentify_element_rules.py::test_each_new_supplementary_rule_removes_by_type_with_a_note",
  "tests/dicom/test_deidentify_element_rules.py::test_the_new_rules_remove_by_type_where_the_supported_iods_allow_it",
]
note = '''
ICC Profile (0028,2000), an embedded file whose contents the engine does not parse, is removed by Type under every option, which removes it wherever the first supported release's IODs define it (D-022). Remaining: removing metadata in compressed pixel data without recompression (M3).
'''

[[requirement]]
id = "MIDI-BP-15"
text = '''
Quantify the re-identification risk from potentially reconstructable facial information in head and neck cross-sectional images with a collection-specific expert statistical analysis. Above the threshold, remove or modify the facial features, or do not share the images publicly.
'''
status = "partial"
milestone = "M4"
decisions = ["D-015", "D-017"]
implementation = [
  "_dicom/deidentify/pixel_risk.py",
  "_dicom/deidentify/head_and_neck_regions.toml",
]
tests = [
  "tests/dicom/test_deidentify_pixel_risk.py::test_declared_recognizable_visual_features_are_an_indicator",
  "tests/dicom/test_deidentify_pixel_risk.py::test_an_external_roi_with_contours_is_a_patient_surface",
  "tests/dicom/test_deidentify_pixel_risk.py::test_every_ct_volume_may_hold_a_reconstructable_face",
  "tests/dicom/test_deidentify_pixel_risk.py::test_a_volume_that_names_the_head_or_neck_says_so",
  "tests/dicom/test_deidentify_pixel_risk.py::test_an_anatomic_region_code_can_name_the_head",
  "tests/dicom/test_deidentify_pixel_risk.py::test_one_multi_frame_ct_image_can_be_a_volume",
  "tests/dicom/test_deidentify_pixel_risk.py::test_shared_frame_anatomy_can_name_the_head",
  "tests/dicom/test_deidentify_pixel_risk.py::test_per_frame_anatomy_can_name_the_head",
  "tests/dicom/test_deidentify_pixel_risk.py::test_unreadable_evidence_is_reported_without_a_volume",
  "tests/dicom/test_deidentify_pixel_risk.py::test_an_roi_named_external_body_or_skin_is_a_patient_surface",
]
note = '''
Recognizable Visual Features of YES, an RT Structure Set's contours of an ROI whose interpreted type or name is EXTERNAL, BODY, or SKIN, the patient's outline, and every CT volume, whatever its slice spacing, are reported as indicators of a reconstructable face, and a volume that names a region of the head or neck as showing it. Remaining: reporting them, and the `public-release` assessment and face review (M4).
'''

[[requirement]]
id = "MIDI-BP-16"
text = '''
Redact faces in photographic images so as to defeat recognition by people and software, with the residual risk quantified; above the threshold, do not share the images publicly.
'''
status = "out-of-scope"
decisions = ["D-010"]
note = '''
Photographic images are outside the supported objects and are sequestered (D-010).
'''

[[requirement]]
id = "MIDI-BP-17"
text = '''
Use human quality control to confirm that de-identification both removed what it should and preserved utility. Guide the proportion and type of records inspected by a documented risk assessment that sets the threshold of residual risk before and after quality control, taking account of what is removed or replaced and how reliably. Cover structured and unstructured text, pixel data, overlays, and metadata embedded in compressed bitstreams.
'''
status = "planned"
milestone = "M4"
decisions = ["D-016", "D-017", "D-027"]
note = '''
D-016 provides the confidential QC pack, to which the residual search sends its text findings (D-027), and D-017 sets the review coverage (every distinct retained string, every series, and every instance in high-risk categories) and the attestation. The design does not yet say how quality control confirms that utility is preserved, or how the residual-risk threshold before and after it is recorded. This practice is not implemented until M4 covers both, or the design assigns them to whoever releases the data.
'''

[[requirement]]
id = "MIDI-BP-18"
text = '''
Document the de-identification process in detail, including the release of PS3.15 and the Options used, and publish the documentation, or a reference to it, with the collection.
'''
status = "partial"
milestone = "M4"
decisions = ["D-011", "D-012", "D-016", "D-024", "D-029"]
implementation = [
  "_dicom/deidentify/conformance.py",
  "_dicom/deidentify/markers.py",
  "_dicom/deidentify/method_digest.py",
  "_dicom/deidentify/release_report.py",
  "_dicom/deidentify/runtime.py",
]
tests = [
  "tests/dicom/test_deidentify_markers.py::test_each_preset_adds_exactly_its_markers",
  "tests/dicom/test_deidentify_markers.py::test_tps_import_claims_no_ps3_15_conformance_and_adds_no_codes",
  "tests/dicom/test_deidentify_markers.py::test_the_first_method_value_is_exactly_the_method_digest",
  "tests/dicom/test_deidentify_markers.py::test_the_markers_are_defined_by_the_iod_and_the_equipment_item_is_complete",
  "tests/dicom/test_deidentify_markers.py::test_software_versions_give_pymedphys_then_python_pydicom_and_tomlkit",
  "tests/dicom/test_deidentify_markers.py::test_software_versions_give_the_running_python_pydicom_and_tomlkit",
  "tests/dicom/test_deidentify_markers.py::test_software_versions_are_the_runtime_environment_of_the_release_report",
  "tests/dicom/test_deidentify_markers.py::test_each_source_of_software_versions_changes_its_own_value",
  "tests/dicom/test_deidentify_markers.py::test_python_and_library_versions_change_software_versions_not_the_digest",
  "tests/dicom/test_deidentify_release_report.py::test_the_policy_section_names_the_edition_preset_and_options",
  "tests/dicom/test_deidentify_release_report.py::test_the_document_has_the_sections_and_fields_the_design_lists",
  "tests/dicom/test_deidentify_release_report.py::test_the_method_section_holds_the_digest_and_its_components",
  "tests/dicom/test_deidentify_release_report.py::test_the_runtime_section_holds_the_values_of_software_versions",
  "tests/dicom/test_deidentify_release_report.py::test_the_report_holds_no_path_of_the_installed_engine",
  "tests/dicom/test_deidentify_release_report.py::test_the_report_holds_the_vocabulary_digest_not_its_entries",
  "tests/dicom/test_deidentify_release_report.py::test_a_report_with_a_field_that_could_hold_a_value_or_path_is_refused",
  "tests/dicom/test_deidentify_method_digest.py::test_the_components_of_a_small_synthetic_input_are_digests_of_its_members",
  "tests/dicom/test_deidentify_method_digest.py::test_the_components_show_which_input_changed_the_digest",
  "tests/dicom/test_deidentify_runtime.py::test_each_value_is_read_from_its_source_at_each_call",
  "tests/dicom/test_deidentify_conformance.py::test_the_statement_names_the_edition_preset_and_options",
  "tests/dicom/test_deidentify_conformance.py::test_the_method_digest_is_the_policys_with_the_same_vocabulary",
  "tests/dicom/test_deidentify_conformance.py::test_the_statement_is_the_same_every_time_it_is_generated",
]
note = '''
Each instance's markers record the process in the instance itself: De-identification Method names PyMedPhys, its version, the PS3.15 edition, and the preset, and gives the method digest; the CID 7050 codes name the profile and each Option the instance satisfies; and a Contributing Equipment Sequence item names PyMedPhys as the de-identifying equipment, and gives in Software Versions its version and the runtime environment that ran, which the method digest does not cover (D-012, D-024). The validated policy records the edition, preset, and options. The conformance statement generated from a policy names the PyMedPhys version, the PS3.15 edition, the preset, its Options with their CID 7050 codes, and its method digest with the vocabulary it covers, and the same policy and engine always give the same text. The release report's record of the policy (its edition, preset, and options), of the method digest with the components it is computed from (D-024), and of the runtime environment that ran, with the values that Software Versions records (D-029), is built and written as JSON, and refuses any field that could hold a source value or a path outside the engine's package (D-016). Remaining: writing the release report for each run, with its sections on the run's instances and a human-readable form, and publishing it with the collection (M4); and writing the conformance statement with each run and publishing it with each release (M4, M6).
'''

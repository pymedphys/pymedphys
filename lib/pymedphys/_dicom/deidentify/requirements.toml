# The requirements register for DICOM de-identification, curated by hand.
# The "Requirements register" section of
# docs/contrib/info/deidentification-design.md describes its fields.
# PS3.15 text is reproduced verbatim from the edition below.

schema = "pymedphys-deid-requirements/1"
edition = "2026d"
acknowledgement = "DICOM PS3.15 2026d, © NEMA"
midi_report = "Clunie DA et al., Report of the Medical Image De-Identification (MIDI) Task Group: Best Practices and Recommendations, 7 February 2025, arXiv:2303.10473"

[[requirement]]
id = "PS3.15-E.1.1-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_daa1954b-9af4-4bad-aa35-41690a97fc7f"
text = '''
Each Attribute to be protected shall then either be removed from the Data Set, or have its value replaced by a different "replacement value" that does not allow identification of the patient.
'''
status = "partial"
milestone = "M3"
decisions = ["D-001", "D-003", "D-005", "D-011", "D-020", "D-021"]
implementation = [
  "_dicom/deidentify/dummy_values.py",
  "_dicom/deidentify/pseudonyms.py",
]
tests = [
  "tests/dicom/test_deidentify_dummy_values.py::test_z_writes_a_zero_length_value",
  "tests/dicom/test_deidentify_dummy_values.py::test_d_writes_its_vrs_constant",
  "tests/dicom/test_deidentify_dummy_values.py::test_d_writes_the_second_constant_where_the_source_equals_the_first",
  "tests/dicom/test_deidentify_dummy_values.py::test_different_source_values_give_the_same_dummy_value",
  "tests/dicom/test_deidentify_dummy_values.py::test_ui_takes_the_keyed_replacement",
  "tests/dicom/test_deidentify_dummy_values.py::test_a_vr_without_a_generic_dummy_value_is_refused",
  "tests/dicom/test_deidentify_pseudonyms.py::test_a_pseudonym_follows_the_specified_derivation",
  "tests/dicom/test_deidentify_pseudonyms.py::test_a_pseudonym_is_valid_for_its_vr_and_conspicuous",
  "tests/dicom/test_deidentify_pseudonyms.py::test_different_subjects_give_different_pseudonyms",
  "tests/dicom/test_deidentify_pseudonyms.py::test_the_same_identifier_from_another_issuer_is_another_subject",
  "tests/dicom/test_deidentify_pseudonyms.py::test_a_pseudonym_does_not_contain_the_identifier",
]
note = '''
Patient ID and Patient's Name have keyed replacement values that keep subjects separate and do not contain the source identifier. Z writes a zero-length value, and D a conspicuous constant for each VR that does not depend on the source value, or a second constant where the source value equals the first, so the replacement always differs from it; a UI value takes its keyed replacement, and D on an attribute of any other VR is refused until a reviewed rule covers it (D-021). Remaining: removing or replacing each Attribute to be protected in a data set (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_08a36063-841b-4499-9a4e-8501cc83acae"
text = '''
Each Attribute specified to be retained shall be retained. At the discretion of the de-identifier, Attributes may be added to the Data Set to be protected.
'''
status = "partial"
milestone = "M3"
decisions = ["D-007", "D-011", "D-022", "D-023"]
implementation = ["_dicom/deidentify/actions.py", "_dicom/deidentify/policy.py"]
tests = [
  "tests/dicom/test_deidentify_actions.py::test_an_option_overrides_the_profile",
  "tests/dicom/test_deidentify_policy.py::test_tps_import_keeps_device_identity_and_patient_characteristics",
  "tests/dicom/test_deidentify_policy.py::test_a_custom_option_set_is_validated_and_never_enabled",
  "tests/dicom/test_deidentify_policy.py::test_the_tps_import_options_are_rejected_without_the_preset",
  "tests/dicom/test_deidentify_policy.py::test_a_conflict_that_a_new_edition_adds_is_rejected",
]
note = '''
Reviewed rules add the text attributes, dates, and times that Table E.1-1 omits to those protected (D-022, D-023). A policy keeps (K) each attribute that its selected options retain, and an option set that gives an attribute to be retained another action as well is rejected. The one exception is `tps-import`, which modifies eleven device and beam hold dates and times that Retain Device Identity would keep and claims no PS3.15 conformance (D-007). Remaining: retaining each such attribute in a data set (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_1c3d937e-b42b-4cd7-80db-092f09622605"
text = '''
If used, all instances of the Encrypted Attributes Data Set shall be encoded with a DICOM Transfer Syntax, encrypted, and stored in the Data Set to be protected as an Item of the Encrypted Attributes Sequence (0400,0500). The encryption shall be done using RSA [RFC 2313] for the key transport of the content-encryption keys. A de-identifier conforming to this security Profile may use either AES or Triple-DES for content-encryption. The AES key length may be any length allowed by the RFCs. The Triple-DES key length is 168 bits as defined by [ANSI X9.52]. Encoding shall be performed according to the specifications for RSA Key Transport and Triple DES Content Encryption in [RFC 3370] and for AES Content Encryption in [RFC 3565].
'''
status = "out-of-scope"
decisions = ["D-013"]
note = '''
The engine does not write the Encrypted Attributes Sequence, and removes any that its input carries (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.1-04"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_bf62b269-f6b0-4598-ab70-36dec5b54ea5"
text = '''
No requirements on the size of the asymmetric key pairs used for RSA key transport are defined in this confidentiality scheme. Implementations claiming conformance to the Basic Application Level Confidentiality Profile as a de-identifier shall always protect (e.g., encrypt and replace) the SOP Instance UID (0008,0018) Attribute as well as all references to other SOP Instances, whether contained in the main Data Set or embedded in an Item of a Sequence of Items, that could potentially be used by unauthorized entities to identify the patient.
'''
status = "partial"
milestone = "M3"
decisions = ["D-003", "D-004"]
implementation = [
  "_dicom/deidentify/keys.py",
  "_dicom/deidentify/uid_roles.py",
  "_dicom/deidentify/uids.py",
]
tests = [
  "tests/dicom/test_deidentify_keys.py::test_derivations_are_pinned",
  "tests/dicom/test_deidentify_uid_roles.py::test_every_ui_attribute_in_the_dictionary_has_exactly_one_role",
  "tests/dicom/test_deidentify_uid_roles.py::test_every_uid_table_e1_1_replaces_is_an_instance_uid",
  "tests/dicom/test_deidentify_uid_roles.py::test_an_instance_uid_is_replaced",
  "tests/dicom/test_deidentify_uids.py::test_a_replacement_follows_the_specified_derivation",
  "tests/dicom/test_deidentify_uids.py::test_a_replacement_is_a_valid_uid_from_a_version_5_uuid",
  "tests/dicom/test_deidentify_uids.py::test_a_replacement_depends_only_on_the_key_and_the_unpadded_uid",
  "tests/dicom/test_deidentify_uids.py::test_different_uids_give_different_replacements",
]
note = '''
Replacement UIDs are derived from the key, so every occurrence of a UID is replaced consistently, and every UI attribute has a reviewed role. Remaining: replacing each SOP Instance UID and reference in a data set, including in sequences (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-05"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_7a8255cd-d599-4fca-9414-99cca6ed47a7"
text = '''
The Attribute Patient Identity Removed (0012,0062) shall be replaced or added to the Data Set with a value of YES. Additionally, one or more codes from CID 7050 “De-identification Method” corresponding to the Profile and Options used shall be added to De-identification Method Code Sequence (0012,0064), and/or a text string describing the method used shall be inserted in or added to De-identification Method (0012,0063).
'''
status = "partial"
milestone = "M3"
decisions = ["D-012", "D-024"]
implementation = [
  "_dicom/deidentify/markers.py",
  "_dicom/deidentify/method_digest.py",
]
tests = [
  "tests/dicom/test_deidentify_method_digest.py::test_the_digest_is_only_64_lowercase_hexadecimal_digits_and_fits_one_lo_value",
  "tests/dicom/test_deidentify_method_digest.py::test_the_same_inputs_always_give_the_same_digest",
  "tests/dicom/test_deidentify_method_digest.py::test_a_small_synthetic_input_has_the_canonical_form_written_by_hand",
  "tests/dicom/test_deidentify_method_digest.py::test_any_part_of_the_policy_changes_the_digest",
  "tests/dicom/test_deidentify_method_digest.py::test_changing_adding_or_removing_an_engine_file_changes_the_digest",
  "tests/dicom/test_deidentify_method_digest.py::test_python_and_library_versions_leave_the_digest_unchanged",
  "tests/dicom/test_deidentify_markers.py::test_each_preset_adds_exactly_its_markers",
  "tests/dicom/test_deidentify_markers.py::test_basic_clean_descriptors_claims_clean_descriptors_only_where_satisfied",
  "tests/dicom/test_deidentify_markers.py::test_a_custom_option_set_is_named_as_one_and_claims_its_satisfied_options",
  "tests/dicom/test_deidentify_markers.py::test_a_satisfied_list_that_leaves_out_a_selected_option_is_refused",
  "tests/dicom/test_deidentify_markers.py::test_clean_descriptors_is_the_one_selected_option_that_can_go_unsatisfied",
  "tests/dicom/test_deidentify_markers.py::test_tps_import_claims_no_ps3_15_conformance_and_adds_no_codes",
  "tests/dicom/test_deidentify_markers.py::test_patient_identity_removed_is_never_no",
  "tests/dicom/test_deidentify_markers.py::test_the_first_method_value_is_exactly_the_method_digest",
  "tests/dicom/test_deidentify_markers.py::test_every_code_is_a_row_of_the_pinned_context_groups",
  "tests/dicom/test_deidentify_markers.py::test_every_marker_value_is_valid_for_its_vr_and_vm",
  "tests/dicom/test_deidentify_markers.py::test_markers_changed_after_markers_for_are_refused_before_they_are_written",
  "tests/dicom/test_deidentify_markers.py::test_existing_markers_and_contributing_equipment_items_are_kept",
  "tests/dicom/test_deidentify_markers.py::test_the_same_release_and_policy_applied_twice_gives_the_markers_of_one_run",
  "tests/dicom/test_deidentify_markers.py::test_a_code_already_present_is_not_added_again_and_new_codes_follow",
  "tests/dicom/test_deidentify_markers.py::test_marked_output_reads_back_strictly_and_gains_nothing_when_marked_again",
]
note = '''
The markers of an instance are computed from its policy, the de-identification method digest, and the options it satisfies, and added to a copy of its data set (D-012). Patient Identity Removed is set to YES. De-identification Method keeps its values and, unless they already include the pair as two consecutive values, gains two: the method digest, 64 lowercase hexadecimal digits, which fit one LO value, computed from the policy and everything the engine could apply, including its own source and rule files, whether or not the policy's options use them, and then a readable value naming PyMedPhys, its version, the PS3.15 edition, and the preset. The digest identifies the policy and the PyMedPhys implementation and resources that apply it, not the runtime environment, which Software Versions records instead, so upgrading Python, pydicom, or tomlkit leaves it unchanged (D-012, D-024). The digest is PyMedPhys's own provenance, added beside the readable description that this paragraph allows; PS3.15 does not require it. De-identification Method Code Sequence keeps its items and gains the CID 7050 codes of the Basic Profile and of each satisfied option that it does not already hold. Under a policy that claims conformance, every selected option must be satisfied except Clean Descriptors, so that the codes name each option whose actions the instance carries. `tps-import`, which claims no conformance, adds no code and says so in its readable value. Remaining: adding the markers to each instance the engine de-identifies, from its validated result (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-06"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_41258edc-da3a-43bb-ae04-3734051a876b"
text = '''
If the Data Set being de-identified is being stored within a DICOM File, then the File Meta Information including the 128 byte preamble, if present, shall be replaced with a description of the de-identifying application. Otherwise, there is a risk that identity information may leak through unmodified File Meta Information or preamble. See PS3.10. This includes information regarding Application Entity Titles, Presentation Addresses, implementation information, and private information.
'''
status = "partial"
milestone = "M3"
decisions = ["D-002", "D-025", "D-027"]
implementation = ["_dicom/deidentify/file_meta.py"]
tests = [
  "tests/dicom/test_deidentify_file_meta.py::test_the_file_meta_information_holds_exactly_the_seven_elements_in_order",
  "tests/dicom/test_deidentify_file_meta.py::test_the_implementation_class_uid_is_the_first_uid_of_the_reserved_arc",
  "tests/dicom/test_deidentify_file_meta.py::test_the_implementation_version_name_holds_the_version_where_it_fits",
  "tests/dicom/test_deidentify_file_meta.py::test_the_group_length_counts_the_bytes_of_the_elements_after_it",
  "tests/dicom/test_deidentify_file_meta.py::test_a_written_file_has_a_zero_preamble_and_exactly_the_built_elements",
  "tests/dicom/test_deidentify_file_meta.py::test_no_source_file_meta_element_or_preamble_is_written",
]
note = '''
The File Meta Information that replaces the source file's describes the de-identifier by a fixed Implementation Class UID under the PyMedPhys root and an Implementation Version Name, and holds no Application Entity Title, Presentation Address, or private element. A data set is written with it and a zeroed preamble, whatever File Meta Information and preamble the source file held. Remaining: writing each de-identified instance this way (M3).
'''

[[requirement]]
id = "PS3.15-E.1.1-07"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_3f2a2e5f-92da-442a-847e-232d77a14d9d"
text = '''
If the Data Set being de-identified is being communicated by DICOM Real-Time Video, then the File Meta Information including the 128 byte preamble, if present, shall be replaced with a description of the de-identifying application. Otherwise, there is a risk that identity information may leak through unmodified File Meta Information or preamble. See PS3.22. This includes information regarding Application Entity Titles, Presentation Addresses, implementation information, and private information.
'''
status = "not-applicable"
note = '''
The engine reads and writes DICOM files, not DICOM Real-Time Video.
'''

[[requirement]]
id = "PS3.15-E.1.1-08"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_04d7f07b-6ab7-4580-9294-c8bb7cbfec9e"
text = '''
All Data Elements with a Group Number of 0004 shall be removed from any SOP Instance or DICOM File other than a DICOMDIR File. If a DICOMDIR File is required, it shall either be created from the de-identified DICOM Files it references, or an existing DICOMDIR File shall be de-identifed according to this Profile. Any existing non-de-identified DICOMDIR File shall be removed from the File-set.
'''
status = "partial"
milestone = "M4"
decisions = ["D-016"]
implementation = ["_dicom/deidentify/element_rules.py"]
tests = [
  "tests/dicom/test_deidentify_element_rules.py::test_every_element_of_groups_0002_and_0004_in_a_data_set_is_removed",
  "tests/dicom/test_deidentify_element_rules.py::test_each_level_decides_its_elements",
]
note = '''
Every element of group 0004 in a data set, at the top level or in an item, has a rule that removes it, under every policy, before any other rule applies. A source DICOMDIR is never passed through, and none is written, since the output is a plain directory tree rather than a File-set (D-016). Remaining: removing group 0004 from each instance the engine writes, with the rest of the file container (M4).
'''

[[requirement]]
id = "PS3.15-E.1.1-09"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_3980cc0a-c52c-4abd-bb2d-5598fedad2ea"
text = '''
The Attributes listed in Table E.1-1 for each Profile or Option are contained in Standard IODs, or may be contained in Standard Extended IODs. An implementation claiming conformance to the Basic Application Level Confidentiality Profile as a de-identifier shall protect or retain all instances of the Attributes listed in Table E.1-1, whether contained in the top level Data Set or embedded in an Item of a Sequence of Items. The action codes in Table E.1-1a are used in Table E.1-1.
'''
status = "partial"
milestone = "M3"
decisions = ["D-001", "D-007", "D-009", "D-011", "D-020", "D-021", "D-022", "D-028"]
implementation = [
  "_dicom/deidentify/actions.py",
  "_dicom/deidentify/compound_actions.py",
  "_dicom/deidentify/element_rules.py",
  "_dicom/deidentify/elements.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/private_attributes.py",
  "_dicom/deidentify/sequences.py",
  "_dicom/deidentify/source.py",
  "_dicom/deidentify/standard.py",
]
tests = [
  "tests/dicom/test_deidentify_actions.py::test_the_basic_profile_alone_gives_each_attribute_its_profile_action",
  "tests/dicom/test_deidentify_actions.py::test_an_option_overrides_the_profile",
  "tests/dicom/test_deidentify_actions.py::test_each_attribute_has_one_action_or_a_conflict",
  "tests/dicom/test_deidentify_policy.py::test_the_basic_policy_gives_each_attribute_its_basic_profile_action",
  "tests/dicom/test_deidentify_policy.py::test_each_preset_gives_each_attribute_one_action",
  "tests/dicom/test_deidentify_private_attributes.py::test_the_basic_profile_removes_every_private_attribute",
  "tests/dicom/test_deidentify_private_attributes.py::test_private_attributes_in_a_sequence_read_as_unknown_are_removed",
  "tests/dicom/test_deidentify_compound_actions.py::test_each_compound_action_resolves_by_type",
  "tests/dicom/test_deidentify_compound_actions.py::test_the_type_depends_on_the_enclosing_sequence",
  "tests/dicom/test_deidentify_compound_actions.py::test_x_z_on_a_type_1_attribute_writes_the_dummy_value",
  "tests/dicom/test_deidentify_elements.py::test_an_implicit_vr_rt_plan_decodes_rt_assertions_with_the_pinned_vr",
  "tests/dicom/test_deidentify_elements.py::test_un_in_explicit_vr_is_decoded_as_implicit_vr_with_the_pinned_vr",
  "tests/dicom/test_deidentify_elements.py::test_a_vr_that_conflicts_with_the_pinned_dictionary_is_refused",
  "tests/dicom/test_deidentify_elements.py::test_a_sequence_whose_items_cannot_be_read_is_refused",
  "tests/dicom/test_deidentify_sequences.py::test_items_are_decoded",
  "tests/dicom/test_deidentify_sequences.py::test_a_sequence_nested_in_an_item_is_decoded",
  "tests/dicom/test_deidentify_sequences.py::test_an_item_is_decoded_in_its_own_character_set_or_the_one_it_inherits",
  "tests/dicom/test_deidentify_sequences.py::test_a_value_that_is_not_only_items_is_refused",
  "tests/dicom/test_deidentify_element_rules.py::test_each_level_decides_its_elements",
  "tests/dicom/test_deidentify_element_rules.py::test_every_dictionary_attribute_has_the_rule_of_the_first_level_covering_it",
  "tests/dicom/test_deidentify_element_rules.py::test_the_overlay_masks_match_every_repeating_group",
  "tests/dicom/test_deidentify_element_rules.py::test_no_mask_matches_outside_the_repeating_groups",
  "tests/dicom/test_deidentify_element_rules.py::test_a_sequence_given_c_takes_its_basic_profile_action",
  "tests/dicom/test_deidentify_element_rules.py::test_every_element_of_group_0000_in_a_data_set_is_removed",
  "tests/dicom/test_deidentify_elements.py::test_a_un_sequence_that_pydicom_has_decoded_is_refused",
  "tests/dicom/test_deidentify_elements.py::test_text_that_could_not_be_written_back_is_refused",
  "tests/dicom/test_deidentify_source.py::test_an_odd_length_is_refused_where_it_starts",
  "tests/dicom/test_deidentify_source.py::test_the_same_structure_with_even_lengths_is_admitted",
  "tests/dicom/test_deidentify_source.py::test_an_undefined_length_is_admitted",
]
note = '''
Each attribute that Table E.1-1 lists has an action under the Basic Profile and the selected options, an option's action overriding the Profile's, and an attribute to which two selected options give different actions is reported as a conflict. Policy validation rejects every conflict except those the `tps-import` preset resolves, so each preset's policy gives every attribute one action. A compound action of Table E.1-1a resolves to one action from the strictest Type that the instance's IOD gives the attribute at its place, at the top level or in a sequence, and X/Z on a Type 1 or 1C attribute gives D, the non-zero-length dummy value that Table E.1-1a allows Z (D-020). Each element, at the top level or in an item, is read with the VR that the pinned data dictionary gives its attribute, so that the attributes inside a sequence that pydicom does not know and reads as UN, such as an RT Plan's RT Assertions Sequence, can be found; an element whose VR conflicts with the dictionary, or whose value or items do not decode exactly, is reported as undecodable rather than read as pydicom guesses it. Each element, at the top level or in an item, takes the rule of the first source that covers it: the engine's own removals, Table E.1-1's Private Attributes row, the table's other rows, whose masked tags match only the repeating groups, the supplementary rules and UID roles, removal by Type of other text, and the rule for attributes that no rule covers (D-022); a sequence to which an option gives C takes its Basic Profile action (D-009). Every instance of the Private Attributes row is removed from a data set, at the top level and in the items of every standard sequence, including one that pydicom reads as UN (D-028). A source file is admitted only once its whole structure is read from its own bytes, with every Value Length and Item Length but the undefined length even, so that every element at the top level and in items is found. Remaining: protecting or retaining every instance of each other attribute, at the top level and in sequences, and removing private attributes from each instance the engine de-identifies (M3).
'''

[[requirement]]
id = "PS3.15-E.1.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_5b59ff63-97b3-463c-b620-baaf9c1d98c8"
text = '''
The application shall decrypt, using its recipient key, one instance of the Encrypted Content (0400,0520) Attribute within the Encrypted Attributes Sequence (0400,0500) and decode the resulting block of bytes into a DICOM Data Set using the Transfer Syntax specified in the Encrypted Content Transfer Syntax UID (0400,0510). Re-identifiers claiming conformance to this Profile shall be capable of decrypting the Encrypted Content using either AES or Triple-DES in all possible key lengths specified in this Profile.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.2-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_f6c7c02e-f2ab-455f-a868-449791d534b6"
text = '''
The application shall move all Attributes contained in the single item of the Modified Attributes Sequence (0400,0550) of the decoded Data Set into the top level Data Set, replacing "dummy value" Attributes that may be present in the top level Data Set.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.2-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_f9cea275-9cd9-4112-bd77-630521aaecf7"
text = '''
The Attribute Patient Identity Removed (0012,0062) shall be replaced or added to the Data Set with a value of NO and De-identification Method (0012,0063) and De-identification Method Code Sequence (0012,0064) shall be removed.
'''
status = "not-applicable"
decisions = ["D-013"]
note = '''
PyMedPhys does not claim conformance as a re-identifier, and its output carries no Encrypted Attributes Sequence (D-013).
'''

[[requirement]]
id = "PS3.15-E.1.3-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_E.html#para_6d2a4608-8e1e-4783-9841-ff86b8e54bf1"
text = '''
The Conformance Statement of an application that claims conformance to the Basic Application Level Confidentiality Profile shall describe:

- which Attributes are removed during protection;
- which Attributes are replaced by dummy values and how the dummy values are generated;
- which Attributes are included in Encrypted Attributes Data Sets for later re-identification, and any pertinent details about how keys are selected for performing the encryption;
- the scope across which the application is able to ensure referential integrity of replacement values for references such as SOP Instance UID, Frame of Reference UID, etc. if multiple SOP instances are protected (e.g., across multiple Studies, consistent replacement if the same Study processed more than once, etc.);
- which Attributes and Attribute Values are inserted during protection of a SOP instance;
- which Transfer Syntaxes are supported for encoding/decoding of the Encrypted Attributes Data Set;
- which Options are supported;
- any additional restrictions (e. g. key sizes for public keys).
'''
status = "partial"
milestone = "M6"
decisions = ["D-003", "D-004", "D-005", "D-012", "D-013", "D-020", "D-021", "D-026"]
implementation = ["_dicom/deidentify/conformance.py"]
tests = [
  "tests/dicom/test_deidentify_conformance.py::test_every_table_row_and_supplementary_rule_is_listed_with_the_policys_action",
  "tests/dicom/test_deidentify_conformance.py::test_every_ui_attribute_that_the_table_omits_is_listed_by_its_role",
  "tests/dicom/test_deidentify_conformance.py::test_compound_actions_are_resolved_at_every_place_a_supported_iod_defines_them",
  "tests/dicom/test_deidentify_conformance.py::test_x_z_on_a_type_1_attribute_is_described_as_the_dummy_value",
  "tests/dicom/test_deidentify_conformance.py::test_the_dummy_values_are_those_that_d_writes",
  "tests/dicom/test_deidentify_conformance.py::test_the_key_and_the_scope_of_referential_integrity_are_described",
  "tests/dicom/test_deidentify_conformance.py::test_no_attribute_is_encrypted_for_later_reidentification",
  "tests/dicom/test_deidentify_conformance.py::test_options_outside_the_supported_scope_are_listed_as_not_supported",
  "tests/dicom/test_deidentify_conformance.py::test_a_statement_with_sections_still_to_describe_makes_no_claim",
  "tests/dicom/test_deidentify_conformance.py::test_no_enabled_preset_has_an_incomplete_statement",
]
note = '''
The conformance statement of a policy is generated as CommonMark from the policy, the pinned tables, and the engine's parameters. It lists the action of each attribute of Table E.1-1, of each supplementary rule, and of each UI attribute that the table omits, with each compound action resolved by Type at every place where a supported IOD defines the attribute (D-020); the values that Z, D, and U write, including the keyed pseudonyms and replacement UIDs (D-003, D-005, D-021); referential integrity within a run under its 256-bit key, and none across runs (D-004); that no attribute is encrypted for later re-identification, so that no transfer syntax encodes an Encrypted Attributes Data Set (D-013); and the options applied, those that can be composed, and those that are not supported. A statement lists what it cannot yet describe and then claims nothing. Remaining: the attributes and values that the markers insert (D-012), the action for every other element, the action where an IOD requires an attribute that a plain X or Z would leave invalid (D-020), and writing the statement with each run (M6).
'''

[[requirement]]
id = "PS3.15-E.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.2.html#para_5279f5b8-f623-45dc-85f9-a64d7842b064"
text = '''
The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "REMOVED" if none of the Retain Longitudinal Temporal Information Options is applied.
'''
status = "partial"
milestone = "M3"
decisions = ["D-012"]
implementation = ["_dicom/deidentify/markers.py"]
tests = [
  "tests/dicom/test_deidentify_markers.py::test_each_preset_adds_exactly_its_markers",
  "tests/dicom/test_deidentify_markers.py::test_existing_markers_and_contributing_equipment_items_are_kept",
  "tests/dicom/test_deidentify_markers.py::test_temporal_information_modified_keeps_the_stricter_value",
  "tests/dicom/test_deidentify_markers.py::test_an_unknown_temporal_information_modified_is_refused_without_quoting_it",
]
note = '''
Every policy that does not apply Modified Dates, the only Retain Longitudinal Temporal Information Option in scope, sets Longitudinal Temporal Information Modified to REMOVED in its markers, replacing any value already present, since REMOVED is the strictest, and refusing a present value that is not UNMODIFIED, MODIFIED, or REMOVED (D-012). Remaining: adding it to each instance the engine de-identifies (M3).
'''

[[requirement]]
id = "PS3.15-E.3.1-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.html#para_10d107c2-b55c-4b9f-8817-f317d1e756c4"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information burned in to the Pixel Data (7FE0,0010) corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "out-of-scope"
decisions = ["D-015"]
note = '''
The Clean Pixel Data Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.1-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.html#para_caede39a-46e2-4eec-9a38-1a37dbd70926"
text = '''
The Attribute Burned In Annotation (0028,0301) shall be added to the Data Set with a Value of "NO".
'''
status = "out-of-scope"
decisions = ["D-015"]
note = '''
Applies only with the Clean Pixel Data Option. Burned In Annotation is kept as received and never set to NO (D-015).
'''

[[requirement]]
id = "PS3.15-E.3.2-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.2.html#para_e022456d-4042-4795-88e5-80e9fc6aa308"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, if there is sufficient visual information within the Pixel Data of a set of instances to allow an individual to be recognized from the instances themselves or a reconstruction of a set of instances, then sufficient removal or distortion of the Pixel Data shall be applied to prevent recognition.
'''
status = "out-of-scope"
decisions = ["D-015"]
note = '''
The Clean Recognizable Visual Features Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.2-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.2.html#para_94fec0c3-65fa-465b-a269-59d262066345"
text = '''
The Attribute Recognizable Visual Features (0028,0302) shall be added to the Data Set with a Value of "NO".
'''
status = "out-of-scope"
decisions = ["D-015"]
note = '''
Applies only with the Clean Recognizable Visual Features Option. Recognizable Visual Features is kept as received and never set to NO (D-015).
'''

[[requirement]]
id = "PS3.15-E.3.3-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.3.html#para_628bbc9f-6ba4-4316-bfcd-fdc7bc2d3076"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information encoded in graphics, text annotations or overlays corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "out-of-scope"
note = '''
The Clean Graphics Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.4-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.4.html#para_004bdf87-7f40-48e2-b5f4-eab3e21d7103"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information encoded in SR Content Items or Acquisition Context or Specimen Preparation Sequence Items corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed.
'''
status = "out-of-scope"
decisions = ["D-010"]
note = '''
The Clean Structured Content Option is later work. Until then, Structured Reports are sequestered (D-010).
'''

[[requirement]]
id = "PS3.15-E.3.5-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.5.html#para_eb16943f-79ba-4765-bedf-94a66b6744ac"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, any information that is embedded in text or string Attributes corresponding to the Attribute information specified to be removed by the Profile and any other Options specified shall also be removed, as described in Table E.1-1.
'''
status = "partial"
milestone = "M4"
decisions = ["D-009", "D-022"]
implementation = ["_dicom/deidentify/roi_names.py"]
tests = [
  "tests/dicom/test_deidentify_roi_names.py::test_a_name_that_matches_once_case_whitespace_and_separators_are_disregarded_is_written_in_the_vocabularys_spelling",
  "tests/dicom/test_deidentify_roi_names.py::test_a_near_match_goes_to_review",
  "tests/dicom/test_deidentify_roi_names.py::test_a_name_that_matches_more_than_one_vocabulary_name_goes_to_review",
  "tests/dicom/test_deidentify_roi_names.py::test_a_name_that_echoes_a_known_identifier_goes_to_review",
  "tests/dicom/test_deidentify_roi_names.py::test_different_names_that_would_be_written_as_one_vocabulary_name_go_to_review",
  "tests/dicom/test_deidentify_roi_names.py::test_a_nomenclature_without_the_tg263_attribution_is_rejected",
  "tests/dicom/test_deidentify_roi_names.py::test_an_unpublished_vocabulary_is_refused",
  "tests/dicom/test_deidentify_roi_names.py::test_a_vocabulary_name_with_a_hyphen_is_not_matched_without_it",
  "tests/dicom/test_deidentify_roi_names.py::test_a_name_with_a_leading_underscore_or_hyphen_goes_to_review",
]
note = '''
The first supported release includes the Option for ROI names (D-009). The automatic tier decides, for the ROI names of one structure set, which are written in the spelling of the TG-263 spreadsheet's published edition, whose entries' digest the module records, because they match one of its names once case, spaces, and the separators `_` and `-` are disregarded (a hyphen in a vocabulary name, which TG-263 writes for a subtraction, must be matched by one, and a name starting with `_`, which TG-263 gives a structure not used for dose evaluation, or `-` goes to review), and which go to review, because they match none or several, echo a known patient or other person identifier, or would duplicate a differently spelt name of the same structure set. A name so written is cleaned, not retained, so it needs no review before the claim. Remaining: applying these decisions to each data set (M3); review of the other names, each kept, mapped, or emptied by a reviewer, with a reviewed-names list reused on later runs, and holding an instance whose names nobody has reviewed unless the user chooses explicitly to empty such names, and recording each rename in the QC material (M4); vocabularies converted from an institutional list, every match against which goes to review; and claiming the Option only for output whose retained descriptors have passed pooled human review, which needs the QC pack (M4).
'''

[[requirement]]
id = "PS3.15-E.3.5-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.5.html#para_aa4daf86-3e83-4fb1-bb77-75ca192fa98b"
text = '''
The manner of cleaning shall be described in the Conformance Statement.
'''
status = "planned"
milestone = "M6"
decisions = ["D-009"]

[[requirement]]
id = "PS3.15-E.3.6-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_389c7767-f03f-4716-970d-72a2766aabfa"
text = '''
When the Retain Longitudinal Temporal Information With Full Dates Option is specified in addition to the Basic Application Level Confidentiality Profile, any dates and times present in the Attributes shall be retained, as described in Table E.1-1. The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "UNMODIFIED".
'''
status = "out-of-scope"
note = '''
The Retain Longitudinal Temporal Information with Full Dates Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.6-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_b71081d0-569f-4426-aa01-b0765ce1ab32"
text = '''
When the Retain Longitudinal Temporal Information With Modified Dates Option is specified in addition to the Basic Application Level Confidentiality Profile, any dates and times present in the Attributes listed in Table E.1-1 shall be modified. The modification of the dates and times shall be performed in a manner that:

- aggregates or transforms dates so as to reduce the possibility of matching for re-identification
- preserves the gross longitudinal temporal relationships between images obtained on different dates to the extent necessary for the application
- preserves the fine temporal relationships between images and real-world events to the extent necessary for analysis of the images for the application
'''
status = "partial"
milestone = "M3"
decisions = ["D-006", "D-007"]
implementation = [
  "_dicom/deidentify/dates.py",
  "_dicom/deidentify/policy.py",
  "_dicom/deidentify/profiles.py",
  "_dicom/deidentify/temporal_roles.py",
]
tests = [
  "tests/dicom/test_deidentify_dates.py::test_an_offset_is_52_to_520_whole_weeks_and_never_zero",
  "tests/dicom/test_deidentify_dates.py::test_shifting_preserves_intervals_and_weekdays",
  "tests/dicom/test_deidentify_dates.py::test_a_datetime_moves_its_date_and_keeps_its_time_and_utc_offset",
  "tests/dicom/test_deidentify_profiles.py::test_profiles_persist_across_runs",
  "tests/dicom/test_deidentify_profiles.py::test_a_stored_offset_wins_over_a_changed_derivation",
  "tests/dicom/test_deidentify_temporal_roles.py::test_every_temporal_attribute_in_the_dictionary_has_exactly_one_role",
  "tests/dicom/test_deidentify_temporal_roles.py::test_every_attribute_modified_dates_cleans_has_a_role",
  "tests/dicom/test_deidentify_temporal_roles.py::test_modified_dates_shifts_subject_events_and_normalises_time_zones",
  "tests/dicom/test_deidentify_dates.py::test_local_times_keep_their_interval_to_values_with_their_own_offset",
  "tests/dicom/test_deidentify_dates.py::test_converting_to_local_time_keeps_every_interval",
  "tests/dicom/test_deidentify_dates.py::test_frame_origin_timestamps_keep_their_intervals",
  "tests/dicom/test_deidentify_policy.py::test_tps_import_modifies_the_eleven_device_identity_and_date_conflicts",
]
note = '''
Each subject's offset is persisted in its profile, DA and DT values are shifted by whole weeks, keeping intervals, weekdays, and times, and every attribute that Table E.1-1 cleans under Modified Dates has a reviewed role that decides whether it is shifted or replaced by a dummy value. Time zone offsets become a nominal +0000 once each DT value with its own offset is in the instance's local time, which keeps every interval within the instance. Under `tps-import`, the eleven device and beam hold dates and times that Retain Device Identity would keep are modified by their role instead. Remaining: modifying every date and time in a data set (M3).
'''

[[requirement]]
id = "PS3.15-E.3.6-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_eb42e924-3cfc-4d91-aa01-0f153b41b88c"
text = '''
The Attribute Longitudinal Temporal Information Modified (0028,0303) shall be added to the Data Set with a Value of "MODIFIED".
'''
status = "partial"
milestone = "M3"
decisions = ["D-012"]
implementation = ["_dicom/deidentify/markers.py"]
tests = [
  "tests/dicom/test_deidentify_markers.py::test_each_preset_adds_exactly_its_markers",
  "tests/dicom/test_deidentify_markers.py::test_a_custom_option_set_with_modified_dates_marks_dates_as_modified",
  "tests/dicom/test_deidentify_markers.py::test_temporal_information_modified_keeps_the_stricter_value",
]
note = '''
Every policy that applies Modified Dates, including `tps-import`, sets Longitudinal Temporal Information Modified to MODIFIED in its markers, unless REMOVED is already present from an earlier run, which is kept because the dates that run removed are not restored (D-012). Remaining: adding it to each instance the engine de-identifies (M3).
'''

[[requirement]]
id = "PS3.15-E.3.6-04"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.6.html#para_cc45149e-ac5e-4b26-bb5f-b8af861cc54d"
text = '''
The manner of date modification shall be described in the Conformance Statement.
'''
status = "planned"
milestone = "M6"
decisions = ["D-006", "D-007"]

[[requirement]]
id = "PS3.15-E.3.7-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.7.html#para_2c0a8a67-3b2e-4aad-9153-8491ced6d071"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, information about age, sex, height and weight and other characteristics present in the Attributes shall be retained, as described in Table E.1-1.
'''
status = "planned"
milestone = "M3"
decisions = ["D-011"]

[[requirement]]
id = "PS3.15-E.3.7-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.7.html#para_324c4b43-2572-4a19-917c-cab57003b769"
text = '''
The manner of cleaning of retained Attributes shall be described in the Conformance Statement.
'''
status = "planned"
milestone = "M6"

[[requirement]]
id = "PS3.15-E.3.8-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.8.html#para_b25bc4b3-fc71-4f14-b464-79b8a6591b62"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, information about the identity of the device in the Attributes shall be retained, as described in Table E.1-1.
'''
status = "planned"
milestone = "M3"
decisions = ["D-003", "D-007", "D-022"]
note = '''
`tps-import` also selects Modified Dates, which conflicts with this Option for device dates, so its output claims neither (D-007).
'''

[[requirement]]
id = "PS3.15-E.3.9-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.9.html#para_d44e046d-c417-4283-9556-695a778ca4f5"
text = '''
When this Option is specified in addition to an Application Level Confidentiality Profile, UIDs shall be retained, as described in Table E.1-1.
'''
status = "out-of-scope"
note = '''
The Retain UIDs Option is not supported.
'''

[[requirement]]
id = "PS3.15-E.3.10-01"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_bb1aaf5b-ab3d-4b05-8226-c7282cf98dc9"
text = '''
When this Option is specified in addition to the Basic Application Level Confidentiality Profile, Private Attributes that are known by the de-identifier to be safe from identity leakage shall be retained, together with the Private Creator IDs that are required to fully define the retained Private Attributes; all other Private Attributes shall be removed or processed in the element-specific manner recommended by Deidentification Action (0008,0307), if present within Private Data Element Characteristics Sequence (0008,0300) (see PS3.3 Section C.12.1).
'''
status = "planned"
milestone = "M3"
decisions = ["D-001", "D-028"]
note = '''
Until reviewed rules say which private attributes are safe, a policy that selects the Option is refused (D-028).
'''

[[requirement]]
id = "PS3.15-E.3.10-02"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_0c838fa8-6930-4559-a492-67c204358848"
text = '''
When this Option is not specified, all Private Attributes shall be removed, as described in Table E.1-1.
'''
status = "partial"
milestone = "M3"
decisions = ["D-028"]
implementation = [
  "_dicom/deidentify/private_attributes.py",
  "_dicom/deidentify/sequences.py",
]
tests = [
  "tests/dicom/test_deidentify_private_attributes.py::test_the_basic_profile_removes_every_private_attribute",
  "tests/dicom/test_deidentify_private_attributes.py::test_a_private_sequence_is_removed_with_everything_in_it",
  "tests/dicom/test_deidentify_private_attributes.py::test_every_odd_group_element_is_removed",
  "tests/dicom/test_deidentify_private_attributes.py::test_each_preset_without_retain_safe_private_removes_private_attributes",
  "tests/dicom/test_deidentify_private_attributes.py::test_private_attributes_read_from_a_file_are_removed",
  "tests/dicom/test_deidentify_private_attributes.py::test_private_attributes_in_a_sequence_read_as_unknown_are_removed",
  "tests/dicom/test_deidentify_private_attributes.py::test_an_unknown_value_that_cannot_be_read_as_items_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_a_sequence_that_pydicom_cannot_decode_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_an_unknown_character_set_in_an_item_read_from_a_file_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_an_unknown_character_set_in_an_item_of_an_unknown_value_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_a_character_set_that_pydicom_does_not_map_as_given_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_a_character_set_stored_with_another_vr_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_a_sequence_stored_with_another_vr_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_a_malformed_sequence_read_from_explicit_vr_is_refused",
  "tests/dicom/test_deidentify_private_attributes.py::test_items_nested_deeper_than_can_be_read_are_refused",
]
note = '''
Every element of an odd group, including private creators and the elements that PS3.5 does not allow, is removed from a data set, at the top level and in the items of every standard sequence, including one that pydicom reads as UN, and a private sequence is removed with everything in it. A standard sequence that cannot be decoded exactly, that is stored with a VR other than SQ or UN, or whose items have a Specific Character Set that pydicom does not map as given or that is stored with another VR, is refused by its path; it is removed where a rule removes it or a sequence that holds it, and otherwise its instance is sequestered (D-028). Remaining: removing them from each instance the engine de-identifies (M3).
'''

[[requirement]]
id = "PS3.15-E.3.10-03"
url = "https://dicom.nema.org/medical/dicom/current/output/chtml/part15/sect_E.3.10.html#para_d9eb6fdb-b5c9-44d8-91f9-e0fe71983689"
text = '''
When an entire Sequence (SQ VR) Private Attribute is not known to always only contain safe content, whether that content consists of Standard Attributes or Private Attributes or a combination of both, then when the Retain Safe Private Option is used, any such Sequence Attribute shall be parsed in its entirety and each of the nested Attributes handled on its own merits, rather than removing the Sequence in its entirety without further consideration. Reviewing the content may be a sensible practice to apply even to nominally known safe Private Sequence Attributes.
'''
status = "planned"
milestone = "M3"
decisions = ["D-028"]
note = '''
Without the Option, a private sequence is removed with everything in it, and a policy that selects the Option is refused until reviewed rules say which private attributes are safe (D-028).
'''


# Supplementary (L2) rules: the role of every date, time, and datetime (DA,
# DT, and TM) attribute in the pinned PS3.6 data dictionary, and of every
# other attribute that Table E.1-1 cleans under Retain Longitudinal Temporal
# Information with Modified Dates, curated by hand against the attribute
# descriptions in PS3.3.
#
# subject-event: an event in the subject's record, such as an acquisition,
#   a treatment, or a review of the subject's data.
# radiation-source: the reference date and time of a brachytherapy source's
#   strength.
# device: a property of equipment, such as its calibration or installation.
# vocabulary-version: the version of a context group or template.
# time-zone: a time zone offset.
# other: any other date, such as a product's expiry or a clinical trial's
#   ethics approval.
#
# Where Retain Longitudinal Temporal Information with Modified Dates is
# selected, subject-event and radiation-source values move by the subject's
# offset, a time-zone value becomes +0000 once every DT value with its own
# offset is in the instance's local time, and values of every other role are
# replaced by a fixed dummy value. Otherwise Table E.1-1 decides, or, for an
# attribute that it omits, the attribute's supplementary action.
#
# Rules also cover attributes that Table E.1-1 omits, and attributes of other
# VRs that it cleans under Modified Dates. A subject event that Table E.1-1
# lists with C under Modified Dates needs no note; every other rule says why
# it has its role.


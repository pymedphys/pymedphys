# Validator findings that de-identification introduces, and why each is not
# an unexplained conformance failure of the output. dicom_validation.py reads
# this file; a finding that no entry matches fails the comparison.
#
# Each entry matches a finding by validator, severity, and message type
# exactly, and by its attribute path against any of the fnmatch patterns in
# paths. The category is one of:
#
# - profile: the action that PS3.15 Table E.1-1 names for the attribute,
#   or another requirement of the profile or of a selected option, gives
#   the finding, and the engine applies it as PS3.15 requires;
# - validator: a limitation or heuristic of the validator, where the output
#   conforms;
# - source: a defect of the input that the de-identification cannot repair,
#   where each output conforms to its own IOD, which the per-file
#   validators check;
# - engine: a defect of the engine's output, recorded here until it is
#   fixed, when its entry is removed.
#
# An entry whose explanation rests on a property of the output, or of the
# output with its input, names it in requires, one of
# dicom_validation.PREMISES, and explains the finding only where the files
# have it. One of dicom_validation.ATTRIBUTE_PREMISES, which
# dcentvfy's comparison of a patient's outputs evaluates, explains it only
# for an attribute that the premise holds for.
#
# Keep entries narrow: a pattern of "*" is for findings that do not depend
# on the attribute's place.

[[difference]]
validator = "dciodvfy"
severity = "warning"
message = "Missing attribute or value that would be needed to build DICOMDIR"
paths = ["(0008,0020)", "(0008,0030)", "(0020,0010)"]
category = "profile"
reason = """
The Basic Profile gives Study Date, Study Time, and Study ID the action Z,
which leaves these Type 2 attributes present and empty, as their IODs allow.
A DICOMDIR's study record needs values for them, so dciodvfy warns.
"""

[[difference]]
validator = "dciodvfy"
severity = "warning"
message = "Value dubious for this VR [PN] = <value> - Retired Person Name form"
paths = ["*"]
category = "validator"
reason = """
dciodvfy warns about every Person Name without a component delimiter, as a
retired form. The engine's dummy Person Name, DEIDENTIFIED, is
a family name component alone, which PS3.5 Section 6.2 allows, since trailing
empty components and their delimiters may be omitted.
"""

[[difference]]
validator = "dciodvfy"
severity = "warning"
message = "Attribute is not present in standard DICOM IOD"
paths = ["(0028,0301)"]
category = "profile"
requires = "clean-pixel-data-claimed"
reason = """
PS3.15 E.3.1 has the Clean Pixel Data Option add Burned In Annotation with
the value NO, without an exception for an IOD that does not define it, such
as RT Plan, RT Structure Set, or MR Spectroscopy. There it is a standard
attribute of a Standard Extended SOP Class (PS3.2 Section 7.3), which the
conformance statement describes. The entry applies only to an output that
claims the option by its code, so the attribute added to any other output
stays unexplained.
"""

[[difference]]
validator = "dicom-validator"
severity = "error"
message = "TagUnexpected (Type Undefined)"
paths = ["(0028,0301)"]
category = "profile"
requires = "clean-pixel-data-claimed"
reason = """
As for dciodvfy's warning: E.3.1 adds Burned In Annotation with the
option's code even where the IOD does not define it.
"""

[[difference]]
validator = "dciodvfy"
severity = "warning"
message = "Attribute is not present in standard DICOM IOD"
paths = ["(0028,0302)"]
category = "profile"
requires = "clean-recognizable-visual-features-claimed"
reason = """
PS3.15 E.3.2 has the Clean Recognizable Visual Features Option add
Recognizable Visual Features with the value NO, without an exception for an
IOD that does not define it, such as RT Plan, RT Structure Set, or MR
Spectroscopy. There it is a standard attribute of a Standard Extended SOP
Class (PS3.2 Section 7.3), which the conformance statement describes.
The entry applies only to an output that claims the option by its code, so
the attribute added to any other output stays unexplained.
"""

[[difference]]
validator = "dicom-validator"
severity = "error"
message = "TagUnexpected (Type Undefined)"
paths = ["(0028,0302)"]
category = "profile"
requires = "clean-recognizable-visual-features-claimed"
reason = """
As for dciodvfy's warning: E.3.2 adds Recognizable Visual Features with the
option's code even where the IOD does not define it.
"""

[[difference]]
validator = "dciodvfy"
severity = "warning"
message = "Attribute is not present in standard DICOM IOD"
paths = ["(0044,0110)/*"]
category = "validator"
reason = """
RT Assertions Sequence (0044,0110) is newer than the dicom3tools snapshot,
which therefore knows no attribute below it. The findings are the elements
of the dummy Person Identification Code Sequence (0040,1101) item that the
Basic Profile's action D writes there; dicom-validator, which reads the
pinned edition, finds nothing there.
"""

[[difference]]
validator = "dciodvfy"
severity = "warning"
message = "Attribute is not present in standard DICOM IOD"
paths = [
  "(3008,0020)/(300A,0740)/(300A,0746)/(0040,1101)/(0008,0100)",
  "(3008,0020)/(300A,0740)/(300A,0746)/(0040,1101)/(0008,0102)",
  "(3008,0020)/(300A,0740)/(300A,0746)/(0040,1101)/(0008,0104)",
  "(3008,0021)/(300A,0740)/(300A,0746)/(0040,1101)/(0008,0100)",
  "(3008,0021)/(300A,0740)/(300A,0746)/(0040,1101)/(0008,0102)",
  "(3008,0021)/(300A,0740)/(300A,0746)/(0040,1101)/(0008,0104)",
  "(3008,0020)/(300A,0740)/(300A,0746)/(0008,0082)/(0008,0100)",
  "(3008,0020)/(300A,0740)/(300A,0746)/(0008,0082)/(0008,0102)",
  "(3008,0020)/(300A,0740)/(300A,0746)/(0008,0082)/(0008,0104)",
  "(3008,0021)/(300A,0740)/(300A,0746)/(0008,0082)/(0008,0100)",
  "(3008,0021)/(300A,0740)/(300A,0746)/(0008,0082)/(0008,0102)",
  "(3008,0021)/(300A,0740)/(300A,0746)/(0008,0082)/(0008,0104)",
]
category = "validator"
reason = """
In an RT Beams Treatment Record or an RT Ion Beams Treatment Record,
Interlock Resolution User Sequence (300A,0746), in the Interlock Sequence
(300A,0740) of each Treatment Session Beam Sequence (3008,0020) or
Treatment Session Ion Beam Sequence (3008,0021) item, includes the Person
Identification Macro (PS3.3 Table 10-1), whose Person Identification Code
Sequence (0040,1101) and Institution Code Sequence (0008,0082) each hold a
Code Sequence Macro item. The dicom3tools snapshot knows no attribute of
either item there.
The findings are the Code Value, Coding Scheme Designator, and Code Meaning
of the dummy items that the Basic Profile's action D writes in the two
sequences; dicom-validator, which reads the pinned edition, finds nothing
there.
"""

[[difference]]
validator = "dciodvfy"
severity = "error"
message = "ReferencedSeriesSequence present but Instance does not reference Instances"
paths = ["(0008,1115)"]
category = "validator"
requires = "instances-of-this-study-referenced-elsewhere"
reason = """
The Common Instance Reference Module's Referenced Series Sequence is Type 1C,
required if the instance references instances in its study, from any of its
modules (PS3.3 Section C.12.2). The Basic Profile's action X/Z/U* removes
Referenced Image Sequence (0008,1140) and Source Image Sequence (0008,2112),
or empties them where they are Type 2, as in the Functional Group Macros of
the enhanced and legacy converted enhanced images. dciodvfy's condition
counts references from only a few sequences, among them Source Image, Source
Instance, Referenced Image, and Referenced Instance Sequences, so it reports
the sequence wherever those no longer reference anything, even where the
output references the instances that it lists elsewhere, such as from
Referenced Image Evidence Sequence (0008,9092), Referenced Defined Protocol
Sequence (0018,990C), or Conversion Source Attributes Sequence (0020,9172).
Adding one Referenced Image Sequence item to such an output clears the
finding. The entry applies only to an output that still references, outside
the module, an instance that the sequence lists, where the condition is met.
Where no reference to an instance survives outside the module, the engine
removes both of the module's sequences.
"""

[[difference]]
validator = "dciodvfy"
severity = "error"
message = "StudiesContainingOtherReferencedInstancesSequence present but Instance does not reference Instances"
paths = ["(0008,1200)"]
category = "validator"
requires = "instances-of-other-studies-referenced-elsewhere"
reason = """
As for Referenced Series Sequence (0008,1115): the Common Instance Reference
Module's Studies Containing Other Referenced Instances Sequence is Type 1C,
required if the instance references instances in other studies from any of
its modules, and dciodvfy's condition counts only a few sequences. The entry
applies only to an output that still references, outside the module, an
instance that the sequence lists.
Where no reference to an instance survives outside the module, the engine
removes both of the module's sequences.
"""

[[difference]]
validator = "dicom-validator"
severity = "error"
message = "TagUnexpected (Type Undefined)"
paths = [
  "(0018,0060)",
  "(0018,1110)",
  "(0018,1111)",
  "(0018,1150)",
  "(0018,1151)",
  "(0018,1152)",
  "(0018,1153)",
  "(0018,1156)",
  "(0018,1160)",
  "(0018,1191)",
  "(0018,11A0)",
  "(0018,7050)",
  "(0018,7052)",
  "(0018,7054)",
  "(0018,7056)",
  "(0018,7058)",
  "(0018,8150)",
  "(0018,8151)",
]
category = "validator"
reason = """
In the Digital X-Ray Image IOD (PS3.3 Table A.26-1), the user-optional X-Ray
Acquisition Dose Module (Table C.8-33) shares these attributes with the
user-optional DX Positioning, X-Ray Filtration, and X-Ray Generation Modules.
Each module defines each of them as Type 3, so an output that keeps them
conforms. dicom-validator checks a user-optional module only where the data
set holds an attribute of it that no other module present holds. X-Ray
Filtration has none of its own, and the Basic Profile removes attributes
that are the other three modules' own: Comments on Radiation Dose
(0040,0310) of X-Ray Acquisition Dose, Generator ID (0018,1005) and Exposure
Control Mode Description (0018,7062) of X-Ray Generation, and Paddle
Description (0018,11A4) of DX Positioning. Where an output keeps no
attribute of a module's own, the validator checks none of the modules that
share these attributes and reports each of them as unexpected, as it does in
a source that never held such an attribute.
"""

[[difference]]
validator = "dcentvfy"
severity = "warning"
message = "Attribute present in one instance but not the other"
paths = ["*"]
category = "source"
requires = "each-iod-decides-in-a-series-of-mixed-modalities"
reason = """
PS3.3 Section A.1.2.3 requires every instance of a series to be of one
modality and to have the same Series information. An input series of more
than one modality, such as a PET series that holds CT Image instances under
its Series Instance UID, already breaks the first requirement, which no
de-identification can repair. Each instance's own IOD then decides the
action of each attribute. Table E.1-1 gives Series Date (0008,0021) and
Series Time (0008,0031) X/D, a dummy value where the IOD makes them Type 1,
as the PET Series Module does, and removal where it makes them Type 3, as
the General Series Module does; and the engine removes a sequence that the
IOD does not define, such as Radiopharmaceutical Information Sequence
(0054,0016) in a CT Image. So outputs whose inputs all held the attribute
differ by SOP Class, although each conforms to its own IOD. A series of one
modality, which A.1.2.3 allows to mix IODs, gets no such explanation, nor
does an attribute whose outputs differ within one SOP Class, nor an
occurrence beyond those that the mixed series gives when checked alone.
"""

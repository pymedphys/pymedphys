# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/SimonBiggs/nbstripout
    rev: 0a4fa37151ce3c2fb522bf64469224c831a41773
    hooks:
      - id: nbstripout
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^.*demographic\.000000$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb", "500"]
        # Generated from the DICOM standard and checked against their recorded
        # digests; the PS3.6 data dictionary alone exceeds 500 KB.
        exclude: ^lib/pymedphys/_dicom/deidentify/_standard/
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        # Offline static audits only; the security workflow runs the online
        # audits with a token. Findings below medium severity do not block.
        args: ["--no-online-audits", "--min-severity", "medium"]
  # Ruff runs from the project environment, so its version is the one pinned in
  # uv.lock (the pre-commit dependency group installs it in CI). Notebooks and
  # Markdown are left out, as they were with the ruff-pre-commit hook.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    # Keep in step with the setup-uv version in .github/actions/setup-project.
    rev: 0.12.15
    hooks:
      - id: uv-lock

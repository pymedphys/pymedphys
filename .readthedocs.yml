# Which pushes and pull requests build is decided before a build is queued, by
# automation rules in the Read the Docs dashboard, not by this file. See
# "Read the Docs" in lib/pymedphys/docs/contrib/info/workflows.md.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    pre_build:
      - "pymedphys dev docs --prep"

# The locked environment that CI's documentation build uses: uv sync installs
# the project and the docs group from uv.lock. Read the Docs does not pass
# --no-default-groups, so it also installs the default dev group unless the
# project's Read the Docs settings define UV_NO_DEFAULT_GROUPS=1.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  builder: html
  fail_on_warning: true
  configuration: lib/pymedphys/docs/conf.py
